<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midnight Clock</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  body {
    position: relative;
    background: #080b16;
    color: #f5f7ff;
    font-family: "Arial", "Helvetica Neue", sans-serif;
  }
  body:before, body:after { content: ""; position: absolute; border-radius: 50%; pointer-events: none; }
  body:before {
    width: 78vw; height: 78vw; right: -31vw; top: -45vw;
    border: 1px solid rgba(139, 125, 255, .15);
    box-shadow: 0 0 0 5vw rgba(139, 125, 255, .025), 0 0 0 12vw rgba(139, 125, 255, .018);
  }
  body:after {
    width: 60vw; height: 60vw; left: -38vw; bottom: -43vw;
    background: radial-gradient(circle, rgba(42, 193, 213, .13) 0, rgba(42, 193, 213, 0) 68%);
  }
  .layout { position: relative; z-index: 1; width: 100%; height: 100%; padding: 5.5vh 7vw; }
  .topline { color: #8992ad; font-size: 1.05vw; letter-spacing: .34em; text-transform: uppercase; }
  .topline .dot { display: inline-block; width: .55vw; height: .55vw; margin: 0 1vw .1vw 0; border-radius: 50%; background: #6eebcf; box-shadow: 0 0 1.2vw rgba(110, 235, 207, .65); }
  .center { position: absolute; left: 4vw; right: 4vw; top: 50%; text-align: center; transform: translateY(-53%); }
  .date { color: #a8afc7; font-size: 2vw; font-weight: 400; letter-spacing: .13em; text-transform: uppercase; }
  .clock { margin-top: 2vh; white-space: nowrap; font-size: 23vw; line-height: .98; font-weight: 200; letter-spacing: -.075em; font-variant-numeric: tabular-nums; }
  .digits { display: inline-block; text-shadow: 0 0 5vw rgba(132, 140, 255, .12); }
  .colon { display: inline-block; padding: 0 .035em; color: #8e8aff; text-shadow: 0 0 3vw rgba(142, 138, 255, .5); }
  .seconds { display: inline-block; margin-left: 1.4vw; color: #777f9c; font-size: 5.2vw; font-weight: 300; letter-spacing: .02em; vertical-align: 17%; }
  .bottom { position: absolute; left: 7vw; right: 7vw; bottom: 5vh; display: table; width: 86vw; color: #69728c; font-size: 1.15vw; letter-spacing: .16em; text-transform: uppercase; }
  .bottom span { display: table-cell; }
  .bottom .hint { text-align: right; letter-spacing: .08em; text-transform: none; }
  @media (orientation: portrait) {
    .layout { padding-top: 4vh; }
    .topline { font-size: 2.4vw; }
    .center { left: 3vw; right: 3vw; }
    .date { font-size: 4vw; }
    .clock { font-size: 24vw; }
    .seconds { font-size: 7vw; }
    .bottom { font-size: 2.5vw; }
  }
</style>
</head>
<body>
<div class="layout">
  <div class="topline"><span class="dot"></span>Local time</div>
  <div class="center">
    <div class="date" id="date"></div>
    <div class="clock"><span class="digits" id="hours"></span><span class="colon">:</span><span class="digits" id="minutes"></span><span class="seconds" id="seconds"></span></div>
  </div>
  <div class="bottom"><span>Midnight</span><span class="hint">Back to return home</span></div>
</div>
<script src="/addon/sdk.js"></script>
<script>
  /* ES5 only: this page runs on Chromium 68 (webOS 5) too. */
  function two(n) { return (n < 10 ? '0' : '') + n; }
  function tick() {
    var now = new Date();
    var dateText = now.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
    document.getElementById('hours').textContent = two(now.getHours());
    document.getElementById('minutes').textContent = two(now.getMinutes());
    document.getElementById('seconds').textContent = two(now.getSeconds());
    document.getElementById('date').textContent = dateText;
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
