<!doctype html>
<!-- CleanYourTV screen saver: replaces LG's screen saver app (docs/screensaver.md). Photos come from the wallpaper library through
     the service (GET /api/screensaver/photos, the pictures themselves from /api/wallpapers/photo/...), with a dim clock and date in
     the corner. Written for the TV's Chromium 68 and up: ES5 style, only opacity changes, nothing else animates.
     The first key, click or touch closes the page: the app that was on screen comes back (the page is an overlay window). -->
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CleanYourTV</title>
<style>
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
  body { font-family: 'LG Smart UI', 'Helvetica Neue', Arial, sans-serif; color: #fff; cursor: none; }
  #p0, #p1 {
    position: fixed; left: 0; top: 0; right: 0; bottom: 0;
    background-repeat: no-repeat; background-position: 50% 50%; background-size: cover;
    opacity: 0; transition: opacity 1.4s linear;
  }
  #p0.on, #p1.on { opacity: 1; }
  #scrim {
    position: fixed; left: 0; top: 0; right: 0; bottom: 0;
    background: radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 45%, rgba(0,0,0,.42) 100%);
  }
  #clock {
    position: fixed; right: 4.6vw; bottom: 4.2vh; text-align: right;
    text-shadow: 0 1px 18px rgba(0,0,0,.55);
    transition: opacity 3s linear; opacity: .72;
  }
  #clock.dim { opacity: .3; }
  #time { font-size: 4.6vw; font-weight: 200; letter-spacing: .01em; line-height: 1.05; }
  #date { margin-top: .5em; font-size: 1.35vw; font-weight: 300; letter-spacing: .06em; text-transform: uppercase; opacity: .75; }
</style>
</head><body>
<div id="p0"></div>
<div id="p1"></div>
<div id="scrim"></div>
<div id="clock"><div id="time"></div><div id="date"></div></div>
<script>
var API = 'http://127.0.0.1:8765';
var list = [], order = [], pos = 0, every = 25, side = 0, timer = 0, started = false, closed = false, upAt = Date.now();
function el(id) { return document.getElementById(id); }

/* the way out. It is defined first, so that a failure further down still leaves the remote working. */
function dismiss() {
  if (closed) return;
  closed = true;
  try { var x = new XMLHttpRequest(); x.open('POST', API + '/api/screensaver/dismiss', true); x.send('{}'); } catch (e) {}
  /* the service closes the page as well; these are the page's own ways out where one of them works */
  setTimeout(function () { try { window.close(); } catch (e) {} try { webOSSystem.hide(); } catch (e) {} }, 400);
}
document.addEventListener('keydown', dismiss, true);
document.addEventListener('mousedown', dismiss, true);
document.addEventListener('touchstart', dismiss, true);

function get(url) {
  return new Promise(function (resolve) {
    var x = new XMLHttpRequest();
    x.open('GET', url, true);
    x.onload = function () { try { resolve(JSON.parse(x.responseText)); } catch (e) { resolve({}); } };
    x.onerror = x.ontimeout = function () { resolve({}); };
    x.send();
  });
}

function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1)), t = a[i];
    a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* one photo at a time, cross-faded between the two layers: opacity only, the GPU of these TVs is weak */
function show() {
  if (!order.length) return;
  var id = order[pos % order.length], url = API + '/api/wallpapers/photo/' + id;
  pos++;
  var im = new Image();
  im.onload = function () {
    var on = el(side ? 'p1' : 'p0'), off = el(side ? 'p0' : 'p1');
    side ^= 1;
    on.style.backgroundImage = 'url("' + url + '")';
    on.className = 'on';
    off.className = '';
  };
  im.src = url;
}

function arm() {
  clearInterval(timer);
  if (order.length < 2) return;
  timer = setInterval(show, Math.max(10, every) * 1000);
}

function pad(n) { return (n < 10 ? '0' : '') + n; }
function tickClock() {
  var d = new Date(), h = d.getHours(), m = d.getMinutes();
  el('time').textContent = pad(h) + ':' + pad(m);
  try {
    el('date').textContent = d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
  } catch (e) {
    el('date').textContent = pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear();
  }
  /* the clock fades after two minutes: a bright corner that never moves is what burns in */
  if (Date.now() - upAt > 120000) el('clock').className = 'dim';
}

function load() {
  return get(API + '/api/screensaver/photos').then(function (r) {
    list = (r.photos || []).slice();
    if (typeof r.every === 'number') every = r.every;
    order = shuffle(list.slice());
    pos = 0;
    if (order.length) { show(); arm(); }
  });
}

function begin() {
  if (started) return;
  started = true;
  tickClock();
  setInterval(tickClock, 10000);
  load();
  /* the library changes (photos uploaded from the phone): read it again every ten minutes */
  setInterval(load, 600000);
}

/* keep the screen dark until the page is ready, then fade in the first photo; never stay on top of the system:
   when the TV goes to standby or another app takes the screen, the page closes itself (the standby flow waits for it otherwise) */
document.addEventListener('visibilitychange', function () {
  if (document.hidden) dismiss();
  else begin();
});
begin();
</script>
</body></html>
