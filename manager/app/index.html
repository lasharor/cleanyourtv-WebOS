able on this firmware":"غير متاح على هذا البرنامج الثابت","not connected":"غير متصل","Not connected.":"غير متصل.","Not found":"غير موجود","not installed":"غير مثبّت","not learned":"لم يُعلَّم","not paused yet":"لم يُوقف مؤقتًا بعد","not set":"غير مضبوط","not set · More > Home Assistant":"غير مُعدّ · المزيد > Home Assistant","not set · shows a card only":"غير مضبوط · تُعرض البطاقة فقط","not set up":"غير مُعدّ","Nothing changes.":"لا شيء يتغيّر.","nothing to remove":"لا شيء للحذف","Nothing was pressed.":"لم يُضغط شيء.","Notification address and token":"عنوان الإشعارات والرمز","Now":"الآن","Now and the next days":"الآن والأيام القادمة","now: %s":"الآن: %s","Off":"إيقاف","On":"تشغيل","On: pressing Input shows our Inputs list. Off: LG’s picker comes back at once.":"تشغيل: الضغط على Input يعرض قائمة مداخلنا. إيقاف: يعود منتقي LG فورًا.","On: pressing the button you learned starts listening. A card shows what was heard.":"تشغيل: الضغط على الزر المُعلَّم يبدأ الاستماع. تعرض بطاقة ما سُمع.","On: the Home button opens this launcher. Off: LG’s own Home. Switching restarts the TV (about a minute); the service keeps running either way.":"تشغيل: زر Home يفتح هذا المشغّل. إيقاف: شاشة LG الرئيسية. التبديل يعيد تشغيل التلفاز (نحو دقيقة)؛ تعمل الخدمة في الحالتين.","On: the launcher has a Live TV button and tile, the Inputs list has Live TV, and the Guide key can open the channel guide. Off: all of that is hidden and LG’s own player and guide are used. Your playlist is kept.":"تشغيل: للمشغّل زر وبلاطة للبث المباشر، وفي قائمة المداخل البث المباشر، ويمكن لزر الدليل فتح دليل القنوات. إيقاف: يُخفى كل ذلك ويُستخدم مشغّل LG ودليلها. تبقى قائمة التشغيل محفوظة.","On: the TV listens on port 8767 for POST /notify with the token. Anyone who has the token and network access can show cards on this screen.":"تشغيل: يستمع التلفاز على المنفذ 8767 ويقبل POST /notify مع الرمز. يستطيع كل من لديه الرمز والوصول إلى الشبكة عرض بطاقات على هذه الشاشة.","On: what you say is also sent as text to a language model through OpenRouter and the answer is shown on screen. Needs your OpenRouter key; the text goes to OpenRouter and the model provider, never audio.":"تشغيل: يُرسل ما تقوله أيضًا نصًا إلى نموذج لغوي عبر OpenRouter ويُعرض الرد على الشاشة. يحتاج مفتاح OpenRouter الخاص بك؛ يذهب النص إلى OpenRouter ومزوّد النموذج، والصوت أبدًا.","one is saved, leave empty to keep it":"المفتاح محفوظ، اتركه فارغًا لإبقائه","Open":"فتح","OpenRouter key":"مفتاح OpenRouter","optional":"اختياري","Optional. Records the Home button’s code. The Home key keeps working exactly as before.":"اختياري. يتعلّم رمز زر Home. يعمل زر Home تمامًا كما كان.","Optional. Speak into the remote and the TV turns it into text on the TV itself (Moonshine, English). The text can be sent to a server you run. Audio never leaves the TV. Needs a download of about 80 MB.":"اختياري. تحدّث إلى جهاز التحكم فيحوّل التلفاز الكلام إلى نص بنفسه (Moonshine، بالإنجليزية). يمكن إرسال النص إلى خادمك. لا يغادر الصوت التلفاز أبدًا. يحتاج تنزيلًا بنحو 80 ميغابايت.","over the running app, ready in the background (instant)":"فوق التطبيق، جاهز في الخلفية (فوري)","over the running app, started when pressed":"فوق التطبيق، يبدأ عند الضغط","Photo %d of %d · preparing":"الصورة %d من %d · جارٍ التجهيز","Photo %d of %d · sending":"الصورة %d من %d · جارٍ الإرسال","Photos from the Immich albums you chose, downloaded to the TV every six hours (and with Sync now), so Home never waits for Immich. At most 300.":"صور من ألبومات Immich المختارة، تُنزَّل إلى التلفاز كل ست ساعات (وبزر مزامنة الآن) كي لا تنتظر الشاشة الرئيسية Immich أبدًا. 300 على الأكثر.","Photos uploaded from a phone, kept on the TV. At most 100.":"صور رُفعت من هاتف وحُفظت على التلفاز. 100 على الأكثر.","Picture size":"حجم الصورة","Place":"المكان","Playlist":"قائمة التشغيل","Playlist address (M3U)":"عنوان قائمة التشغيل (M3U)","Playlist removed":"أُزيلت قائمة التشغيل","Playlist saved":"حُفظت قائمة التشغيل","Preparing the report…":"جارٍ تجهيز التقرير…","Preparing…":"جارٍ التجهيز…","Press and hold the text, then choose Copy":"اضغط مطوّلًا على النص ثم اختر نسخ","Press the %s button now…":"اضغط زر %s الآن…","Puts the dock, the top buttons, hidden apps, the app order and the clock back to the defaults. The theme stays.":"يعيد الشريط والأزرار العلوية والتطبيقات المخفية وترتيب التطبيقات والساعة إلى الافتراضي. تبقى السمة.","QR code for your phone":"رمز QR للهاتف","Reading status…":"جارٍ قراءة الحالة…","Reads the code of your remote’s Input button from the hook, then tests that our list opens. The default is 241. Clear goes back to it.":"يقرأ رمز زر Input في جهاز التحكم عبر الخطاف، ثم يختبر فتح قائمتنا. الافتراضي 241. إعادة الضبط تعيده إليه.","Recent":"الأخيرة","Recent channels cleared":"تم مسح القنوات الأخيرة","recommended first · installed %s":"الموصى به أولًا · المثبّت %s","Records the code of the remote button that starts listening. Try the microphone button first; any spare button works.":"يتعلّم رمز زر جهاز التحكم الذي يبدأ الاستماع. جرّب زر الميكروفون أولًا؛ أي زر غير مستخدم يصلح.","Records the Guide button’s code. Afterwards it opens the Live TV channel guide over whatever is running (only while Live TV is on). Clear it to get LG’s guide back.":"يتعلّم رمز زر الدليل. بعدها يفتح دليل قنوات البث المباشر فوق كل شيء (فقط عندما يكون البث المباشر مفعّلًا). أعد ضبطه لاستعادة دليل LG.","Refresh playlist and guide":"تحديث قائمة التشغيل والدليل","Refreshing in the background":"يتم التحديث في الخلفية","Refreshing…":"جارٍ التحديث…","refused":"مرفوض","reloaded":"أُعيد تحميله","Remove all uploads":"إزالة كل الصور المرفوعة","Remove CleanYourTV?":"إزالة CleanYourTV؟","Remove the playlist":"إزالة قائمة التشغيل","Remove the playlist?":"إزالة قائمة التشغيل؟","Remove voice":"إزالة الصوت","Removes the apps, the boot scripts and your settings, then restarts the TV so LG’s Home comes back.":"يزيل التطبيقات ونصوص الإقلاع وإعداداتك، ثم يعيد تشغيل التلفاز لتعود شاشة LG الرئيسية.","Removing CleanYourTV… the TV restarts in a moment and LG’s Home comes back.":"جارٍ إزالة CleanYourTV… سيُعاد تشغيل التلفاز الآن وتعود شاشة LG الرئيسية.","Reset Home customisation":"إعادة ضبط الشاشة الرئيسية","Restarting the service":"جارٍ إعادة تشغيل الخدمة","Restarts the TV; LG’s own Home is Home after it starts. You can switch back here.":"يعيد تشغيل التلفاز؛ بعد الإقلاع تكون شاشة LG الخاصة هي الشاشة الرئيسية. يمكنك العودة من هنا.","Restarts the TV; this launcher is Home after it starts.":"يعيد تشغيل التلفاز؛ بعد الإقلاع يكون هذا المشغّل هو الشاشة الرئيسية.","Right column":"العمود الأيمن","Running apps":"التطبيقات المفتوحة","Save":"حفظ","Save albums and sync":"حفظ الألبومات والمزامنة","Save JSON":"حفظ JSON","Saved":"تم الحفظ","Saved. Open Home on the TV to see it.":"تم الحفظ. افتح الشاشة الرئيسية على التلفاز لرؤيته.","Saved. The TV is loading your channels now; you can close this page.":"تم الحفظ. يحمّل التلفاز قنواتك؛ يمكنك إغلاق هذه الصفحة.","Saved. You can close this page.":"تم الحفظ. يمكنك إغلاق هذه الصفحة.","Saving…":"جارٍ الحفظ…","scan with a phone to copy the address and token":"امسحه بالهاتف لنسخ العنوان والرمز","Search":"بحث","Second line (where there is room)":"السطر الثاني (حيث توجد مساحة)","Select all":"تحديد الكل","selected":"محدد","Send the text to":"إرسال النص إلى","Send the text to your own server":"أرسل النص إلى خادمك","Sends what you say as text to Home Assistant’s Assist and shows its answer. Needs the address and a long-lived access token (Home Assistant profile page), entered on your phone. Choosing this row tests the connection.":"يرسل ما تقوله نصًا إلى Assist في Home Assistant ويعرض الرد. يحتاج العنوان ورمز وصول طويل الأمد (صفحة الملف الشخصي في Home Assistant)، يُدخلان من الهاتف. اختيار هذا السطر يختبر الاتصال.","Server token":"رمز الخادم","Service":"الخدمة","Service %s":"الخدمة %s","set up":"مُعدّ","Set up anyway":"الإعداد على أي حال","set up from your phone":"اضبطه من الهاتف","Set up from your phone":"الإعداد من الهاتف","set the Home Assistant address too":"أدخل عنوان Home Assistant أيضًا","set up Home Assistant first":"اضبط Home Assistant أولًا","Set up Live TV":"إعداد البث المباشر","Set up now":"الإعداد الآن","Set up with commands":"الإعداد بالأوامر","Setting up… %s":"جارٍ الإعداد… %s","Setting up… the screen blinks once while LG’s system restarts":"جارٍ الإعداد… تومض الشاشة مرة واحدة أثناء إعادة تشغيل نظام LG","Settings":"الإعدادات","settings and apps are deleted; the TV restarts":"تُزال الإعدادات والتطبيقات؛ يُعاد تشغيل التلفاز","Settings for Live TV: switch it on or off, set up or remove your playlist, refresh the guide and learn the Guide key.":"إعدادات البث المباشر: شغّله أو أوقفه، اضبط قائمة التشغيل أو أزلها، حدّث الدليل وعلّم زر الدليل.","Share log":"مشاركة السجل","Share the log":"مشاركة السجل","Show":"العرض","Show as QR code":"عرض رمز QR","Show Live TV":"إظهار البث المباشر","Shows a QR code. A phone that scans it opens a page, served by the TV for ten minutes, that shows the notification address and the token with Copy buttons (for Home Assistant, for example). The token is a secret.":"يعرض رمز QR. الهاتف الذي يمسحه يفتح صفحة (يقدّمها التلفاز عشر دقائق) فيها عنوان الإشعارات والرمز مع أزرار نسخ، مثلًا لـ Home Assistant. الرمز سرّي.","Shows a QR code. On the phone page you upload photos (they are made the right size on the phone), delete uploads, connect Immich, choose albums and hide single photos.":"يعرض رمز QR. في صفحة الهاتف ترفع الصور (يغيّر الهاتف حجمها)، وتحذف المرفوعة، وتصل Immich، وتختار الألبومات، وتخفي صورًا بعينها.","Shows a QR code. Scan it with a phone on the same Wi-Fi to copy a report for a bug report. Addresses and URL paths are masked; the page closes after ten minutes.":"يعرض رمز QR. امسحه بهاتف على شبكة Wi-Fi نفسها لنسخ تقرير لبلاغ خطأ. العناوين ومسارات URL مخفية؛ تُغلق الصفحة بعد عشر دقائق.","Shows a QR code. Scan it with a phone on the same Wi-Fi to enter your OpenRouter key, choose a model, write instructions and set a server address. Nothing is typed on the TV.":"يعرض رمز QR. امسحه بهاتف على شبكة Wi-Fi نفسها لإدخال مفتاح OpenRouter واختيار نموذج وكتابة التعليمات وتحديد عنوان الخادم. لا حاجة للكتابة على التلفاز.","Shows the address, the token and an example request.":"يعرض العنوان والرمز وطلبًا نموذجيًا.","Shows the commands to set the key, model and instructions from a shell, and how to ask by text.":"يعرض أوامر ضبط المفتاح والنموذج والتعليمات من الطرفية، وكيفية السؤال بالنص.","Size":"الحجم","Skip":"تخطٍّ","Small":"صغير","small widgets on Home":"أدوات صغيرة على الشاشة الرئيسية","Speak now…":"تحدّث…","speak when the card appears":"تحدّث عندما تظهر البطاقة","Stable releases":"الإصدارات المستقرة","Stable releases are what most people want: at most one a day, made from the dev builds. Dev builds come with every change and can be less finished; choose Dev here, then use the Launcher and Service rows to install it. Going back to Stable offers the latest release again.":"الإصدارات المستقرة لمعظم الناس: واحد في اليوم على الأكثر، من إصدارات التطوير. تأتي إصدارات التطوير مع كل تغيير وقد تكون أقل نضجًا؛ اخترها هنا ثم ثبّتها من سطري المشغّل والخدمة. العودة إلى المستقرة تعرض أحدث إصدار مجددًا.","Start":"ابدأ","Starting":"جارٍ البدء","Starts listening without the button: speak when the card appears.":"يبدأ الاستماع دون زر: تحدّث عندما تظهر البطاقة.","Stops contentminer and nudge (recommendations and pop-up tips) and keeps sportsalarm from starting.":"يوقف contentminer وnudge (الاقتراحات والتلميحات المنبثقة) ويمنع تشغيل sportsalarm.","Stops LG’s ad, recommendation and telemetry services and blocks a few ad servers. Nothing is uninstalled, and it only applies while this launcher is Home.":"يوقف خدمات الإعلانات والتوصيات والقياسات في LG ويحجب بعض خوادم الإعلانات. لا يُحذف شيء، ويسري فقط ما دام هذا المشغّل هو الشاشة الرئيسية.","Stops LG’s ad, tracking, telemetry and suggestion services, in four groups you can switch separately. Nothing is uninstalled, and it only applies while this launcher is Home.":"يوقف خدمات الإعلانات والتتبّع والقياسات والتلميحات في LG، وهي أربع مجموعات يمكن تشغيل كل منها على حدة. لا يُحذف شيء، ويسري فقط ما دام هذا المشغّل هو الشاشة الرئيسية.","Stops remotelogger and service-logger, which collect logs and send them to LG.":"يوقف remotelogger وservice-logger اللذين يجمعان السجلات ويرسلانها إلى LG.","Stream":"البث","streams":"بثوث","Suggestions and nudges":"الاقتراحات والتذكيرات","Swaps the previous launcher version back in. The newer one stays available as an update.":"يستعيد الإصدار السابق من المشغّل. يبقى الأحدث متاحًا كتحديث.","Switch all off":"إيقاف الكل","Switch all on":"تشغيل الكل","Switch Home?":"تغيير الشاشة الرئيسية؟","Switch notifications on first":"شغّل الإشعارات أولًا","Switch off LG’s voice assistant":"إيقاف مساعد LG الصوتي","Switches every group on.":"يشغّل كل المجموعات.","Switches the debloat off: the services start again and the hosts lines are removed.":"يوقف Debloat: تعود الخدمات للعمل وتُزال أسطر hosts.","switching restarts the TV":"التبديل يعيد تشغيل التلفاز","Switching to CleanYourTV… the TV restarts in a moment.":"جارٍ التبديل إلى CleanYourTV… سيُعاد تشغيل التلفاز الآن.","Switching to LG’s Home… the TV restarts in a moment.":"جارٍ التبديل إلى شاشة LG الرئيسية… سيُعاد تشغيل التلفاز الآن.","Switching…":"جارٍ التبديل…","Sync now":"مزامنة الآن","synced %s":"تمت المزامنة %s","Synced photos":"الصور المتزامنة","Syncing with Immich…":"جارٍ المزامنة مع Immich…","syncing…":"جارٍ المزامنة…","Syncing…":"جارٍ المزامنة…","syncing… %d new":"جارٍ المزامنة… %d جديدة","Syncing… %d new":"جارٍ المزامنة… %d جديدة","Take over the Input key":"التقاط زر Input","Tap Copy, then paste it into your message. Addresses and URL paths are masked. This page closes ten minutes after it was opened on the TV.":"اضغط نسخ والصقه في بلاغ. العناوين ومسارات URL مخفية. تُغلق الصفحة بعد عشر دقائق من فتحها على التلفاز.","tap to hide or show one":"اضغط للإخفاء أو الإظهار","Telemetry logs":"سجلات القياس","Temperature":"درجة الحرارة","Test connection and save":"اختبار الاتصال والحفظ","Test the connection":"اختبار الاتصال","Test.\nPress the Input button once more. Our Inputs list should open over this screen.":"اختبار.\nاضغط زر Input مرة أخرى. يجب أن تفتح قائمة مداخلنا فوق الشاشة.","Testing":"اختبار","Text":"نص","the address and the token are removed from the TV":"يُحذف العنوان والرمز من التلفزيون","the address must start with http:// or https://":"يجب أن يبدأ العنوان بـ http:// أو https://","the address, the channel list, the guide and your favourites are deleted":"سيُحذف العنوان وقائمة القنوات والدليل والمفضلة","The AI and Home Assistant remember the last turns for ten minutes. This clears them.":"يتذكر الذكاء الاصطناعي وHome Assistant آخر الأدوار عشر دقائق. هذا يمسحها.","The AI only":"الذكاء الاصطناعي فقط","The background service behind the launcher: Live TV, picture notifications, the Input key, these updates. A failed update restores the previous files.":"خدمة المشغّل في الخلفية: البث المباشر، الإشعارات المصوّرة، زر Input، هذه التحديثات. التحديث الفاشل يستعيد الملفات القديمة.","the chosen albums have no photos the TV can show":"لا تحتوي الألبومات المختارة على صور يستطيع التلفاز عرضها","The colour of the focus ring and highlights":"لون حلقة التركيز والتمييزات","The date":"التاريخ","The Guide key.\nChoose Start, then press the Guide button on your remote. It then opens the Live TV channel guide instead of LG’s guide. Clear it to get LG’s guide back.":"زر الدليل.\nاختر ابدأ ثم اضغط زر الدليل في جهاز التحكم. بعدها يفتح دليل البث المباشر بدل دليل LG. أعد ضبطه لاستعادة دليل LG.","The Home key (optional).\nChoose Start, then press the Home button on your remote.":"زر Home (اختياري).\nاختر ابدأ ثم اضغط زر Home في جهاز التحكم.","The home screen you see. Updates come from GitHub releases and are checked against a SHA-256 file before they are installed. If a new launcher does not start, the previous one is put back.":"الشاشة الرئيسية التي تراها. تأتي التحديثات من إصدارات GitHub ويُتحقق منها بملف SHA-256 قبل التثبيت. إذا لم يبدأ المشغّل الجديد يعود السابق.","The hook did not attach on this firmware, so keys cannot be learned. The Input key stays with LG’s picker.\nUse Share log to report this.":"لم يتصل الخطاف على هذا البرنامج الثابت، فلا يمكن تعلّم الأزرار. يبقى زر Input لمنتقي LG.\nيرجى الإبلاغ عبر مشاركة السجل.","The Input key.\nChoose Start, then press the Input button on your remote.":"زر Input.\nاختر ابدأ ثم اضغط زر Input في جهاز التحكم.","The Inputs list did not open.\nIf LG’s own picker showed, the Input key is not mapped: learn it again or switch the Input key off.":"لم تُفتح قائمة المداخل.\nإذا ظهر منتقي LG فزر Input غير معيَّن: علّمه مجددًا أو أوقف التقاط زر Input.","The Inputs list opened: the Input key works.":"فُتحت قائمة المداخل: زر Input يعمل.","the install did not finish":"لم يكتمل التثبيت","the key is forgotten and its photos are deleted from the TV":"نُسي المفتاح وحُذفت صوره من التلفاز","The language of CleanYourTV’s screens: the launcher, this app and the Inputs list. Automatic follows the TV’s menu language. The percentage says how much of a language is translated; the rest stays English. Translations are files in the repository that anyone can add to.":"لغة شاشات CleanYourTV: المشغّل وهذا التطبيق وقائمة المداخل. التلقائي يتبع لغة قائمة التلفاز. تُظهر النسبة كم من اللغة مترجم؛ يبقى الباقي بالإنجليزية. الترجمات ملفات في المستودع يمكن لأي شخص توسيعها.","the launcher’s Inputs list":"قائمة مداخل المشغّل","The launcher’s own settings go back to the defaults. Apps, the theme and everything in this app stay.":"تعود إعدادات المشغّل الخاصة إلى الافتراضي. تبقى التطبيقات والسمة وكل ما في هذا التطبيق.","The new launcher did not start; rolling back":"لم يبدأ المشغّل الجديد؛ جارٍ التراجع","the new launcher did not start; the previous version is back":"لم يبدأ المشغّل الجديد؛ تمت استعادة السابق","The notification listener is not running.":"مستقبل الإشعارات لا يعمل.","the old one stops working":"يتوقف القديم عن العمل","The page has closed. Close this and try again.":"أُغلقت الصفحة. أغلق هذا وحاول مجددًا.","The page is open for ten minutes. It lists versions, the setup log and the service log; addresses and URL paths are masked.":"تبقى الصفحة مفتوحة عشر دقائق. فيها الإصدارات وسجل التثبيت وسجل الخدمة؛ العناوين ومسارات URL مخفية.","The page opens for ten minutes. It is not encrypted: the token travels over your Wi-Fi, so use a network you trust.":"تبقى الصفحة مفتوحة عشر دقائق. وهي غير مشفّرة: يمر الرمز عبر شبكة Wi-Fi لديك، فاستخدم شبكة تثق بها.","The page stays open for ten minutes, or until you save. It is not encrypted: the key travels over your Wi-Fi, so use a network you trust.":"تبقى الصفحة مفتوحة عشر دقائق أو حتى الحفظ. وهي غير مشفّرة: يمر المفتاح عبر شبكة Wi-Fi لديك، فاستخدم شبكة تثق بها.","The page stays open for ten minutes. It is not encrypted: the playlist address, which may hold an access key, travels over your Wi-Fi.":"تبقى الصفحة مفتوحة عشر دقائق. وهي غير مشفّرة: يمر عنوان قائمة التشغيل، الذي قد يحوي مفتاح وصول، عبر شبكة Wi-Fi لديك.","The page stays open while you use it, at most an hour. It is not encrypted: what you type travels over your Wi-Fi.":"تبقى الصفحة مفتوحة ما دمت تستخدمها، ساعة على الأكثر. وهي غير مشفّرة: يمر ما تكتبه عبر شبكة Wi-Fi لديك.","The page stays open while you use it, at most an hour. It is not encrypted: your photos and the Immich key travel over your Wi-Fi.":"تبقى الصفحة مفتوحة ما دمت تستخدمها، ساعة على الأكثر. وهي غير مشفّرة: تمر صورك ومفتاح Immich عبر شبكة Wi-Fi لديك.","the phone page could not start: %s":"تعذّر فتح صفحة الهاتف: %s","the picture is larger than 12 MB":"الصورة أكبر من 12 ميغابايت","The playlist address must start with http:// or https://":"يجب أن يبدأ عنوان قائمة التشغيل بـ http:// أو https://","The remote’s Input button opens our Inputs list instead of LG’s picker. You can change this later.":"زر Input في جهاز التحكم يفتح قائمة مداخلنا بدل منتقي LG. يمكنك تغيير ذلك لاحقًا.","The remote’s Input button opens our Inputs list over the running app instead of LG’s picker. Open this screen to switch it off or to learn the button.":"زر Input في جهاز التحكم يفتح قائمة مداخلنا فوق التطبيق بدل منتقي LG. افتح هذه الشاشة لإيقافه أو لتعلّم الزر.","the s iminar la llista?","Remove voice":"Elimina la veu","Removes the apps, the boot scripts and your settings, then restarts the TV so LG’s Home comes back.":"Elimina les aplicacions, els scripts d'arrencada i la configuració, i reinicia el televisor perquè torni la pantalla d'inici de LG.","Removing CleanYourTV… the TV restarts in a moment and LG’s Home comes back.":"S'està eliminant CleanYourTV… El televisor es reiniciarà d'aquí a un moment i tornarà la pantalla d'inici de LG.","Reset Home customisation":"Restableix la personalització d'Inici","Restarting the service":"S'està reiniciant el servei","Restarts the TV; LG’s own Home is Home after it starts. You can switch back here.":"Reinicia el televisor; quan torni a arrencar, la pantalla d'inici de LG serà la pantalla principal. Ho pots canviar de nou aquí.","Restarts the TV; this launcher is Home after it starts.":"Reinicia el televisor; quan torni a arrencar, aquest llançador serà la pantalla d'inici.","Right column":"Columna dreta","Running apps":"Aplicacions en execució","Save":"Desa","Save albums and sync":"Desa els àlbums i sincronitza","Save JSON":"Desa el JSON","Saved":"Desat","Saved. Open Home on the TV to see it.":"Desat. Obre Inici al televisor per veure-ho.","Saved. The TV is loading your channels now; you can close this page.":"S'ha desat. El televisor està carregant els canals; ja pots tancar aquesta pàgina.","Saved. You can close this page.":"S'ha desat. Ja pots tancar aquesta pàgina.","Saving…":"S'està desant…","scan with a phone to copy the address and token":"escaneja-ho amb el telèfon per copiar l'adreça i el token","Search":"Cerca","Second line (where there is room)":"Segona línia (si hi ha espai)","Select all":"Selecciona-ho tot","selected":"seleccionat","Send the text to":"Envia el text a","Send the text to your own server":"Envia el text al teu propi servidor","Sends what you say as text to Home Assistant’s Assist and shows its answer. Needs the address and a long-lived access token (Home Assistant profile page), entered on your phone. Choosing this row tests the connection.":"Envia a Assist de Home Assistant el que dius, convertit en text, i en mostra la resposta. Cal introduir al telèfon l'adreça i un token d'accés de llarga durada (disponible a la pàgina del perfil de Home Assistant). En seleccionar aquesta opció, es prova la connexió.","Server token":"Token del servidor","Service":"Servei","Service %s":"Servei %s","set up":"configurat","Set up anyway":"Configura-ho igualment","set up from your phone":"configura-ho des del telèfon","Set up from your phone":"Configura-ho des del telèfon","set the Home Assistant address too":"defineix també l'adreça de Home Assistant","set up Home Assistant first":"primer configura Home Assistant","Set up Live TV":"Configura la TV en directe","Set up now":"Configura-ho ara","Set up with commands":"Configura-ho amb ordres","Setting up… %s":"S'està configurant… %s","Setting up… the screen blinks once while LG’s system restarts":"S'està configurant… La pantalla parpellejarà una vegada mentre es reinicia el sistema de LG.","Settings":"Configuració","settings and apps are deleted; the TV restarts":"s'eliminaran la configuració i les aplicacions; el televisor es reiniciarà","Settings for Live TV: switch it on or off, set up or remove your playlist, refresh the guide and learn the Guide key.":"Configuració de la TV en directe: activa-la o desactiva-la, configura o elimina la llista de reproducció, actualitza la guia i aprèn la tecla de guia.","Share log":"Comparteix el registre","Share the log":"Comparteix el registre","Show":"Mostra","Show as QR code":"Mostra com a codi QR","Show Live TV":"Mostra la TV en directe","Shows a QR code. A phone that scans it opens a page, served by the TV for ten minutes, that shows the notification address and the token with Copy buttons (for Home Assistant, for example). The token is a secret.":"Mostra un codi QR. En escanejar-lo, el telèfon obre durant deu minuts una pàgina servida pel televisor amb l'adreça de notificacions i el token, amb botons per copiar-los (per exemple, per a Home Assistant). El token és secret.","Shows a QR code. On the phone page you upload photos (they are made the right size on the phone), delete uploads, connect Immich, choose albums and hide single photos.":"Mostra un codi QR. Des de la pàgina del telèfon pots pujar fotos (se'n redueix la mida al telèfon), eliminar pujades, connectar Immich, triar àlbums i amagar fotos individuals.","Shows a QR code. Scan it with a phone on the same Wi-Fi to copy a report for a bug report. Addresses and URL paths are masked; the page closes after ten minutes.":"Mostra un codi QR. Escaneja'l amb un telèfon connectat a la mateixa xarxa Wi-Fi per copiar un informe d'error. Les adreces i les rutes dels URL s'oculten; la pàgina es tanca al cap de deu minuts.","Shows a QR code. Scan it with a phone on the same Wi-Fi to enter your OpenRouter key, choose a model, write instructions and set a server address. Nothing is typed on the TV.":"Mostra un codi QR. Escaneja'l amb un telèfon connectat a la mateixa xarxa Wi-Fi per introduir la clau d'OpenRouter, triar un model, escriure instruccions i definir l'adreça del servidor. No cal escriure res al televisor.","Shows the address, the token and an example request.":"Mostra l'adreça, el token i un exemple de sol·licitud.","Shows the commands to set the key, model and instructions from a shell, and how to ask by text.":"Mostra les ordres per definir la clau, el model i les instruccions des d'un terminal, i per fer preguntes per escrit.","Size":"Mida","Skip":"Omet","Small":"Petit","small widgets on Home":"ginys petits a Inici","Speak now…":"Parla ara…","speak when the card appears":"parla quan aparegui la targeta","Stable releases":"Versions estables","Stable releases are what most people want: at most one a day, made from the dev builds. Dev builds come with every change and can be less finished; choose Dev here, then use the Launcher and Service rows to install it. Going back to Stable offers the latest release again.":"Les versions estables són les recomanades per a la majoria: com a màxim n'hi ha una al dia i es generen a partir de les versions de desenvolupament. Les versions de desenvolupament inclouen cada canvi i poden estar menys acabades. Tria Desenvolupament aquí i instal·la-la des de les files Llançador i Servei. Si tornes a Estable, tornaràs a veure l'última versió estable.","Start":"Inicia","Starting":"S'està iniciant","Starts listening without the button: speak when the card appears.":"Comença a escoltar sense prémer el botó: parla quan aparegui la targeta.","Stops contentminer and nudge (recommendations and pop-up tips) and keeps sportsalarm from starting.":"Atura contentminer i nudge (recomanacions i consells emergents) i impedeix que s'iniciï sportsalarm.","Stops LG’s ad, recommendation and telemetry services and blocks a few ad servers. Nothing is uninstalled, and it only applies while this launcher is Home.":"Atura els serveis de publicitat, recomanacions i telemetria de LG i bloqueja alguns servidors d'anuncis. No es desinstal·la res i només s'aplica mentre aquest llançador és la pantalla d'inici.","Stops LG’s ad, tracking, telemetry and suggestion services, in four groups you can switch separately. Nothing is uninstalled, and it only applies while this launcher is Home.":"Atura els serveis de publicitat, seguiment, telemetria i suggeriments de LG, agrupats en quatre categories que pots activar per separat. No es desinstal·la res i només s'aplica mentre aquest llançador és la pantalla d'inici.","Stops remotelogger and service-logger, which collect logs and send them to LG.":"Atura remotelogger i service-logger, que recopilen registres i els envien a LG.","Stream":"Emissió","streams":"emissions","Suggestions and nudges":"Suggeriments i avisos","Swaps the previous launcher version back in. The newer one stays available as an update.":"Restaura la versió anterior del llançador. La versió més nova continuarà disponible com a actualització.","Switch all off":"Desactiva-ho tot","Switch all on":"Activa-ho tot","Switch Home?":"Vols canviar la pantalla d'inici?","Switch notifications on first":"Activa primer les notificacions","Switch off LG’s voice assistant":"Desactiva l'assistent de veu de LG","Switches every group on.":"Activa tots els grups.","Switches the debloat off: the services start again and the hosts lines are removed.":"Desactiva la reducció de programari: els serveis tornen a iniciar-se i s'eliminen les línies corresponents de hosts.","switching restarts the TV":"en canviar-ho, el televisor es reinicia","Switching to CleanYourTV… the TV restarts in a moment.":"S'està canviant a CleanYourTV… El televisor es reiniciarà d'aquí a un moment.","Switching to LG’s Home… the TV restarts in a moment.":"S'està canviant a la pantalla d'inici de LG… El televisor es reiniciarà d'aquí a un moment.","Switching…":"S'està canviant…","Sync now":"Sincronitza ara","synced %s":"sincronitzat %s","Synced photos":"Fotos sincronitzades","Syncing with Immich…":"S'està sincronitzant amb Immich…","syncing…":"s'està sincronitzant…","Syncing…":"S'està sincronitzant…","syncing… %d new":"s'està sincronitzant… %d de nous","Syncing… %d new":"S'està sincronitzant… %d de nous","Take over the Input key":"Pren el control de la tecla d'entrada","Tap Copy, then paste it into your message. Addresses and URL paths are masked. This page closes ten minutes after it was opened on the TV.":"Toca Copia i enganxa-ho al missatge. Les adreces i les rutes dels URL s'oculten. Aquesta pàgina es tanca al cap de deu minuts d'haver-la obert al televisor.","tap to hide or show one":"toca per amagar-ne o mostrar-ne una","Telemetry logs":"Registres de telemetria","Temperature":"Temperatura","Test connection and save":"Prova la connexió i desa","Test the connection":"Prova la connexió","Test.\nPress the Input button once more. Our Inputs list should open over this screen.":"Prova.\nTorna a prémer el botó Entrada. La nostra llista d'entrades s'hauria d'obrir per sobre d'aquesta pantalla.","Testing":"S'està provant","Text":"Text","the address and the token are removed from the TV":"s'eliminen del televisor l'adreça i el token","the address must start with http:// or https://":"l'adreça ha de començar per http:// o https://","the address, the channel list, the guide and your favourites are deleted":"s'eliminen l'adreça, la llista de canals, la guia i els preferits","The AI and Home Assistant remember the last turns for ten minutes. This clears them.":"La IA i Home Assistant recorden les darreres interaccions durant deu minuts. Aquesta opció les esborra.","The AI only":"Només la IA","The background service behind the launcher: Live TV, picture notifications, the Input key, these updates. A failed update restores the previous files.":"El servei en segon pla del llançador: TV en directe, notificacions amb imatges, la tecla d'entrada i aquestes actualitzacions. Si una actualització falla, es restauren els fitxers anteriors.","the chosen albums have no photos the TV can show":"els àlbums triats no contenen cap foto que el televisor pugui mostrar","The colour of the focus ring and highlights":"El color de l'indicador de focus i dels elements ressaltats","The date":"La data","The Guide key.\nChoose Start, then press the Guide button on your remote. It then opens the Live TV channel guide instead of LG’s guide. Clear it to get LG’s guide back.":"La tecla Guia.\nTria Inicia i prem el botó Guia del comandament. A partir d'aleshores obrirà la guia de canals de la TV en directe en lloc de la guia de LG. Esborra-la per tornar a la guia de LG.","The Home key (optional).\nChoose Start, then press the Home button on your remote.":"La tecla Inici (opcional).\nTria Inicia i prem el botó Inici del comandament.","The home screen you see. Updates come from GitHub releases and are checked against a SHA-256 file before they are installed. If a new launcher does not start, the previous one is put back.":"La pantalla d'inici que veus. Les actualitzacions provenen de les versions publicades a GitHub i se'n comprova la suma SHA-256 abans d'instal·lar-les. Si el llançador nou no s'inicia, es restaura l'anterior.","The hook did not attach on this firmware, so keys cannot be learned. The Input key stays with LG’s picker.\nUse Share log to report this.":"El hook no s'ha pogut connectar amb aquest microprogramari, de manera que no es poden aprendre tecles. La tecla Entrada continua obrint el selector de LG.\nFes servir Comparteix el registre per informar d'aquest problema.","The Input key.\nChoose Start, then press the Input button on your remote.":"La tecla Entrada.\nTria Inicia i prem el botó Entrada del comandament.","The Inputs list did not open.\nIf LG’s own picker showed, the Input key is not mapped: learn it again or switch the Input key off.":"No s'ha obert la llista d'entrades.\nSi ha aparegut el selector de LG, la tecla Entrada no està assignada: torna-la a aprendre o desactiva la tecla Entrada.","The Inputs list opened: the Input key works.":"S'ha obert la llista d'entrades: la tecla d'entrada funciona.","the install did not finish":"la instal·lació no s'ha completat","the key is forgotten and its photos are deleted from the TV":"s'oblida la clau i s'eliminen del televisor les fotos corresponents","The language of CleanYourTV’s screens: the launcher, this app and the Inputs list. Automatic follows the TV’s menu language. The percentage says how much of a language is translated; the rest stays English. Translations are files in the repository that anyone can add to.":"L'idioma de les pantalles de CleanYourTV: el llançador, aquesta aplicació i la llista d'entrades. Automàtic segueix l'idioma dels menús del televisor. El percentatge indica quina part de cada idioma està traduïda; la resta es mostra en anglès. Qualsevol persona pot afegir traduccions als fitxers del repositori.","the launcher’s Inputs list":"la llista d'entrades del llançador","The launcher’s own settings go back to the defaults. Apps, the theme and everything in this app stay.":"La configuració del llançador torna als valors predeterminats. Les aplicacions, el tema i la resta d'aquesta aplicació es conserven.","The new launcher did not start; rolling back":"El llançador nou no s'ha iniciat; es restaura la versió anterior","the new launcher did not start; the previous version is back":"el llançador nou no s'ha iniciat; s'ha restaurat la versió anterior","The notification listener is not running.":"El servei que rep notificacions no està en execució.","the old one stops working":"l'anterior deixa de funcionar","The page has closed. Close this and try again.":"La pàgina s'ha tancat. Tanca-la i torna-ho a provar.","The page is open for ten minutes. It lists versions, the setup log and the service log; addresses and URL paths are masked.":"La pàgina estarà oberta durant deu minuts. Mostra les versions i els registres de configuració i del servei; les adreces i les rutes dels URL s'oculten.","The page opens for ten minutes. It is not encrypted: the token travels over your Wi-Fi, so use a network you trust.":"La pàgina s'obre durant deu minuts. La connexió no està xifrada: el token viatja per la xarxa Wi-Fi, així que fes servir una xarxa de confiança.","The page stays open for ten minutes, or until you save. It is not encrypted: the key travels over your Wi-Fi, so use a network you trust.":"La pàgina es manté oberta durant deu minuts o fins que desis. La connexió no està xifrada: la clau viatja per la xarxa Wi-Fi, així que fes servir una xarxa de confiança.","The page stays open for ten minutes. It is not encrypted: the playlist address, which may hold an access key, travels over your Wi-Fi.":"La pàgina es manté oberta durant deu minuts. La connexió no està xifrada: l'adreça de la llista de reproducció, que pot contenir una clau d'accés, viatja per la xarxa Wi-Fi.","The page stays open while you use it, at most an hour. It is not encrypted: what you type travels over your Wi-Fi.":"La pàgina es manté oberta mentre la fas servir, com a màxim una hora. La connexió no està xifrada: el que escriguis viatjarà per la xarxa Wi-Fi.","The page stays open while you use it, at most an hour. It is not encrypted: your photos and the Immich key travel over your Wi-Fi.":"La pàgina es manté oberta mentre la fas servir, com a màxim una hora. La connexió no està xifrada: les fotos i la clau d'Immich viatgen per la xarxa Wi-Fi.","the phone page could not start: %s":"no s'ha pogut iniciar la pàgina del telèfon: %s","the picture is larger than 12 MB":"la imatge supera els 12 MB","The playlist address must start with http:// or https://":"L'adreça de la llista de reproducció ha de començar per http:// o https://","The remote’s Input button opens our Inputs list instead of LG’s picker. You can change this later.":"El botó Entrada del comandament obre la nostra llista d'entrades en lloc del selector de LG. Pots canviar-ho més endavant.","The remote’s Input button opens our Inputs list over the running app instead of LG’s picker. Open this screen to switch it off or to learn the button.":"El botó Entrada del comandament obre la nostra llista d'entrades per sobre de l'aplicació activa, en lloc del selector de LG. Obre aquesta pantalla per desactivar-ho o aprendre el botó.","the screen blinks once":"la pantalla parpelleja una vegada","The service did not answer":"El servei no ha respost","The service did not answer.":"El servei no ha respost.","The service is not running. Set it up to replace LG’s Home, take over the Input key and keep everything up to date.":"El servei no està en execució. Configura'l per substituir la pantalla d'inici de LG, controlar la tecla Entrada i mantenir-ho tot actualitzat.","The TV did not answer.":"El televisor no ha respost.","The TV did not answer. Is the phone on the same Wi-Fi?":"El televisor no ha respost. El telèfon és a la mateixa xarxa Wi-Fi?","the TV restarts":"el televisor es reinicia","The update is taking too long. Log: /tmp/cytv-selfupdate.log on the TV.":"L'actualització està trigant massa. Registre del televisor: /tmp/cytv-selfupdate.log.","the uploaded photos are deleted from the TV":"s'eliminen del televisor les fotos pujades","The voice button.\nChoose Start, then press the button you want to use for voice. The remote’s microphone button may not reach the hook; any spare button works.":"El botó de veu.\nTria Inicia i prem el botó que vulguis fer servir per a la veu. És possible que el botó del micròfon del comandament no arribi al hook; també serveix qualsevol botó lliure.","The weather (from a weather card)":"El temps (d'una targeta meteorològica)","Theme":"Tema","Theme default":"Tema predeterminat","Theme options":"Opcions del tema","there are %d uploads already: remove some first":"ja hi ha %d pujades; primer elimina'n algunes","there is no previous version":"no hi ha cap versió anterior","this entity cannot be switched from the TV":"aquesta entitat no es pot activar ni desactivar des del televisor","This is not valid JSON.":"Aquest JSON no és vàlid.","This theme has no places for cards":"Aquest tema no té espais per a targetes","This theme has no places for cards. Choose a theme with cards (Lock Screen) in Customise > Theme.":"Aquest tema no té espais per a targetes. Tria un tema que en tingui (com Lock Screen) a Personalitza > Tema.","This TV also has LG’s full-screen Home: if the Home button opens that instead of this launcher, set TV Settings > General > Home Settings > Home Style to Basic.":"Aquest televisor també té la pantalla d'inici a pantalla completa de LG. Si el botó Inici obre aquesta en lloc del llançador, ves a Configuració del televisor > General > Configuració de pantalla d'inici > Estil de pantalla d'inici i tria Bàsic.","Title (optional)":"Títol (opcional)","Total":"Total","Try again":"Torna-ho a provar","Try it now":"Prova-ho ara","TV language: %s":"Idioma del televisor: %s","Uninstall":"Desinstal·la","untested firmware; a failed start restarts the  Home Assistant","needs service %s or newer; update the service first":"braucht Dienst %s oder neuer; aktualisiere zuerst den Dienst","Network notifications":"Netzwerkbenachrichtigungen","never":"nie","New picture":"Neues Bild","New token":"Neues Token","New token created. Open “How to send” to see it.":"Neues Token erstellt. Öffne „So wird gesendet“, um es zu sehen.","no answer":"keine Antwort","no channels found in that playlist":"keine Sender in dieser Playlist gefunden","no key set":"kein Schlüssel eingerichtet","no release published yet":"noch keine Version veröffentlicht","No release yet":"Noch keine Version","No, keep it":"Nein, behalten","None":"Keine","none published right now":"gerade keiner veröffentlicht","not a JPEG, PNG or WebP picture":"kein JPEG-, PNG- oder WebP-Bild","not a picture the TV can show":"kein Bild, das der Fernseher zeigen kann","not available":"nicht verfügbar","not available on this firmware":"auf dieser Firmware nicht verfügbar","not connected":"nicht verbunden","Not connected.":"Nicht verbunden.","Not found":"Nicht gefunden","not installed":"nicht installiert","not learned":"nicht gelernt","not paused yet":"noch nicht pausiert","not set":"nicht eingerichtet","not set · More > Home Assistant":"nicht eingerichtet · Mehr > Home Assistant","not set · shows a card only":"nicht eingerichtet · zeigt nur eine Karte","not set up":"nicht eingerichtet","Nothing changes.":"Es ändert sich nichts.","nothing to remove":"nichts zu entfernen","Nothing was pressed.":"Es wurde nichts gedrückt.","Notification address and token":"Benachrichtigungsadresse und Token","Now":"Jetzt","Now and the next days":"Jetzt und die nächsten Tage","now: %s":"jetzt: %s","Off":"Aus","On":"An","On: pressing Input shows our Inputs list. Off: LG’s picker comes back at once.":"An: Input zeigt unsere Eingangsliste. Aus: LGs Auswahl ist sofort zurück.","On: pressing the button you learned starts listening. A card shows what was heard.":"An: Die gelernte Taste startet das Zuhören. Eine Karte zeigt, was gehört wurde.","On: the Home button opens this launcher. Off: LG’s own Home. Switching restarts the TV (about a minute); the service keeps running either way.":"An: Die Home-Taste öffnet diesen Launcher. Aus: LGs eigenes Home. Umschalten startet den Fernseher neu (etwa eine Minute); der Dienst läuft in beiden Fällen weiter.","On: the launcher has a Live TV button and tile, the Inputs list has Live TV, and the Guide key can open the channel guide. Off: all of that is hidden and LG’s own player and guide are used. Your playlist is kept.":"An: Der Launcher hat eine Live-TV-Schaltfläche und -Kachel, die Eingangsliste hat Live-TV, und die Guide-Taste kann den Programmführer öffnen. Aus: All das ist ausgeblendet und LGs eigener Player und Programmführer werden genutzt. Deine Playlist bleibt erhalten.","On: the TV listens on port 8767 for POST /notify with the token. Anyone who has the token and network access can show cards on this screen.":"An: Der Fernseher lauscht auf Port 8767 auf POST /notify mit dem Token. Wer das Token und Netzwerkzugang hat, kann Karten auf diesem Bildschirm zeigen.","On: what you say is also sent as text to a language model through OpenRouter and the answer is shown on screen. Needs your OpenRouter key; the text goes to OpenRouter and the model provider, never audio.":"An: Was du sagst, geht auch als Text über OpenRouter an ein Sprachmodell, und die Antwort erscheint auf dem Bildschirm. Braucht deinen OpenRouter-Schlüssel; der Text geht an OpenRouter und den Modellanbieter, nie Audio.","one is saved, leave empty to keep it":"eines ist gespeichert, leer lassen zum Behalten","Open":"Öffnen","OpenRouter key":"OpenRouter-Schlüssel","optional":"optional","Optional. Records the Home button’s code. The Home key keeps working exactly as before.":"Optional. Speichert den Code der Home-Taste. Die Home-Taste funktioniert genau wie vorher.","Optional. Speak into the remote and the TV turns it into text on the TV itself (Moonshine, English). The text can be sent to a server you run. Audio never leaves the TV. Needs a download of about 80 MB.":"Optional. Sprich in die Fernbedienung, und der Fernseher macht daraus auf dem Gerät selbst Text (Moonshine, Englisch). Der Text kann an einen eigenen Server gehen. Audio verlässt den Fernseher nie. Braucht einen Download von etwa 80 MB.","over the running app, ready in the background (instant)":"über der laufenden App, im Hintergrund bereit (sofort)","over the running app, started when pressed":"über der laufenden App, beim Drücken gestartet","Photo %d of %d · preparing":"Foto %d von %d · wird vorbereitet","Photo %d of %d · sending":"Foto %d von %d · wird gesendet","Photos from the Immich albums you chose, downloaded to the TV every six hours (and with Sync now), so Home never waits for Immich. At most 300.":"Fotos aus den gewählten Immich-Alben, alle sechs Stunden auf den Fernseher geladen (und mit Jetzt synchronisieren), damit Home nie auf Immich wartet. Höchstens 300.","Photos uploaded from a phone, kept on the TV. At most 100.":"Mit dem Handy hochgeladene Fotos, auf dem Fernseher gespeichert. Höchstens 100.","Picture size":"Bildgröße","Place":"Ort","Playlist":"Playlist","Playlist address (M3U)":"Adresse der Playlist (M3U)","Playlist removed":"Playlist entfernt","Playlist saved":"Playlist gespeichert","Preparing the report…":"Bericht wird vorbereitet…","Preparing…":"Wird vorbereitet…","Press and hold the text, then choose Copy":"Halte den Text gedrückt und wähle Kopieren","Press the %s button now…":"Drücke jetzt die %s-Taste…","Puts the dock, the top buttons, hidden apps, the app order and the clock back to the defaults. The theme stays.":"Setzt Dock, obere Schaltflächen, ausgeblendete Apps, Reihenfolge und Uhr auf den Standard zurück. Das Design bleibt.","QR code for your phone":"QR-Code für dein Handy","Reading status…":"Status wird gelesen…","Reads the code of your remote’s Input button from the hook, then tests that our list opens. The default is 241. Clear goes back to it.":"Liest den Code der Input-Taste deiner Fernbedienung aus dem Hook und testet dann, ob unsere Liste aufgeht. Standard ist 241. Löschen geht dorthin zurück.","Recent":"Zuletzt","Recent channels cleared":"Letzte Sender gelöscht","recommended first · installed %s":"zuerst empfohlen · installiert %s","Records the code of the remote button that starts listening. Try the microphone button first; any spare button works.":"Speichert den Code der Taste, die das Zuhören startet. Probiere zuerst die Mikrofontaste; jede freie Taste geht.","Records the Guide button’s code. Afterwards it opens the Live TV channel guide over whatever is running (only while Live TV is on). Clear it to get LG’s guide back.":"Speichert den Code der Guide-Taste. Danach öffnet sie den Live-TV-Programmführer über allem, was läuft (nur wenn Live-TV an ist). Lösche sie, um LGs Programmführer zurückzubekommen.","Refresh playlist and guide":"Playlist und Programmführer aktualisieren","Refreshing in the background":"Wird im Hintergrund aktualisiert","Refreshing…":"Wird aktualisiert…","refused":"abgelehnt","reloaded":"neu geladen","Remove all uploads":"Alle Uploads entfernen","Remove CleanYourTV?":"CleanYourTV entfernen?","Remove the playlist":"Playlist entfernen","Remove the playlist?":"Playlist entfernen?","Remove voice":"Sprachsteuerung entfernen","Removes the apps, the boot scripts and your settings, then restarts the TV so LG’s Home comes back.":"Entfernt die Apps, die Startskripte und deine Einstellungen und startet dann den Fernseher neu, damit LGs Home zurückkommt.","Removing CleanYourTV… the TV restarts in a moment and LG’s Home comes back.":"CleanYourTV wird entfernt… der Fernseher startet gleich neu und LGs Home ist zurück.","Reset Home customisation":"Home-Anpassungen zurücksetzen","Restarting the service":"Dienst wird neu gestartet","Restarts the TV; LG’s own Home is Home after it starts. You can switch back here.":"Startet den Fernseher neu; danach ist LGs eigenes Home ,"Set up with commands":"Mit Befehlen einrichten","Setting up… %s":"Einrichtung… %s","Setting up… the screen blinks once while LG’s system restarts":"Einrichtung… der Bildschirm blinkt einmal, während LGs System neu startet","Settings":"Einstellungen","settings and apps are deleted; the TV restarts":"Einstellungen und Apps werden gelöscht; der Fernseher startet neu","Settings for Live TV: switch it on or off, set up or remove your playlist, refresh the guide and learn the Guide key.":"Einstellungen für Live-TV: an oder aus, Playlist einrichten oder entfernen, Programmführer aktualisieren und Guide-Taste lernen.","Share log":"Protokoll teilen","Share the log":"Protokoll teilen","Show":"Anzeigen","Show as QR code":"Als QR-Code zeigen","Show Live TV":"Live-TV anzeigen","Shows a QR code. A phone that scans it opens a page, served by the TV for ten minutes, that shows the notification address and the token with Copy buttons (for Home Assistant, for example). The token is a secret.":"Zeigt einen QR-Code. Ein Handy, das ihn scannt, öffnet eine Seite, die der Fernseher zehn Minuten bereitstellt, mit Benachrichtigungsadresse und Token samt Kopieren-Schaltflächen (zum Beispiel für Home Assistant). Das Token ist geheim.","Shows a QR code. On the phone page you upload photos (they are made the right size on the phone), delete uploads, connect Immich, choose albums and hide single photos.":"Zeigt einen QR-Code. Auf der Handy-Seite lädst du Fotos hoch (sie bekommen auf dem Handy die richtige Größe), löschst Uploads, verbindest Immich, wählst Alben und blendest einzelne Fotos aus.","Shows a QR code. Scan it with a phone on the same Wi-Fi to copy a report for a bug report. Addresses and URL paths are masked; the page closes after ten minutes.":"Zeigt einen QR-Code. Scanne ihn mit einem Handy im selben WLAN, um einen Bericht für eine Fehlermeldung zu kopieren. Adressen und URL-Pfade sind maskiert; die Seite schließt nach zehn Minuten.","Shows a QR code. Scan it with a phone on the same Wi-Fi to enter your OpenRouter key, choose a model, write instructions and set a server address. Nothing is typed on the TV.":"Zeigt einen QR-Code. Scanne ihn mit einem Handy im selben WLAN, um deinen OpenRouter-Schlüssel einzugeben, ein Modell zu wählen, Anweisungen zu schreiben und eine Serveradresse festzulegen. Auf dem Fernseher wird nichts getippt.","Shows the address, the token and an example request.":"Zeigt Adresse, Token und eine Beispielanfrage.","Shows the commands to set the key, model and instructions from a shell, and how to ask by text.":"Zeigt die Befehle, um Schlüssel, Modell und Anweisungen aus einer Shell einzurichten, und wie man per Text fragt.","Size":"Größe","Skip":"Überspringen","Small":"Klein","small widgets on Home":"kleine Widgets auf Home","Speak now…":"Jetzt sprechen…","speak when the card appears":"sprich, wenn die Karte erscheint","Stable releases":"Stabile Versionen","Stable releases are what most people want: at most one a day, made from the dev builds. Dev builds come with every change and can be less finished; choose Dev here, then use the Launcher and Service rows to install it. Going back to Stable offers the latest release again.":"Stabile Versionen sind das, was die meisten wollen: höchstens eine pro Tag, aus den Dev-Builds gemacht. Dev-Builds kommen mit jeder Änderung und können weniger fertig sein; wähle hier Dev und installiere mit den Zeilen Launcher und Dienst. Zurück zu Stabil bietet wieder die neueste Version an.","Start":"Start","Starting":"Wird gestartet","Starts listening without the button: speak when the card appears.":"Startet das Zuhören ohne Taste: Sprich, wenn die Karte erscheint.","Stops contentminer and nudge (recommendations and pop-up tips) and keeps sportsalarm from starting.":"Stoppt contentminer und nudge (Empfehlungen und Pop-up-Tipps) und verhindert den Start von sportsalarm.","Stops LG’s ad, recommendation and telemetry services and blocks a few ad servers. Nothing is uninstalled, and it only applies while this launcher is Home.":"Stoppt LGs Werbe-, Empfehlungs- und Telemetriedienste und sperrt einige Werbeserver. Es wird nichts deinstalliert, und es gilt nur, solange dieser Launcher das Home ist.","Stops LG’s ad, tracking, telemetry and suggestion services, in four groups you can switch separately. Nothing is uninstalled, and it only applies while this launcher is Home.":"Stoppt LGs Werbe-, Tracking-, Telemetrie- und Vorschlagsdienste, in vier Gruppen, die du einzeln schalten kannst. Es wird nichts deinstalliert, und es gilt nur, solange dieser Launcher das Home ist.","Stops remotelogger and service-logger, which collect logs and send them to LG.":"Stoppt remotelogger und service-logger, die Protokolle sammeln und an LG senden.","Stream":"Stream","streams":"Streams","Suggestions and nudges":"Vorschläge und Hinweise","Swaps the previous launcher version back in. The newer one stays available as an update.":"Setzt die vorige Launcher-Version wieder ein. Die neuere bleibt als Update verfügbar.","Switch all off":"Alles ausschalten","Switch all on":"Alles einschalten","Switch Home?":"Home wechseln?","Switch notifications on first":"Zuerst Benachrichtigungen einschalten","Switch off LG’s voice assistant":"LGs Sprachassistenten ausschalten","Switches every group on.":"Schaltet jede Gruppe ein.","Switches the debloat off: the services start again and the hosts lines are removed.":"Schaltet den Debloat aus: Die Dienste starten wieder und die Hosts-Zeilen werden entfernt.","switching restarts the TV":"Umschalten startet den Fernseher neu","Switching to CleanYourTV… the TV restarts in a moment.":"Wechsel zu CleanYourTV… der Fernseher startet gleich neu.","Switching to LG’s Home… the TV restarts in a moment.":"Wechsel zu LGs Home… der Fernseher startet gleich neu.","Switching…":"Wird umgestellt…","Sync now":"Jetzt synchronisieren","synced %s":"synchronisiert %s","Synced photos":"Synchronisierte Fotos","Syncing with Immich…":"Synchronisierung mit Immich…","syncing…":"wird synchronisiert…","Syncing…":"Synchronisierung…","syncing… %d new":"wird synchronisiert… %d neu","Syncing… %d new":"Synchronisierung… %d neu","Take over the Input key":"Eingangstaste übernehmen","Tap Copy, then paste it into your message. Addresses and URL paths are masked. This page closes ten minutes after it was opened on the TV.":"Tippe auf Kopieren und füge es in deine Nachricht ein. Adressen und URL-Pfade sind maskiert. Diese Seite schließt zehn Minuten nach dem Öffnen auf dem Fernseher.","tap to hide or show one":"tippen zum Aus- oder Einblenden","Telemetry logs":"Telemetrie-Protokolle","Temperature":"Temperatur","Test connection and save":"Verbindung testen und speichern","Test the connection":"Verbindung testen","Test.\nPress the Input button once more. Our Inputs list should open over this screen.":"Test.\nDrücke die Input-Taste noch einmal. Unsere Eingangsliste sollte sich über diesem Bildschirm öffnen.","Testing":"Wird getestet","Text":"Text","the address and the token are removed from the TV":"Adresse und Token werden vom Fernseher entfernt","the address must start with http:// or https://":"die Adresse muss mit http:// oder https:// beginnen","the address, the channel list, the guide and your favourites are deleted":"Adresse, Senderliste, Programmführer und Favoriten werden gelöscht","The AI and Home Assistant remember the last turns for ten minutes. This clears them.":"Die KI und Home Assistant merken sich die letzten Beiträge zehn Minuten. Dies löscht sie.","The AI only":"Nur die KI","The background service behind the launcher: Live TV, picture notifications, the Input key, these updates. A failed update restores the previous files.":"Der Hintergrunddienst hinter dem Launcher: Live-TV, Bildbenachrichtigungen, die Eingangstaste, diese Updates. Ein fehlgeschlagenes Update stellt die vorigen Dateien wieder her.","the chosen albums have no photos the TV can show":"die gewählten Alben haben keine Fotos, die der Fernseher zeigen kann","The colour of the focus ring and highlights":"Die Farbe des Fokusrings und der Hervorhebungen","The date":"Das Datum","The Guide key.\nChoose Start, then press the Guide button on your remote. It then opens the Live TV channel guide instead of LG’s guide. Clear it to get LG’s guide back.":"Die Guide-Taste.\nWähle Start und drücke dann die Guide-Taste auf deiner Fernbedienung. Sie öffnet danach den Live-TV-Programmführer statt LGs. Lösche sie, um LGs Programmführer zurückzubekommen.","The Home key (optional).\nChoose Start, then press the Home button on your remote.":"Die Home-Taste (optional).\nWähle Start und drücke dann die Home-Taste auf deiner Fernbedienung.","The home screen you see. Updates come from GitHub releases and are checked against a SHA-256 file before they are installed. If a new launcher does not start, the previous one is put back.":"Der Startbildschirm, den du siehst. Updates kommen aus GitHub-Versionen und werden vor der Installation mit einer SHA-256-Datei geprüft. Startet ein neuer Launcher nicht, kommt der vorige zurück.","The hook did not attach on this firmware, so keys cannot be learned. The Input key stays with LG’s picker.\nUse Share log to report this.":"Der Hook hat sich auf dieser Firmware nicht verbunden, daher können keine Tasten gelernt werden. Die Eingangstaste bleibt bei LGs Auswahl.\nMelde dies über Protokoll teilen.","The Input key.\nChoose Start, then press the Input button on your remote.":"Die Eingangstaste.\nWähle Start und drücke dann die Input-Taste auf deiner Fernbedienung.","The Inputs list did not open.\nIf LG’s own picker showed, the Input key is not mapped: learn it again or switch the Input key off.":"Die Eingangsliste wurde nicht geöffnet.\nWenn LGs eigene Auswahl erschien, ist die Eingangstaste nicht zugeordnet: Lerne sie erneut oder schalte die Eingangstaste aus.","The Inputs list opened: the Input key works.":"Die Eingangsliste wurde geöffnet: Die Eingangstaste funktioniert.","the install did not finish":"die Installation wurde nicht abgeschlossen","the key is forgotten and its photos are deleted from the TV":"der Schlüssel wird vergessen und die Fotos werden vom Fernseher gelöscht","The language of CleanYourTV’s screens: the launcher, this app and the Inputs list. Automatic follows the TV’s menu language. The percentage says how much of a language is translated; the rest stays English. Translations are files in the repository that anyone can add to.":"Die Sprache der Anzeigen von CleanYourTV: der Launcher, diese App und die Eingangsliste. Automatisch folgt der Menüsprache des Fernsehers. Der Prozentsatz zeigt, wie viel einer Sprache übersetzt ist; der Rest bleibt Englisch. Übersetzungen sind Dateien im Repository, zu denen jeder beitragen kann.","the launcher’s Inputs list":"die Eingangsliste des Launchers","The launcher’s own settings go back to the defaults. Apps, the theme and everything in this app stay.":"Die eigenen Einstellungen des Launchers gehen auf den Standard zurück. Apps, das Design und alles in dieser App bleiben.","The new launcher did not start; rolling back":"Der neue Launcher startete nicht; Rückkehr zur alten Version","the new launcher did not start; the previous version is back":"der neue Launcher startete nicht; die vorige Version ist zurück","The notification listener is not running.":"Der Benachrichtigungsempfang läuft nicht.","the old one stops working":"das alte funktioniert nicht mehr","The page has closed. Close this and try again.":"Die Seite wurde geschlossen. Schließe dies und versuche es erneut.","The page is open for ten minutes. It lists versions, the setup log and the service log; addresses and URL paths are masked.":"Die Seite ist zehn Minuten geöffnet. Sie zeigt Versionen, das Einrichtungs- und das Dienstprotokoll; Adressen und URL-Pfade sind maskiert.","The page opens for ten minutes. It is not encrypted: the token travels over your Wi-Fi, so use a network you trust.":"Die Seite ist zehn Minuten offen. Sie ist nicht verschlüsselt: Das Token geht über dein WLAN, also nutze ein Netzwerk, dem du vertraust.","The page stays open for ten minutes, or until you save. It is not encrypted: the key travels over your Wi-Fi, so use a network you trust.":"Die Seite bleibt zehn Minuten offen oder bis du speicherst. Sie ist nicht verschlüsselt: Der Schlüssel geht über dein WLAN, also nutze ein Netzwerk, dem du vertraust.","The page stays open for ten minutes. It is not encrypted: the playlist address, which may hold an access key, travels over your Wi-Fi.":"Die Seite bleibt zehn Minuten offen. Sie ist nicht verschlüsselt: Die Playlist-Adresse, die einen Zugangsschlüssel enthalten kann, geht über dein WLAN.","The page stays open while you use it, at most an hour. It is not encrypted: what you type travels over your Wi-Fi.":"Die Seite bleibt offen, solange du sie benutzt, höchstens eine Stunde. Sie ist nicht verschlüsselt: Was du eingibst, geht über dein WLAN.","The page stays open while you use it, at most an hour. It is not encrypted: your photos and the Immich key travel over your Wi-Fi.":"Die Seite bleibt offen, solange du sie nutzt, höchstens eine Stunde. Sie ist nicht verschlüsselt: Fotos und Immich-Schlüssel gehen über dein WLAN.","the phone page could not start: %s":"die Handy-Seite konnte nicht starten: %s","the picture is larger than 12 MB":"das Bild ist größer als 12 MB","The playlist address must start with http:// or https://":"Die Playlist-Adresse muss mit http:// oder https:// beginnen","The remote’s Input button opens our Inputs list instead of LG’s picker. You can change this later.":"Die Input-Taste der Fernbedienung öffnet unsere Eingangsliste statt LGs Auswahl. Du kannst das später ändern.","The remote’s Input button opens our Inputs list over the running app instead of LG’s picker. Open this screen to switch it off or to learn the button.":"Die Input-Taste der Fernbedienung öffnet unsere Eingangsliste über der laufenden App statt LGs Auswahl. Öffne diesen Bildschirm, um es auszuschalten oder die Taste zu lernen "Probar la conexión y guardar","Test the connection":"Probar la conexión","Test.\nPress the Input button once more. Our Inputs list should open over this screen.":"Prueba.\nPulsa una vez más el botón Input. Nuestra lista de entradas debería abrirse sobre esta pantalla.","Testing":"Probando","Text":"Texto","the address and the token are removed from the TV":"la dirección y el token se eliminan del televisor","the address must start with http:// or https://":"la dirección debe empezar por http:// o https://","the address, the channel list, the guide and your favourites are deleted":"se borran la dirección, la lista de canales, la guía y tus favoritos","The AI and Home Assistant remember the last turns for ten minutes. This clears them.":"La IA y Home Assistant recuerdan los últimos turnos durante diez minutos. Esto los borra.","The AI only":"Solo la IA","The background service behind the launcher: Live TV, picture notifications, the Input key, these updates. A failed update restores the previous files.":"El servicio en segundo plano tras el launcher: TV en directo, notificaciones con imagen, el botón Entrada, estas actualizaciones. Una actualización fallida restaura los archivos anteriores.","the chosen albums have no photos the TV can show":"los álbumes elegidos no tienen fotos que el televisor pueda mostrar","The colour of the focus ring and highlights":"El color del anillo de foco y los resaltados","The date":"La fecha","The Guide key.\nChoose Start, then press the Guide button on your remote. It then opens the Live TV channel guide instead of LG’s guide. Clear it to get LG’s guide back.":"El botón Guía.\nElige Empezar y pulsa el botón Guide del mando. Después abrirá la guía de TV en directo en lugar de la de LG. Bórralo para recuperar la guía de LG.","The Home key (optional).\nChoose Start, then press the Home button on your remote.":"El botón Inicio (opcional).\nElige Empezar y pulsa el botón Home del mando.","The home screen you see. Updates come from GitHub releases and are checked against a SHA-256 file before they are installed. If a new launcher does not start, the previous one is put back.":"La pantalla de inicio que ves. Las actualizaciones vienen de las versiones de GitHub y se comprueban con un archivo SHA-256 antes de instalarse. Si un launcher nuevo no arranca, vuelve el anterior.","The hook did not attach on this firmware, so keys cannot be learned. The Input key stays with LG’s picker.\nUse Share log to report this.":"El hook no se conectó en este firmware, así que no se pueden aprender botones. El botón Entrada sigue con el selector de LG.\nInfórmalo con Compartir el registro.","The Input key.\nChoose Start, then press the Input button on your remote.":"El botón Entrada.\nElige Empezar y pulsa el botón Input del mando.","The Inputs list did not open.\nIf LG’s own picker showed, the Input key is not mapped: learn it again or switch the Input key off.":"No se abrió la lista de entradas.\nSi apareció el selector de LG, el botón Entrada no está asignado: apréndelo de nuevo o desactiva el botón Entrada.","The Inputs list opened: the Input key works.":"Se abrió la lista de entradas: el botón Entrada funciona.","the install did not finish":"la instalación no terminó","the key is forgotten and its photos are deleted from the TV":"se olvida la clave y sus fotos se borran del televisor","The language of CleanYourTV’s screens: the launcher, this app and the Inputs list. Automatic follows the TV’s menu language. The percentage says how much of a language is translated; the rest stays English. Translations are files in the repository that anyone can add to.":"El idioma de las pantallas de CleanYourTV: el launcher, esta app y la lista de entradas. Automático sigue el idioma de los menús del televisor. El porcentaje indica cuánto de un idioma está traducido; el resto sigue en inglés. Las traducciones son archivos del repositorio a los que cualquiera puede contribuir.","the launcher’s Inputs list":"la lista de entradas del launcher","The launcher’s own settings go back to the defaults. Apps, the theme and everything in this app stay.":"Los ajustes propios del launcher vuelven a los predeterminados. Las apps, el tema y todo lo de esta app se quedan.","The new launcher did not start; rolling back":"El nuevo launcher no arrancó; volviendo atrás","the new launcher did not start; the previous version is back":"el nuevo launcher no arrancó; vuelve la versión anterior","The notification listener is not running.":"La escucha de notificaciones no está en marcha.","the old one stops working":"el anterior deja de funcionar","The page has closed. Close this and try again.":"La página se ha cerrado. Cierra esto y vuelve a intentarlo.","The page is open for ten minutes. It lists versions, the setup log and the service log; addresses and URL paths are masked.":"La página está abierta diez minutos. Muestra las versiones, el registro de instalación y el del servicio; direcciones y rutas de URL están ocultas.","The page opens for ten minutes. It is not encrypted: the token travels over your Wi-Fi, so use a network you trust.":"La página se abre diez minutos. No está cifrada: el token viaja por tu wifi, así que usa una red de confianza.","The page stays open for ten minutes, or until you save. It is not encrypted: the key travels over your Wi-Fi, so use a network you trust.":"La página sigue abierta diez minutos o hasta que guardes. No está cifrada: la clave viaja por tu wifi, así que usa una red de confianza.","The page stays open for ten minutes. It is not encrypted: the playlist address, which may hold an access key, travels over your Wi-Fi.":"La página sigue abierta diez minutos. No está cifrada: la dirección de la lista, que puede incluir una clave de acceso, viaja por tu wifi.","The page stays open while you use it, at most an hour. It is not encrypted: what you type travels over your Wi-Fi.":"La página sigue abierta mientras la usas, como mucho una hora. No está cifrada: lo que escribes viaja por tu Wi-Fi.","The page stays open while you use it, at most an hour. It is not encrypted: your photos and the Immich key travel over your Wi-Fi.":"La página sigue abierta mientras la usas, como máximo una hora. No está cifrada: tus fotos y la clave de Immich viajan por tu wifi.","the phone page could not start: %s":"la página del móvil no pudo iniciarse: %s","the picture is larger than 12 MB":"la imagen ocupa más de 12 MB","The playlist address must start with http:// or https://":"La dirección de la lista debe empezar por http:// o https://","The remote’s Input button opens our Inputs list instead of LG’s picker. You can change this later.":"El botón Input del mando abre nuestra lista de entradas en lugar del selector de LG. Puedes cambiarlo después.","The remote’s Input button opens our Inputs list over the running app instead of LG’s picker. Open this screen to switch it off or to learn the button.":"El botón Input del mando abre nuestra lista de entradas sobre la app en uso en lugar del selector de LG. Abre esta pantalla para desactivarlo o aprender el botón.","the screen blinks once":"la pantalla parpadea una vez","The service did not answer":"El servicio no respondió","The service did not answer.":"El servicio no respondió.","The service is not running. Set it up to replace LG’s Home, take over the Input key and keep everything up to date.":"El servicio no está en marcha. Configúralo para sustituir el Inicio de LG, tomar el botón Entrada y mantener todo actualizado.","The TV did not answer.":"El televisor no respondió.","The TV did not answer. Is the phone on the same Wi-Fi?":"El televisor no respondió. ¿Está el móvil en la misma wifi?","the TV restarts":"el televisor se reinicia","The update is taking too long. Log: /tmp/cytv-selfupdate.log on the TV.":"La actualización tarda demasiado. Registro: /tmp/cytv-selfupdate.log en el televisor.","the uploaded photos are deleted from the TV":"las fotos subidas se borran del televisor","The voice button.\nChoose Start, t  photos":"Subir fotos","upload photos, configure Immich":"subir fotos, configurar Immich","Uploaded":"Subidas","Uploads removed":"Subidas quitadas","Use an API key from Immich (Account settings > API keys) with album.read and asset.read/view permissions.":"Usa una clave API de Immich (Ajustes de la cuenta > Claves API) con los permisos album.read y asset.read/view.","Use CleanYourTV as Home":"Usar CleanYourTV como Inicio","Use {{greeting}}, {{time}}, {{date}} and {{weekday}} for what changes, and {{weather.temp}} and {{weather.text}} when a weather card is on Home; **bold**, *italic* and a line starting with # for a heading.":"Usa {{greeting}}, {{time}}, {{date}} y {{weekday}} para lo que cambia, y {{weather.temp}} y {{weather.text}} cuando hay una tarjeta del tiempo en Home; **negrita**, *cursiva* y una línea que empiece con # para un título.","Viewing tracking (LivePlus)":"Seguimiento de lo que ves (LivePlus)","voice":"voz","Voice":"Voz","Voice and the cards stop using it":"la voz y las tarjetas dejan de usarlo","Voice button cleared.":"Botón de voz borrado.","Voice is installed":"La voz está instalada","Voice removed":"Voz quitada","Voice setup":"Configuración de voz","Voice · %s":"Voz · %s","voice, language, network notifications":"voz, idioma, notificaciones de red","Voice, the language of the screens and network notifications.":"La voz, el idioma de las pantallas y las notificaciones de red.","Waiting for the service…":"Esperando al servicio…","Wallpapers":"Wallpapers","Wallpapers is full (150 MB): not every photo was downloaded":"Wallpapers está lleno (150 MB): no se descargaron todas las fotos","Wallpapers is full (150 MB): remove some photos first":"Wallpapers está lleno (150 MB): quita primero algunas fotos","Weather":"Tiempo","Where the recognised text goes. Shows how to set the address of your server. Without one, the text is only shown on screen.":"Adónde va el texto reconocido. Muestra cómo fijar la dirección de tu servidor. Sin servidor, el texto solo émarrage du système de LG","Settings":"Paramètres","settings and apps are deleted; the TV restarts":"les réglages et les apps sont supprimés ; le téléviseur redémarre","Settings for Live TV: switch it on or off, set up or remove your playlist, refresh the guide and learn the Guide key.":"Réglages de la TV en direct : l’activer ou non, configurer ou supprimer votre playlist, actualiser le guide et apprendre la touche Guide.","Share log":"Partager le journal","Share the log":"Partager le journal","Show":"Afficher","Show as QR code":"Afficher en code QR","Show Live TV":"Afficher la TV en direct","Shows a QR code. A phone that scans it opens a page, served by the TV for ten minutes, that shows the notification address and the token with Copy buttons (for Home Assistant, for example). The token is a secret.":"Affiche un code QR. Un téléphone qui le scanne ouvre une page servie dix minutes par le téléviseur, avec l’adresse de notification et le jeton et des boutons Copier (pour Home Assistant, par exemple). Le jeton est secret.","Shows a QR code. On the phone page you upload photos (they are made the right size on the phone), delete uploads, connect Immich, choose albums and hide single photos.":"Affiche un code QR. Sur la page du téléphone, vous envoyez des photos (mises à la bonne taille sur le téléphone), supprimez des envois, connectez Immich, choisissez des albums et masquez des photos.","Shows a QR code. Scan it with a phone on the same Wi-Fi to copy a report for a bug report. Addresses and URL paths are masked; the page closes after ten minutes.":"Affiche un code QR. Scannez-le avec un téléphone sur le même Wi-Fi pour copier un rapport pour signaler un bug. Adresses et chemins d’URL sont masqués ; la page se ferme après dix minutes.","Shows a QR code. Scan it with a phone on the same Wi-Fi to enter your OpenRouter key, choose a model, write instructions and set a server address. Nothing is typed on the TV.":"Affiche un code QR. Scannez-le avec un téléphone sur le même Wi-Fi pour saisir votre clé OpenRouter, choisir un modèle, écrire des instructions et définir une adresse de serveur. Rien n’est tapé sur le téléviseur.","Shows the address, the token and an example request.":"Affiche l’adresse, le jeton et un exemple de requête.","Shows the commands to set the key, model and instructions from a shell, and how to ask by text.":"Affiche les commandes pour définir la clé, le modèle et les instructions depuis un shell, et comment poser une question par texte.","Size":"Taille","Skip":"Passer","Small":"Petit","small widgets on Home":"petits widgets sur l’accueil","Speak now…":"Parlez maintenant…","speak when the card appears":"parlez quand la carte apparaît","Stable releases":"Versions stables","Stable releases are what most people want: at most one a day, made from the dev builds. Dev builds come with every change and can be less finished; choose Dev here, then use the Launcher and Service rows to install it. Going back to Stable offers the latest release again.":"Les versions stables sont ce que la plupart des gens veulent : au plus une par jour, faite à partir des versions dev. Les versions dev arrivent à chaque changement et peuvent être moins finies ; choisissez Dev ici, puis installez avec les lignes Launcher et Service. Revenir à Stable propose à nouveau la dernière version.","Start":"Démarrer","Starting":"Démarrage","Starts listening without the button: speak when the card appears.":"Lance l’écoute sans le bouton : parlez quand la carte apparaît.","Stops contentminer and nudge (recommendations and pop-up tips) and keeps sportsalarm from starting.":"Arrête contentminer et nudge (recommandations et astuces en pop-up) et empêche sportsalarm de démarrer.","Stops LG’s ad, recommendation and telemetry services and blocks a few ad servers. Nothing is uninstalled, and it only applies while this launcher is Home.":"Arrête les services de publicité, de recommandation et de télémétrie de LG et bloque quelques serveurs publicitaires. Rien n’est désinstallé, et cela ne s’applique que tant que ce launcher est l’accueil.","Stops LG’s ad, tracking, telemetry and suggestion services, in four groups you can switch separately. Nothing is uninstalled, and it only applies while this launcher is Home.":"Arrête les services de publicité, de suivi, de télémétrie et de suggestions de LG, en quatre groupes réglables séparément. Rien n’est désinstallé, et cela ne s’applique que tant que ce launcher est l’accueil.","Stops remotelogger and service-logger, which collect logs and send them to LG.":"Arrête remotelogger et service-logger, qui collectent des journaux et les envoient à LG.","Stream":"Flux","streams":"flux","Suggestions and nudges":"Suggestions et incitations","Swaps the previous launcher version back in. The newer one stays available as an update.":"Remet la version précédente du launcher. La plus récente reste disponible comme mise à jour.","Switch all off":"Tout désactiver","Switch all on":"Tout activer","Switch Home?":"Changer d’accueil ?","Switch notifications on first":"Activez d’abord les notifications","Switch off LG’s voice assistant":"Désactiver l’assistant vocal de LG","Switches every group on.":"Active chaque groupe.","Switches the debloat off: the services start again and the hosts lines are removed.":"Désactive le debloat : les services redémarrent et les lignes hosts sont retirées.","switching restarts the TV":"changer redémarre le téléviseur","Switching to CleanYourTV… the TV restarts in a moment.":"Passage à CleanYourTV… le téléviseur redémarre dans un instant.","Switching to LG’s Home… the TV restarts in a moment.":"Passage à l’accueil de LG… le téléviseur redémarre dans un instant.","Switching…":"Changement…","Sync now":"Synchroniser maintenant","synced %s":"synchronisé %s","Synced photos":"Photos synchronisées","Syncing with Immich…":"Synchronisation avec Immich…","syncing…":"synchronisation…","Syncing…":"Synchronisation…","syncing… %d new":{"one":"synchronisation… %d nouvelle","other"
