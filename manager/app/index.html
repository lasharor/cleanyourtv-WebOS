 ring and highlights":"La couleur de l’anneau de sélection et des accents","The date":"La date","The Guide key.\nChoose Start, then press the Guide button on your remote. It then opens the Live TV channel guide instead of LG’s guide. Clear it to get LG’s guide back.":"La touche Guide.\nChoisissez Démarrer, puis appuyez sur le bouton Guide de votre télécommande. Il ouvre ensuite le guide de la TV en direct au lieu de celui de LG. Effacez-le pour retrouver le guide de LG.","The Home key (optional).\nChoose Start, then press the Home button on your remote.":"La touche Accueil (facultative).\nChoisissez Démarrer, puis appuyez sur le bouton Home de votre télécommande.","The home screen you see. Updates come from GitHub releases and are checked against a SHA-256 file before they are installed. If a new launcher does not start, the previous one is put back.":"L’écran d’accueil que vous voyez. Les mises à jour viennent des versions GitHub et sont vérifiées avec un fichier SHA-256 avant l’installation. Si un nouveau launcher ne démarre pas, l’ancien est remis.","The hook did not attach on this firmware, so keys cannot be learned. The Input key stays with LG’s picker.\nUse Share log to report this.":"Le hook ne s’est pas attaché sur ce firmware, les touches ne peuvent donc pas être apprises. La touche Entrée reste au sélecteur de LG.\nSignalez-le via Partager le journal.","The Input key.\nChoose Start, then press the Input button on your remote.":"La touche Entrée.\nChoisissez Démarrer, puis appuyez sur le bouton Input de votre télécommande.","The Inputs list did not open.\nIf LG’s own picker showed, the Input key is not mapped: learn it again or switch the Input key off.":"La liste d’entrées ne s’est pas ouverte.\nSi le sélecteur de LG est apparu, la touche Entrée n’est pas associée : apprenez-la à nouveau ou désactivez la touche Entrée.","The Inputs list opened: the Input key works.":"La liste d’entrées s’est ouverte : la touche Entrée fonctionne.","the install did not finish":"l’installation ne s’est pas terminée","the key is forgotten and its photos are deleted from the TV":"la clé est oubliée et ses photos sont supprimées du téléviseur","The language of CleanYourTV’s screens: the launcher, this app and the Inputs list. Automatic follows the TV’s menu language. The percentage says how much of a language is translated; the rest stays English. Translations are files in the repository that anyone can add to.":"La langue des écrans de CleanYourTV : le launcher, cette app et la liste d’entrées. Automatique suit la langue des menus du téléviseur. Le pourcentage indique la part traduite d’une langue ; le reste reste en anglais. Les traductions sont des fichiers du dépôt auxquels chacun peut contribuer.","the launcher’s Inputs list":"la liste d’entrées du launcher","The launcher’s own settings go back to the defaults. Apps, the theme and everything in this app stay.":"Les réglages propres du launcher reviennent aux valeurs par défaut. Les apps, le thème et tout ce qui est dans cette app restent.","The new launcher did not start; rolling back":"Le nouveau launcher n’a pas démarré ; retour en arrière","the new launcher did not start; the previous version is back":"le nouveau launcher n’a pas démarré ; la version précédente est de retour","The notification listener is not running.":"L’écoute des notifications ne tourne pas.","the old one stops working":"l’ancien ne fonctionne plus","The page has closed. Close this and try again.":"La page s’est fermée. Fermez ceci et réessayez.","The page is open for ten minutes. It lists versions, the setup log and the service log; addresses and URL paths are masked.":"La page est ouverte dix minutes. Elle liste les versions, le journal d’installation et celui du service ; adresses et chemins d’URL sont masqués.","The page opens for ten minutes. It is not encrypted: the token travels over your Wi-Fi, so use a network you trust.":"La page s’ouvre dix minutes. Elle n’est pas chiffrée : le jeton passe par votre s once":"l’écran clignote une fois","The service did not answer":"Le service n’a pas répondu","The service did not answer.":"Le service n’a pas répondu.","The service is not running. Set it up to replace LG’s Home, take over the Input key and keep everything up to date.":"Le service ne tourne pas. Configurez-le pour remplacer l’accueil de LG, prendre la touche Entrée et tout garder à jour.","The TV did not answer.":"Le téléviseur n’a pas répondu.","The TV did not answer. Is the phone on the same Wi-Fi?":"Le téléviseur n’a pas répondu. Le téléphone est-il sur le même Wi-Fi ?","the TV restarts":"le téléviseur redémarre","The update is taking too long. Log: /tmp/cytv-selfupdate.log on the TV.":"La mise à jour prend trop de temps. Journal : /tmp/cytv-selfupdate.log sur le téléviseur.","the uploaded photos are deleted from the TV":"les photos envoyées sont supprimées du téléviseur","The voice button.\nChoose Start, then press the button you want to use for voice. The remote’s microphone button may not reach the hook; any spare button works.":"Le bouton voix.\nChoisissez Démarrer, puis appuyez sur le bouton à utiliser pour la voix. Le bouton micro peut ne pas atteindre le hook ; tout bouton libre convient.","The weather (from a weather card)":"La météo (d’une carte météo)","Theme":"Thème","Theme default":"Celle du thème","Theme options":"Options du thème","there are %d uploads already: remove some first":"il y a déjà %d envois : supprimez-en d’abord","there is no previous version":"il n’y a pas de version précédente","this entity cannot be switched from the TV":"cette entité ne peut pas être commandée depuis la TV","This is not valid JSON.":"Ce n’est pas du JSON valide.","This theme has no places for cards":"Ce thème n’a pas d’emplacements pour les cartes","This theme has no places for cards. Choose a theme with cards (Lock Screen) in Customise > Theme.":"Ce thème n’a pas d’emplacement pour les cartes. Choisissez un thème avec des cartes (Lock Screen) dans Personnaliser > Thème.","This TV also has LG’s full-screen Home: if the Home button opens that instead of this launcher, set TV Settings > General > Home Settings > Home Style to Basic.":"Ce téléviseur a aussi l’accueil plein écran de LG : si le bouton Home l’ouvre au lieu de ce launcher, réglez Paramètres > Général > Paramètres de l’accueil > Style d’accueil sur Basique.","Title (optional)":"Titre (facultatif)","Total":"Total","Try again":"Réessayer","Try it now":"Essayer maintenant","TV language: %s":"Langue du téléviseur : %s","Uninstall":"Désinstaller","untested firmware; a failed start restarts the TV":"firmware non testé ; un démarrage raté redémarre le téléviseur","Up to date":"À jour","Update channel":"Canal de mise à jour","Update failed: %s":"Échec de la mise à jour : %s","Update to %s":"Mettre à jour vers %s","Update to %s (dev build)":"Mettre à jour vers %s (version dev)","Updates: %s":"Mises à jour : %s","Updating to %s…":"Mise à jour vers %s…","Updating… %s":"Mise à jour… %s","Upload photos":"Envoyer des photos","upload photos, configure Immich":"envoyer des photos, configurer Immich","Uploaded":"Envoyées","Uploads removed":"Envois supprimés","Use an API key from Immich (Account settings > API keys) with album.read and asset.read/view permissions.":"Utilisez une clé API d’Immich (Paramètres du compte > Clés API) avec les droits album.read et asset.read/view.","Use CleanYourTV as Home":"Utiliser CleanYourTV comme accueil","Use {{greeting}}, {{time}}, {{date}} and {{weekday}} for what changes, and {{weather.temp}} and {{weather.text}} when a weather card is on Home; **bold**, *italic* and a line starting with # for a heading.":"Utilisez {{greeting}}, {{time}}, {{date}} et {{weekday}} pour ce qui change, et {{weather.temp}} et {{weather.text}} quand une carte météo est sur l’accueil ; **gras**, *italique* et une ligne commençant par # pour un titre.","Viewing tracking (LivePlus)":"Suivi du visionnage (LivePlus)","voice":"voix","Voice":"Voix","Voice and the cards stop us  tasto Home. Il tasto Home continua a funzionare esattamente come prima.","Optional. Speak into the remote and the TV turns it into text on the TV itself (Moonshine, English). The text can be sent to a server you run. Audio never leaves the TV. Needs a download of about 80 MB.":"Opzionale. Parla nel telecomando e il TV converte il parlato in testo sul TV stesso (Moonshine, inglese). Il testo può essere inviato a un server che gestisci. L'audio non lascia mai il TV. Richiede un download di circa 80 MB.","over the running app, ready in the background (instant)":"sopra l'app in esecuzione, pronto in background (istantaneo)","over the running app, started when pressed":"sopra l'app in esecuzione, avviato alla pressione","Photo %d of %d · preparing":"Foto %d di %d · preparazione","Photo %d of %d · sending":"Foto %d di %d · invio","Photos from the Immich albums you chose, downloaded to the TV every six hours (and with Sync now), so Home never waits for Immich. At most 300.":"Foto dagli album Immich scelti, scaricate sul TV ogni sei ore (e con Sincronizza adesso), così la Home non aspetta mai Immich. Al massimo 300.","Photos uploaded from a phone, kept on the TV. At most 100.":"Foto caricate da un telefono, mantenute sul TV. Al massimo 100.","Picture size":"Dimensione immagine","Place":"Luogo","Playlist":"Playlist","Playlist address (M3U)":"Indirizzo playlist (M3U)","Playlist removed":"Playlist rimossa","Playlist saved":"Playlist salvata","Preparing the report…":"Preparazione della segnalazione…","Preparing…":"Preparazione…","Press and hold the text, then choose Copy":"Tieni premuto il testo, poi scegli Copia","Press the %s button now…":"Premi ora il pulsante %s…","Puts the dock, the top buttons, hidden apps, the app order and the clock back to the defaults. The theme stays.":"Riporta il dock, i pulsanti in alto, le app nascoste, l'ordine delle app e l'orologio ai valori predefiniti. Il tema rimane.","QR code for your phone":"Codice QR per il tuo telefono","Reading status…":"Lettura stato…","Reads the code of your remote’s Input button from the hook, then tests that our list opens. The default is 241. Clear goes back to it.":"Legge il codice del tasto Ingressi del telecomando dall'hook, poi verifica che la nostra lista si apra. Il predefinito è 241. Cancella ripristina il predefinito.","Recent":"Recenti","Recent channels cleared":"Canali recenti cancellati","recommended first · installed %s":"consigliati prima · installato %s","Records the code of the remote button that starts listening. Try the microphone button first; any spare button works.":"Registra il codice del pulsante del telecomando che avvia l'ascolto. Prova prima il pulsante del microfono; qualsiasi pulsante libero funziona.","Records the Guide button’s code. Afterwards it opens the Live TV channel guide over whatever is running (only while Live TV is on). Clear it to get LG’s guide back.":"Registra il codice del pulsante Guida. In seguito apre la guida canali Live TV sopra qualsiasi cosa sia in esecuzione (solo mentre Live TV è attiva). Cancellalo per ripristinare la guida LG.","Refresh playlist and guide":"Aggiorna playlist e guida","Refreshing in the background":"Aggiornamento in background","Refreshing…":"Aggiornamento in corso…","refused":"rifiutato","reloaded":"ricaricato","Remove all uploads":"Rimuovi tutti i caricamenti","Remove CleanYourTV?":"Rimuovere CleanYourTV?","Remove the playlist":"Rimuovi la playlist","Remove the playlist?":"Rimuovere la playlist?","Remove voice":"Rimuovi voce","Removes the apps, the boot scripts and your settings, then restarts the TV so LG’s Home comes back.":"Rimuove le app, gli script di avvio e le impostazioni, poi riavvia il TV così la Home LG torna.","Removing CleanYourTV… the TV restarts in a moment and LG’s Home comes back.":"Rimozione di CleanYourTV… il TV si riavvia tra un momento e la Home LG torna.","Reset Home customisation":"Ripristina personalizzazione Home","Restarting the service":"Riavvio del servizio","Restarts the TV; LG’s own Home is Home after it starts. You can switch back here.":"Riavvia il TV; dopo il riavvio la Home è quella LG. Puoi tornare qui per cambiare.","Restarts the TV; this launcher is Home after it starts.":"Riavvia il TV; dopo il riavvio questo launcher è la Home.","Right column":"Colonna destra","Running apps":"App in esecuzione","Save":"Salva","Save albums and sync":"Salva album e sincronizza","Save JSON":"Salva JSON","Saved":"Salvato","Saved. Open Home on the TV to see it.":"Salvato. Apri la Home sul TV per vederlo.","Saved. The TV is loading your channels now; you can close this page.":"Salvato. Il TV sta caricando i canali; puoi chiudere questa pagina.","Saved. You can close this page.":"Salvato. Puoi chiudere questa pagina.","Saving…":"Salvataggio…","scan with a phone to copy the address and token":"scansiona con un telefono per copiare l'indirizzo e il token","Search":"Cerca","Second line (where there is room)":"Seconda riga (dove c'è spazio)","Select all":"Seleziona tutto","selected":"selezionato","Send the text to":"Invia il testo a","Send the text to your own server":"Invia il testo al tuo server","Sends what you say as text to Home Assistant’s Assist and shows its answer. Needs the address and a long-lived access token (Home Assistant profile page), entered on your phone. Choosing this row tests the connection.":"Invia ciò che dici come testo ad Assist di Home Assistant e mostra la risposta. Richiede l'indirizzo e un token di accesso a lunga durata (pagina profilo di Home Assistant), inseriti sul telefono. Scegliendo questa riga si testa la connessione.","Server token":"Token server","Service":"Servizio","Service %s":"Servizio %s","set up":"configurato","Set up anyway":"Configura comunque","set up from your phone":"configura dal tuo telefono","Set up from your phone":"Configura dal tuo telefono","set the Home Assistant address too":"imposta anche l'indirizzo di Home Assistant","set up Home Assistant first":"configura prima Home Assistant","Set up Live TV":"Configura Live TV","Set up now":"Configura adesso","Set up with commands":"Configura con comandi","Setting up… %s":"Configurazione… %s","Setting up… the screen blinks once while LG’s system restarts":"Configurazione… lo schermo lampeggia una volta mentre il sistema LG si riavvia","Settings":"Impostazioni","settings and apps are deleted; the TV restarts":"le impostazioni e le app vengono eliminate; il TV si riavvia","Settings for Live TV: switch it on or off, set up or remove your playlist, refresh the guide and learn the Guide key.":"Impostazioni per Live TV: attiva o disattiva, configura o rimuovi la playlist, aggiorna la guida e acquisisci il tasto Guida.","Share log":"Condividi log","Share the log":"Condividi il log","Show":"Mostra","Show as QR code":"Mostra come codice QR","Show Live TV":"Mostra Live TV","Shows a QR code. A phone that scans it opens a page, served by the TV for ten minutes, that shows the notification address and the token with Copy buttons (for Home Assistant, for example). The token is a secret.":"Mostra un codice QR. Un telefono che lo scansiona apre una pagina, servita dal TV per dieci minuti, che mostra l'indirizzo notifiche e il token con i pulsanti Copia (per Home Assistant, ad esempio). Il token è segreto.","Shows a QR code. On the phone page you upload photos (they are made the right size on the phone), delete uploads, connect Immich, choose albums and hide single photos.":"Mostra un codice QR. Nella pagina del telefono puoi caricare foto (vengono ridimensionate sul telefono), eliminare caricamenti, connettere Immich, scegliere album e nascondere singole foto.","Shows a QR code. Scan it with a phone on the same Wi-Fi to copy a report for a bug report. Addresses and URL paths are masked; the page closes after ten minutes.":"Mostra un codice QR. Scansionalo con un telefono sulla stessa Wi-Fi per copiare una segnalazione. Gli indirizzi e i percorsi URL sono mascherati; la pagina si chiude dopo dieci minuti.","Shows a QR code. Scan it with a phone on the same Wi-Fi to enter your OpenRouter key, choose a model, write instructions and set a server address. Nothing is typed on the TV.":"Mostra un codice QR. Scansionalo con un telefono sulla stessa Wi-Fi per inserire la chiave OpenRouter, scegliere un modello, scrivere istruzioni e impostare un indirizzo server. Nulla viene digitato sul TV.","Shows the address, the token and an example request.":"Mostra l'indirizzo, il token e una richiesta di esempio.","Shows the commands to set the key, model and instructions from a shell, and how to ask by text.":"Mostra i comandi per impostare chiave, modello e istruzioni da shell, e come fare domande via testo.","Size":"Dimensione","Skip":"Salta","Small":"Piccolo","small widgets on Home":"piccoli widget sulla Home","Speak now…":"Parla adesso…","speak when the card appears":"parla quando appare la scheda","Stable releases":"Versioni stabili","Stable releases are what most people want: at most one a day, made from the dev builds. Dev builds come with every change and can be less finished; choose Dev here, then use the Launcher and Service rows to install it. Going back to Stable offers the latest release again.":"Le versioni stabili sono ciò che la maggior parte delle persone vuole: al massimo una al giorno, create dalle build dev. Le build dev arrivano ad ogni modifica e possono essere meno rifinite; scegli Dev qui, poi usa le righe Launcher e Servizio per installarla. Tornare a Stable propone di nuovo l'ultima versione.","Start":"Avvia","Starting":"Avvio","Starts listening without the button: speak when the card appears.":"Inizia l'ascolto senza il pulsante: parla quando appare la scheda.","Stops contentminer and nudge (recommendations and pop-up tips) and keeps sportsalarm from starting.":"Blocca contentminer e nudge (raccomandazioni e suggerimenti pop-up) e impedisce l'avvio di sportsalarm.","Stops LG’s ad, recommendation and telemetry services and blocks a few ad servers. Nothing is uninstalled, and it only applies while this launcher is Home.":"Blocca i servizi di pubblicità, raccomandazione e telemetria di LG e blocca alcuni server pubblicitari. Nulla viene disinstallato, e si applica solo mentre questo launcher è la Home.","Stops LG’s ad, tracking, telemetry and suggestion services, in four groups you can switch separately. Nothing is uninstalled, and it only applies while this launcher is Home.":"Blocca i servizi di pubblicità, tracciamento, telemetria e suggerimenti di LG, in quattro gruppi separabili. Nulla viene disinstallato, e si applica solo mentre questo launcher è la Home.","Stops remotelogger and service-logger, which collect logs and send them to LG.":"Blocca remotelogger e service-logger, che raccolgono log e li inviano a LG.","Stream":"Stream","streams":"stream","Suggestions and nudges":"Suggerimenti e notifiche","Swaps the previous launcher version back in. The newer one stays available as an update.":"Ripristina la versione precedente del launcher. Quella più recente rimane disponibile come aggiornamento.","Switch all off":"Disattiva tutto","Switch all on":"Attiva tutto","Switch Home?":"Cambiare Home?","Switch notifications on first":"Attiva prima le notifiche","Switch off LG’s voice assistant":"Disattiva l'assistente vocale LG","Switches every group on.":"Attiva tutti i gruppi.","Switches the debloat off: the services start again and the hosts lines are removed.":"Disattiva il debloat: i servizi si riavviano e le righe degli host vengono rimosse.","switching restarts the TV":"il cambio riavvia il TV","Switching to CleanYourTV… the TV restarts in a moment.":"Passaggio a CleanYourTV… il TV si riavvia tra un momento.","Switching to LG’s Home… the TV restarts in a moment.":"Passaggio alla Home LG… il TV si riavvia tra un momento.","Switching…":"Cambio in corso…","Sync now":"Sincronizza adesso","synced %s":"sincronizzato %s","Synced photos":"Foto sincronizzate","Syncing with Immich…":"Sincronizzazione con Immich…","syncing…":"sincronizzazione…","Syncing…":"Sincronizzazione…","syncing… %d new":"sincronizzazione… %d nuove","Syncing… %d new":"Sincronizzazione… %d nuove","Take over the Input key":"Prendi controllo del tasto Ingressi","Tap Copy, then paste it into your message. Addresses and URL paths are masked. This page closes ten minutes after it was opened on the TV.":"Tocca Copia, poi incollalo nel tuo messaggio. Gli indirizzi e i percorsi URL sono mascherati. Questa pagina si chiude dieci minuti dopo essere stata aperta sul TV.","tap to hide or show one":"tocca per nascondere o mostrare","Telemetry logs":"Log di telemetria","Temperature":"Temperatura","Test connection and save":"Testa connessione e salva","Test the connection":"Testa la connessione","Test.\nPress the Input button once more. Our Inputs list should open over this screen.":"Test.\nPremi di nuovo il tasto Ingressi. La nostra lista Ingressi dovrebbe aprirsi sopra questo schermo.","Testing":"Test in corso","Text":"Testo","the address and the token are removed from the TV":"l'indirizzo e il token vengono rimossi dal TV","the address must start with http:// or https://":"l'indirizzo deve iniziare con http:// o https://","the address, the channel list, the guide and your favourites are deleted":"l'indirizzo, la lista canali, la guida e i preferiti vengono eliminati","The AI and Home Assistant remember the last turns for ten minutes. This clears them.":"L'AI e Home Assistant ricordano gli ultimi scambi per dieci minuti. Questo li cancella.","The AI only":"Solo l'AI","The background service behind the launcher: Live TV, picture notifications, the Input key, these updates. A failed update restores the previous files.":"Il servizio in background dietro il launcher: Live TV, notifiche con immagini, il tasto Ingressi, questi aggiornamenti. Un aggiornamento fallito ripristina i file precedenti.","the chosen albums have no photos the TV can show":"gli album scelti non hanno foto che il TV può mostrare","The colour of the focus ring and highlights":"Il colore dell'anello di selezione e degli elementi in evidenza","The date":"La data","The Guide key.\nChoose Start, then press the Guide button on your remote. It then opens the Live TV channel guide instead of LG’s guide. Clear it to get LG’s guide back.":"Il tasto Guida.\nScegli Avvia, poi premi il pulsante Guida sul telecomando. Aprirà la guida canali Live TV invece della guida LG. Cancellalo per ripristinare la guida LG.","The Home key (optional).\nChoose Start, then press the Home button on your remote.":"Il tasto Home (opzionale).\nScegli Avvia, poi premi il pulsante Home sul telecomando.","The home screen you see. Updates come from GitHub releases and are checked against a SHA-256 file before they are installed. If a new launcher does not start, the previous one is put back.":"La schermata Home che vedi. Gli aggiornamenti provengono dai rilasci GitHub e vengono verificati con un file SHA-256 prima dell'installazione. Se un nuovo launcher non si avvia, viene ripristinato il precedente.","The hook did not attach on this firmware, so keys cannot be learned. The Input key stays with LG’s picker.\nUse Share log to report this.":"L'hook non si è collegato su questo firmware, quindi i tasti non possono essere acquisiti. Il tasto Ingressi rimane con il selettore LG.\nUsa Condividi log per segnalarlo.","The Input key.\nChoose Start, then press the Input button on your remote.":"Il tasto Ingressi.\nScegli Avvia, poi premi il pulsante Ingressi sul telecomando.","The Inputs list did not open.\nIf LG’s own picker showed, the Input key is not mapped: learn it again or switch the Input key off.":"La lista Ingressi non si è aperta.\nSe è apparso il selettore LG, il tasto Ingressi non è mappato: acquisiscilo di nuovo o disattivalo.","The Inputs list opened: the Input key works.":"La lista Ingressi si è aperta: il tasto Ingressi funziona.","the install did not finish":"l'installazione non è terminata","the key is forgotten and its photos are deleted from the TV":"la chiave viene dimenticata e le sue foto vengono eliminate dal TV","The language of CleanYourTV’s screens: the launcher, this app and the Inputs list. Automatic follows the TV’s menu language. The percentage says how much of a language is translated; the rest stays English. Translations are files in the repository that anyone can add to.":"La lingua delle schermate di CleanYourTV: il launcher, questa app e la lista Ingressi. Automatico segue la lingua del menu del TV. La percentuale indica quanto di una lingua è tradotta; il resto rimane in inglese. Le traduzioni sono file nel repository che chiunque può aggiungere.","the launcher’s Inputs list":"la lista Ingressi del launcher","The launcher’s own settings go back to the defaults. Apps, the theme and everything in this app stay.":"Le impostazioni del launcher tornano ai valori predefiniti. Le app, il tema e tutto in questa app rimangono.","The new launcher did not start; rolling back":"Il nuovo launcher non si è avviato; ripristino","the new launcher did not start; the previous version is back":"il nuovo launcher non si è avviato; la versione precedente è tornata","The notification listener is not running.":"Il listener delle notifiche non è in esecuzione.","the old one stops working":"il vecchio smette di funzionare","The page has closed. Close this and try again.":"La pagina si è chiusa. Chiudi questa e riprova.","The page is open for ten minutes. It lists versions, the setup log and the service log; addresses and URL paths are masked.":"La pagina è aperta per dieci minuti. Elenca le versioni, il log di configurazione e il log del servizio; gli indirizzi e i percorsi URL sono mascherati.","The page opens for ten minutes. It is not encrypted: the token travels over your Wi-Fi, so use a network you trust.":"La pagina si apre per dieci minuti. Non è crittografata: il token viaggia sulla tua Wi-Fi, usa una rete di cui ti fidi.","The page stays open for ten minutes, or until you save. It is not encrypted: the key travels over your Wi-Fi, so use a network you trust.":"La pagina rimane aperta per dieci minuti, o fino al salvataggio. Non è crittografata: la chiave viaggia sulla tua Wi-Fi, usa una rete di cui ti fidi.","The page stays open for ten minutes. It is not encrypted: the playlist address, which may hold an access key, travels over your Wi-Fi.":"La pagina rimane aperta per dieci minuti. Non è crittografata: l'indirizzo della playlist, che potrebbe contenere una chiave di accesso, viaggia sulla tua Wi-Fi.","The page stays open while you use it, at most an hour. It is not encrypted: what you type travels over your Wi-Fi.":"La pagina rimane aperta mentre la usi, al massimo un'ora. Non è crittografata: ciò che digiti viaggia sulla tua Wi-Fi.","The page stays open while you use it, at most an hour. It is not encrypted: your photos and the Immich key travel over your Wi-Fi.":"La pagina rimane aperta mentre la usi, al massimo un'ora. Non è crittografata: le tue foto e la chiave Immich viaggiano sulla tua Wi-Fi.","the phone page could not start: %s":"la pagina del telefono non è riuscita ad avviarsi: %s","the picture is larger than 12 MB":"l'immagine è più grande di 12 MB","The playlist address must start with http:// or https://":"L'indirizzo della playlist deve iniziare con http:// o https://","The remote’s Input button opens our Inputs list instead of LG’s picker. You can change this later.":"Il pulsante Ingressi del telecomando apre la nostra lista Ingressi invece del selettore LG. Puoi cambiarlo in seguito.","The remote’s Input button opens our Inputs list over the running app instead of LG’s picker. Open this screen to switch it off or to learn the button.":"Il pulsante Ingressi del telecomando apre la nostra lista Ingressi sopra l'app in esecuzione invece del selettore LG. Apri questa schermata per disattivarlo o per acquisire il pulsante.","the screen blinks once":"lo schermo lampeggia una volta","The service did not answer":"Il servizio non ha risposto","The service did not answer.":"Il servizio non ","Launcher":"Launcher","Launcher %s":"Launcher %s","Launcher %s installed":"Launcher %s geïnstalleerd","Launcher %s restored":"Launcher %s teruggezet","Launcher %s · service %s":"Launcher %s · service %s","learn a button first":"leer eerst een knop","Learn again":"Opnieuw leren","Learn the Guide key":"Gidstoets leren","Learn the Home key":"Home-toets leren","Learn the Input key":"Ingangtoets leren","Learn the voice button":"Spraakknop leren","learned: %s":"geleerd: %s","leave empty to use the playlist's":"leeg laten om die van de afspeellijst te gebruiken","Lets other devices on your network send picture notifications to this TV with a POST request and a secret token. Off by default.":"Laat andere apparaten in je netwerk fotomeldingen naar deze TV sturen met een POST-verzoek en een geheim token. Standaard uit.","LG’s guide again":"weer LG’s gids","LG’s guide stays":"LG’s gids blijft","LG’s own assistant reacts to the same button and sends the audio to LG. On: it is paused while voice is on. A reboot or switching this off undoes it.":"LG’s eigen assistent reageert op dezelfde knop en stuurt de audio naar LG. Aan: hij is gepauzeerd zolang spraak aan staat. Een herstart of dit uitzetten maakt het ongedaan.","LG’s own list: CleanYourTV is not the Home":"LG’s eigen lijst: CleanYourTV is niet de Home","Listen on the voice button":"Luisteren op de spraakknop","listening…":"luisteren…","Listening…":"Luisteren…","Live TV":"Live TV","Live TV is off":"Live TV staat uit","Live TV setup":"Live TV instellen","Live TV: your own playlist":"Live TV: je eigen afspeellijst","loading guide":"gids laden","loading playlist":"afspeellijst laden","Loading the model list…":"Modellenlijst laden…","Local uploads":"Lokale uploads","Local uploads: %d · Immich: %d · Total: %d photos (%d of 150 MB)":"Lokale uploads: %d · Immich: %d · Totaal: %d foto’s (%d van 150 MB)","Lock Screen, Bloom and Horizon have them":"Lock Screen, Bloom en Horizon hebben ze","Looking for the dev build…":"Dev-build zoeken…","Looks for a newer release on GitHub. Nothing is installed until you choose an update.":"Zoekt een nieuwere release op GitHub. Er wordt niets geïnstalleerd tot je een update kiest.","Manage from your phone":"Beheren met je telefoon","Medium":"Middel","Model":"Model","Model: %s":"Model: %s","More":"Meer","Name (optional)":"Naam (optioneel)","names, texts, card options":"namen, teksten, kaartopties","needs Home Assistant":"Home Assistant nodig","needs service %s or newer; update the service first":"heeft service %s of nieuwer nodig; werk eerst de service bij","Network notifications":"Netwerkmeldingen","never":"nooit","New picture":"Nieuwe afbeelding","New token":"Nieuw token","New token created. Open “How to send” to see it.":"Nieuw token gemaakt. Open ‘Hoe te versturen’ om het te zien.","no answer":"geen antwoord","no channels found in that playlist":"geen zenders gevonden in die afspeellijst","no key set":"geen sleutel ingesteld","no release published yet":"nog geen release gepubliceerd","No release yet":"Nog geen release","No, keep it":"Nee, bewaren","None":"Geen","none published right now":"nu niet gepubliceerd","not a JPEG, PNG or WebP picture":"geen JPEG-, PNG- of WebP-afbeelding","not a picture the TV can show":"geen afbeelding die de TV kan tonen","not available":"niet beschikbaar","not available on this firmware":"niet beschikbaar op deze firmware","not connected":"niet verbonden","Not connected.":"Niet verbonden.","Not found":"Niet gevonden","not installed":"niet geïnstalleerd","not learned":"niet geleerd","not paused yet":"nog niet gepauzeerd","not set":"niet ingesteld","not set · More > Home Assistant":"niet ingesteld · Meer > Home Assistant","not set · shows a card only":"niet ingesteld · toont alleen een kaart","not set up":"niet ingesteld","Nothing changes.":"Er verandert niets.","nothing to remove":"niets te verwijderen","Nothing was pressed.":"Er is niets ingedrukt.","Notification address and token":"Meldingsadres en token","Now":"Nu","Now and the next days":"Nu en de komende dagen","now: %s":"nu: %s","Off":"Uit","On":"Aan","On: pressing Input shows our Inputs list. Off: LG’s picker comes back at once.":"Aan: op Input drukken toont onze ingangenlijst. Uit: LG’s kiezer komt meteen terug.","On: pressing the button you learned starts listening. A card shows what was heard.":"Aan: de geleerde knop indrukken start het luisteren. Een kaart toont wat er gehoord is.","On: the Home button opens this launcher. Off: LG’s own Home. Switching restarts the TV (about a minute); the service keeps running either way.":"Aan: de Home-knop opent deze launcher. Uit: LG’s eigen Home. Wisselen herstart de TV (ongeveer een minuut); de service blijft hoe dan ook draaien.","On: the launcher has a Live TV button and tile, the Inputs list has Live TV, and the Guide key can open the channel guide. Off: all of that is hidden and LG’s own player and guide are used. Your playlist is kept.":"Aan: de launcher heeft een Live TV-knop en -tegel, de ingangenlijst heeft Live TV, en de gidstoets kan de zendergids openen. Uit: dat alles is verborgen en LG’s eigen speler en gids worden gebruikt. Je afspeellijst blijft bewaard.","On: the TV listens on port 8767 for POST /notify with the token. Anyone who has the token and network access can show cards on this screen.":"Aan: de TV luistert op poort 8767 naar POST /notify met het token. Iedereen met het token en toegang tot het netwerk kan kaarten op dit scherm tonen.","On: what you say is also sent as text to a language model through OpenRouter and the answer is shown on screen. Needs your OpenRouter key; the text goes to OpenRouter and the model provider, never audio.":"Aan: wat je zegt, gaat ook als tekst naar een taalmodel via OpenRouter en het antwoord verschijnt op het scherm. Vraagt je OpenRouter-sleutel; de tekst gaat naar OpenRouter en de modelaanbieder, nooit audio.","one is saved, leave empty to keep it":"er is er een opgeslagen, leeg laten om die te houden","Open":"Openen","OpenRouter key":"OpenRouter-sleutel","optional":"optioneel","Optional. Records the Home button’s code. The Home key keeps working exactly as before.":"Optioneel. Legt de code van de Home-knop vast. De Home-knop blijft precies werken zoals eerst.","Optional. Speak into the remote and the TV turns it into text on the TV itself (Moonshine, English). The text can be sent to a server you run. Audio never leaves the TV. Needs a download of about 80 MB.":"Optioneel. Spreek in de afstandsbediening en de TV zet het op de TV zelf om in tekst (Moonshine, Engels). De tekst kan naar een server van jou. Audio verlaat de TV nooit. Vraagt een download van ongeveer 80 MB.","over the running app, ready in the background (instant)":"over de lopende app, klaar op de achtergrond (direct)","over the running app, started when pressed":"over de lopende app, gestart bij indrukken","Photo %d of %d · preparing":"Foto %d van %d · voorbereiden","Photo %d of %d · sending":"Foto %d van %d · versturen","Photos from the Immich albums you chose, downloaded to the TV every six hours (and with Sync now), so Home never waits for Immich. At most 300.":"Foto’s uit de Immich-albums die je koos, elke zes uur naar de TV gedownload (en met Nu synchroniseren), zodat Home nooit op Immich wacht. Hooguit 300.","Photos uploaded from a phone, kept on the TV. At most 100.":"Foto’s geüpload met een telefoon, bewaard op de TV. Hooguit 100.","Picture size":"Fotogrootte","Place":"Plaats","Playlist":"Afspeellijst","Playlist address (M3U)":"Adres van de afspeellijst (M3U)","Playlist removed":"Afspeellijst verwijderd","Playlist saved":"Afspeellijst opgeslagen","Preparing the report…":"Rapport voorbereiden…","Preparing…":"Voorbereiden…","Press and hold the text, then choose Copy":"Houd de tekst ingedrukt en kies Kopiëren","Press the %s button now…":"Druk nu op de %s-knop…","Puts the dock, the top buttons, hidden apps, the app order and the clock back to the defaults. The theme stays.":"Zet het dock, de knoppen bovenaan, verborgen apps, de volgorde en de klok terug naar de standaard. Het thema blijft.","QR code for your phone":"QR-code voor je telefoon","Reading status…":"Status lezen…","Reads the code of your remote’s Input button from the hook, then tests that our list opens. The default is 241. Clear goes back to it.":"Leest de code van de Input-knop van je afstandsbediening uit de hook en test dan of onze lijst opent. De standaard is 241. Wissen gaat daarheen terug.","Recent":"Recent","Recent channels cleared":"Recente zenders gewist","recommended first · installed %s":"eerst aanbevolen · geïnstalleerd %s","Records the code of the remote button that starts listening. Try the microphone button first; any spare button works.":"Legt de code vast van de knop die het luisteren start. Probeer eerst de microfoonknop; elke vrije knop werkt.","Records the Guide button’s code. Afterwards it opens the Live TV channel guide over whatever is running (only while Live TV is on). Clear it to get LG’s guide back.":"Legt de code van de Guide-knop vast. Daarna opent hij de Live TV-gids over wat er ook draait (alleen als Live TV aan staat). Wis hem om LG’s gids terug te krijgen.","Refresh playlist and guide":"Afspeellijst en gids vernieuwen","Refreshing in the background":"Wordt op de achtergrond vernieuwd","Refreshing…":"Vernieuwen…","refused":"geweigerd","reloaded":"opnieuw geladen","Remove all uploads":"Alle uploads verwijderen","Remove CleanYourTV?":"CleanYourTV verwijderen?","Remove the playlist":"Afspeellijst verwijderen","Remove the playlist?":"Afspeellijst verwijderen?","Remove voice":"Spraak verwijderen","Removes the apps, the boot scripts and your settings, then restarts the TV so LG’s Home comes back.":"Verwijdert de apps, de opstartscripts en je instellingen en herstart dan de TV, zodat LG’s Home terugkomt.","Removing CleanYourTV… the TV restarts in a moment and LG’s Home comes back.":"CleanYourTV wordt verwijderd… de TV start zo opnieuw op en LG’s Home komt terug.","Reset Home customisation":"Aanpassingen van Home herstellen","Restarting the service":"Service herstarten","Restarts the TV; LG’s own Home is Home after it starts. You can switch back here.":"Herstart de TV; daarna is LG’s eigen Home de Home. Je kunt hier terugschakelen.","Restarts the TV; this launcher is Home after it starts.":"Herstart de TV; daarna is deze launcher Home.","Right column":"Rechterkolom","Running apps":"Geopende apps","Save":"Opslaan","Save albums and sync":"Albums opslaan en synchroniseren","Save JSON":"JSON opslaan","Saved":"Opgeslagen","Saved. Open Home on the TV to see it.":"Opgeslagen. Open Home op de tv om het te zien.","Saved. The TV is loading your channels now; you can close this page.":"Opgeslagen. De TV laadt nu je zenders; je kunt deze pagina sluiten.","Saved. You can close this page.":"Opgeslagen. Je kunt deze pagina sluiten.","Saving…":"Opslaan…","scan with a phone to copy the address and token":"scan met een telefoon om adres en token te kopiëren","Search":"Zoeken","Second line (where there is room)":"Tweede regel (waar er ruimte is)","Select all":"Alles selecteren","selected":"gekozen","Send the text to":"Tekst sturen naar","Send the text to your own server":"De tekst naar je eigen server sturen","Sends what you say as text to Home Assistant’s Assist and shows its answer. Needs the address and a long-lived access token (Home Assistant profile page), entered on your phone. Choosing this row tests the connection.":"Stuurt wat je zegt als tekst naar Assist van Home Assistant en toont het antwoord. Vraagt het adres en een langlevend toegangstoken (profielpagina van Home Assistant), ingevuld op je telefoon. Deze rij kiezen test de verbinding.","Server token":"Servertoken","Service":"Service","Service %s":"Service %s","set up":"ingesteld","Set up anyway":"Toch instellen","set up from your phone":"instellen met je telefoon","Set up from your phone":"Instellen met je telefoon","set the Home Assistant address too":"vul ook het adres van Home Assistant in","set up Home Assistant first":"stel eerst Home Assistant in","Set up Live TV":"Live TV instellen","Set up now":"Nu instellen","Set up with commands":"Instellen met commando’s","Setting up… %s":"Instellen… %s","Setting up… the screen blinks once while LG’s system restarts":"Instellen… het scherm knippert één keer terwijl LG’s systeem herstart","Settings":"Instellingen","settings and apps are deleted; the TV restarts":"instellingen en apps worden verwijderd; de TV start opnieuw op","Settings for Live TV: switch it on or off, set up or remove your playlist, refresh the guide and learn the Guide key.":"Instellingen voor Live TV: aan of uit, je afspeellijst instellen of verwijderen, de gids vernieuwen en de gidstoets leren.","Share log":"Log delen","Share the log":"Log delen","Show":"Tonen","Show as QR code":"Als QR-code tonen","Show Live TV":"Live TV tonen","Shows a QR code. A phone that scans it opens a page, served by the TV for ten minutes, that shows the notification address and the token with Copy buttons (for Home Assistant, for example). The token is a secret.":"Toont een QR-code. Een telefoon die hem scant, opent een pagina die de TV tien minuten aanbiedt, met het meldingsadres en het token en Kopiëren-knoppen (bijvoorbeeld voor Home Assistant). Het token is geheim.","Shows a QR code. On the phone page you upload photos (they are made the right size on the phone), delete uploads, connect Immich, choose albums and hide single photos.":"Toont een QR-code. Op de telefoonpagina upload je foto’s (die op de telefoon de juiste grootte krijgen), verwijder je uploads, verbind je Immich, kies je albums en verberg je losse foto’s.","Shows a QR code. Scan it with a phone on the same Wi-Fi to copy a report for a bug report. Addresses and URL paths are masked; the page closes after ten minutes.":"Toont een QR-code. Scan hem met een telefoon op hetzelfde wifi-netwerk om een rapport voor een foutmelding te kopiëren. Adressen en URL-paden zijn verborgen; de pagina sluit na tien minuten.","Shows a QR code. Scan it with a phone on the same Wi-Fi to enter your OpenRouter key, choose a model, write instructions and set a server address. Nothing is typed on the TV.":"Toont een QR-code. Scan hem met een telefoon op hetzelfde wifi-netwerk om je OpenRouter-sleutel in te vullen, een model te kiezen, instructies te schrijven en een serveradres in te stellen. Er wordt niets op de TV getypt.","Shows the address, the token and an example request.":"Toont het adres, het token en een voorbeeldverzoek.","Shows the commands to set the key, model and instructions from a shell, and how to ask by text.":"Toont de commando’s om sleutel, model en instructies vanuit een shell in te stellen, en hoe je met tekst iets vraagt.","Size":"Grootte","Skip":"Overslaan","Small":"Klein","small widgets on Home":"kleine widgets op Home","Speak now…":"Spreek nu…","speak when the card appears":"spreek als de kaart verschijnt","Stable releases":"Stabiele releases","Stable releases are what most people want: at most one a day, made from the dev builds. Dev builds come with every change and can be less finished; choose Dev here, then use the Launcher and Service rows to install it. Going back to Stable offers the latest release again.":"Stabiele releases zijn wat de meeste mensen willen: hooguit één per dag, gemaakt van de dev-builds. Dev-builds komen met elke wijziging en kunnen minder af zijn; kies hier Dev en installeer met de rijen Launcher en Service. Terug naar Stabiel biedt weer de nieuwste release aan.","Start":"Start","Starting":"Starten","Starts listening without the button: speak when the card appears.":"Start het luisteren zonder de knop: spreek als de kaart verschijnt.","Stops contentminer and nudge (recommendations and pop-up tips) and keeps sportsalarm from starting.":"Stopt contentminer en nudge (aanbevelingen en pop-uptips) en houdt sportsalarm tegen bij het starten.","Stops LG’s ad, recommendation and telemetry services and blocks a few ad servers. Nothing is uninstalled, and it only applies while this launcher is Home.":"Stopt de advertentie-, aanbevelings- en telemetriediensten van LG en blokkeert een paar advertentieservers. Er wordt niets verwijderd, en het geldt alleen zolang deze launcher Home is.","Stops LG’s ad, tracking, telemetry and suggestion services, in four groups you can switch separately. Nothing is uninstalled, and it only applies while this launcher is Home.":"Stopt de advertentie-, volg-, telemetrie- en suggestiediensten van LG, in vier groepen die je los kunt schakelen. Er wordt niets verwijderd, en het geldt alleen zolang deze launcher Home is.","Stops remotelogger and service-logger, which collect logs and send them to LG.":"Stopt remotelogger en service-logger, die logs verzamelen en naar LG sturen.","Stream":"Stream","streams":"streams","Suggestions and nudges":"Suggesties en duwtjes","Swaps the previous launcher version back in. The newer one stays available as an update.":"Zet de vorige launcherversie terug. De nieuwere blijft beschikbaar als update.","Switch all off":"Alles uitzetten","Switch all on":"Alles aanzetten","Switch Home?":"Home wisselen?","Switch notifications on first":"Zet eerst meldingen aan","Switch off LG’s voice assistant":"LG’s spraakassistent uitzetten","Switches every group on.":"Zet elke groep aan.","Switches the debloat off: the services start again and the hosts lines are removed.":"Zet de debloat uit: de diensten starten weer en de hosts-regels worden verwijderd.","switching restarts the TV":"overschakelen herstart de TV","Switching to CleanYourTV… the TV restarts in a moment.":"Overschakelen naar CleanYourTV… de TV start zo opnieuw op.","Switching to LG’s Home… the TV restarts in a moment.":"Overschakelen naar LG’s Home… de TV start zo opnieuw op.","Switching…":"Overschakelen…","Sync now":"Nu synchroniseren","synced %s":"gesynchroniseerd %s","Synced photos":"Gesynchroniseerde foto’s","Syncing with Immich…":"Synchroniseren met Immich…","syncing…":"synchroniseren…","Syncing…":"Synchroniseren…", on on your remote. It then opens the Live TV channel guide instead of LG’s guide. Clear it to get LG’s guide back.":"De gidstoets.\nKies Start en druk dan op de Guide-knop van je afstandsbediening. Die opent daarna de Live TV-gids in plaats van LG’s gids. Wis hem om LG’s gids terug te krijgen.","The Home key (optional).\nChoose Start, then press the Home button on your remote.":"De Home-toets (optioneel).\nKies Start en druk dan op de Home-knop van je afstandsbediening.","The home screen you see. Updates come from GitHub releases and are checked against a SHA-256 file before they are installed. If a new launcher does not start, the previous one is put back.":"Het startscherm dat je ziet. Updates komen van GitHub-releases en worden gecontroleerd met een SHA-256-bestand voor ze worden geïnstalleerd. Start een nieuwe launcher niet, dan komt de vorige terug.","The hook did not attach on this firmware, so keys cannot be learned. The Input key stays with LG’s picker.\nUse Share log to report this.":"De hook koppelde niet op deze firmware, dus toetsen kunnen niet geleerd worden. De ingangtoets blijft bij LG’s kiezer.\nMeld dit via Log delen.","The Input key.\nChoose Start, then press the Input button on your remote.":"De ingangtoets.\nKies Start en druk dan op de Input-knop van je afstandsbediening.","The Inputs list did not open.\nIf LG’s own picker showed, the Input key is not mapped: learn it again or switch the Input key off.":"De ingangenlijst opende niet.\nAls LG’s eigen kiezer verscheen, is de ingangtoets niet gekoppeld: leer hem opnieuw of zet de ingangtoets uit.","The Inputs list opened: the Input key works.":"De ingangenlijst opende: de ingangtoets werkt.","the install did not finish":"de installatie is niet afgerond","the key is forgotten and its photos are deleted from the TV":"de sleutel wordt vergeten en de foto’s worden van de TV verwijderd","The language of CleanYourTV’s screens: the launcher, this app and the Inputs list. Automatic follows the TV’s menu language. The percentage says how much of a language is translated; the rest stays English. Translations are files in the repository that anyone can add to.":"De taal van de schermen van CleanYourTV: de launcher, deze app en de ingangenlijst. Automatisch volgt de menutaal van de TV. Het percentage zegt hoeveel van een taal vertaald is; de rest blijft Engels. Vertalingen zijn bestanden in de repository waar iedereen aan kan bijdragen.","the launcher’s Inputs list":"de ingangenlijst van de launcher","The launcher’s own settings go back to the defaults. Apps, the theme and everything in this app stay.":"De eigen instellingen van de launcher gaan terug naar de standaard. Apps, het thema en alles in deze app blijven.","The new launcher did not start; rolling back":"De nieuwe launcher startte niet; terugzetten","the new launcher did not start; the previous version is back":"de nieuwe launcher startte niet; de vorige versie is terug","The notification listener is not running.":"De meldingenluisteraar draait niet.","the old one stops working":"het oude werkt niet meer","The page has closed. Close this and try again.":"De pagina is gesloten. Sluit dit en probeer het opnieuw.","The page is open for ten minutes. It lists versions, the setup log and the service log; addresses and URL paths are masked.":"De pagina is tien minuten open. Hij toont versies, het installatielog en het servicelog; adressen en URL-paden zijn verborgen.","The page opens for ten minutes. It is not encrypted: the token travels over your Wi-Fi, so use a network you trust.":"De pagina is tien minuten open. Hij is niet versleuteld: het token gaat over je wifi, dus gebruik een netwerk dat je vertrouwt.","The page stays open for ten minutes, or until you save. It is not encrypted: the key travels over your Wi-Fi, so use a network you trust.":"De pagina blijft tien minuten open, of tot je opslaat. Hij is niet versleuteld: de sleutel gaat over je wifi, dus gebruik een netwerk dat je vertrouwt.","The page stays open for ten minutes. It is not encrypted: the playlist address, which may hold an access key, travels over your Wi-Fi.":"De pagina blijft tien minuten open. Hij is niet versleuteld: het adres van de afspeellijst, waarin een toegangssleutel kan zitten, gaat over je wifi.","The page stays open while you use it, at most an hour. It is not encrypted: what you type travels over your Wi-Fi.":"De pagina blijft open zolang je hem gebruikt, hooguit een uur. Hij is niet versleuteld: wat je typt gaat over je wifi.","The page stays open while you use it, at most an hour. It is not encrypted: your photos and the Immich key travel over your Wi-Fi.":"De pagina blijft open zolang je hem gebruikt, hooguit een uur. Hij is niet versleuteld: je foto’s en de Immich-sleutel gaan over je wifi.","the phone page could not start: %s":"de telefoonpagina kon niet starten: %s","the picture is larger than 12 MB":"de afbeelding is groter dan 12 MB","The playlist address must start with http:// or https://":"Het adres van de afspeellijst moet beginnen met http:// of https://","The remote’s Input button opens our Inputs list instead of LG’s picker. You can change this later.":"De Input-knop van de afstandsbediening opent onze ingangenlijst in plaats van LG’s kiezer. Je kunt dit later wijzigen.","The remote’s Input button opens our Inputs list over the running app instead of LG’s picker. Open this screen to switch it off or to learn the button.":"De Input-knop van de afstandsbediening opent onze ingangenlijst over de lopende app in plaats van LG’s kiezer. Open dit scherm om het uit te zetten of de knop te leren.","the screen blinks once":"het scherm knippert één keer","The service did not answer":"De service antwoordde niet","The service did not answer.":"De service antwoordde niet.","The service is not running. Set it up to replace LG’s Home, take over the Input key and keep everything up to date.":"De service draait niet. Stel hem in om LG’s Home te vervangen, de ingangtoets over te nemen en alles b a się na ekranie. Wymaga klucza OpenRouter; wysyłany jest tekst, nigdy dźwięk.","one is saved, leave empty to keep it":"jeden jest zapisany, pozostaw puste, aby zachować","Open":"Otwórz","OpenRouter key":"Klucz OpenRouter","optional":"opcjonalnie","Optional. Records the Home button’s code. The Home key keeps working exactly as before.":"Opcjonalnie. Rejestruje kod przycisku Home. Przycisk Home działa dokładnie tak jak dotychczas.","Optional. Speak into the remote and the TV turns it into text on the TV itself (Moonshine, English). The text can be sent to a server you run. Audio never leaves the TV. Needs a download of about 80 MB.":"Opcjonalnie. Mów do pilota, a telewizor przekształci mowę w tekst bezpośrednio na urządzeniu (Moonshine, angielski). Tekst można przesłać na Twój serwer. Dźwięk nigdy nie opuszcza telewizora. Wymaga pobrania ok. 80 MB.","over the running app, ready in the background (instant)":"nad uruchomioną aplikacją, gotowe w tle (natychmiastowe)","over the running app, started when pressed":"nad uruchomioną aplikacją, uruchamiane po naciśnięciu","Photo %d of %d · preparing":"Zdjęcie %d z %d · przygotowywanie","Photo %d of %d · sending":"Zdjęcie %d z %d · wysyłanie","Photos from the Immich albums you chose, downloaded to the TV every six hours (and with Sync now), so Home never waits for Immich. At most 300.":"Zdjęcia z wybranych albumów Immich, pobierane na telewizor co sześć godzin (oraz przez Synchronizuj teraz), dzięki czemu Home nie czeka na Immich. Maksymalnie 300.","Photos uploaded from a phone, kept on the TV. At most 100.":"Zdjęcia przesłane z telefonu, zapisane w telewizorze. Maksymalnie 100.","Picture size":"Rozmiar obrazu","Place":"Miejsce","Playlist":"Playlista","Playlist address (M3U)":"Adres playlisty (M3U)","Playlist removed":"Playlista usunięta","Playlist saved":"Playlista zapisana","Preparing the report…":"Przygotowywanie raportu…","Preparing…":"Przygotowywanie…","Press and hold the text, then choose Copy":"Naciśnij i przytrzymaj te enia, a następnie restartuje telewizor, przywracając Home LG.","Removing CleanYourTV… the TV restarts in a moment and LG’s Home comes back.":"Usuwanie CleanYourTV… za chwilę nastąpi restart i powróci Home LG.","Reset Home customisation":"Zresetuj personalizację Home","Restarting the service":"Restartowanie usługi","Restarts the TV; LG’s own Home is Home after it starts. You can switch back here.":"Restartuje telewizor; po uruchomieniu aktywny będzie Home LG. Możesz wrócić tutaj.","Restarts the TV; this launcher is Home after it starts.":"Restartuje telewizor; po uruchomieniu ten launcher będzie ekranem głównym.","Right column":"Prawa kolumna","Running apps":"Uruchomione aplikacje","Save":"Zapisz","Save albums and sync":"Zapisz albumy i synchronizuj","Save JSON":"Zapisz JSON","Saved":"Zapisano","Saved. Open Home on the TV to see it.":"Zapisano. Otwórz Home na telewizorze, aby zobaczyć.","Saved. The TV is loading your channels now; you can close this page.":"Zapisano. Telewizor ładuje teraz kanały; możesz zamknąć tę stronę.","Saved. You can close this page.":"Zapisano. Możesz zamknąć tę stronę.","Saving…":"Zapisywanie…","scan with a phone to copy the address and token":"zeskanuj telefonem, aby skopiować adres i token","Search":"Szukaj","Second line (where there is room)":"Druga linia (tam, gdzie jest miejsce)","Select all":"Zaznacz wszystko","selected":"wybrano","Send the text to":"Wyślij tekst do","Send the text to your own server":"Wyślij tekst do własnego serwera","Sends what you say as text to Home Assistant’s Assist and shows its answer. Needs the address and a long-lived access token (Home Assistant profile page), entered on your phone. Choosing this row tests the connection.":"Wysyła to, co powiesz, jako tekst do asystenta Assist w Home Assistancie i pokazuje odpowiedź. Wymaga adresu i długoterminowego tokena dostępu (z profilu Home Assistanta), wprowadzonych na telefonie. Wybór tego wiersza testuje połączenie.","Server token":"Token serwera","Service":"Usługa","Service %s":"Usługa %s","set up":"skonfigurowano","Set up anyway":"Skonfiguruj mimo to","set up from your phone":"skonfiguruj z telefonu","Set up from your phone":"Skonfiguruj z telefonu","set the Home Assistant address too":"ustaw również adres Home Assistanta","set up Home Assistant first":"najpierw skonfiguruj Home Assistanta","Set up Live TV":"Skonfiguruj telewizję na żywo","Set up now":"Skonfiguruj teraz","Set up with commands":"Skonfiguruj za pomocą poleceń","Setting up… %s":"Konfigurowanie… %s","Setting up… the screen blinks once while LG’s system restarts":"Konfigurowanie… ekran mignie raz podczas restartu systemu LG","Settings":"Ustawienia","settings and apps are deleted; the TV restarts":"ustawienia i aplikacje zostaną usunięte; nastąpi restart telewizora","Settings for Live TV: switch it on or off, set up or remove your playlist, refresh the guide and learn the Guide key.":"Ustawienia telewizji na żywo: włączanie/wyłączanie, konfiguracja lub usuwanie playlisty, odświeżanie przewodnika i przypisywanie klawisza Guide.","Share log":"Udostępnij dziennik","Share the log":"Udostępnij dziennik","Show":"Pokaż","Show as QR code":"Pokaż jako kod QR","Show Live TV":"Pokaż telewizję na żywo","Shows a QR code. A phone that scans it opens a page, served by the TV for ten minutes, that shows the notification address and the token with Copy buttons (for Home Assistant, for example). The token is a secret.":"Wyświetla kod QR. Zeskanowanie go telefonem otwiera stronę udostępnianą przez telewizor przez dziesięć minut, która zawiera adres powiadomień i token z przyciskami Kopiuj (np. dla Home Assistanta). Token jest poufny.","Shows a QR code. On the phone page you upload photos (they are made the right size on the phone), delete uploads, connect Immich, choose albums and hide single photos.":"Wyświetla kod QR. Na stronie w telefonie możesz przesyłać zdjęcia (są skalowane na telefonie), usuwać przesłane, łączyć z Immich, wybierać albumy i ukrywać pojedyncze zdjęcia.","Shows a QR code. Scan it with a phone on the same Wi-Fi to copy a report for a bug report. Addresses and URL paths are masked; the page closes after ten minutes.":"Wyświetla kod QR. Zeskanuj go telefonem w tej samej sieci Wi-Fi, aby skopiować raport do zgłoszenia błędu. Adresy i ścieżki URL są maskowane; strona zamyka się po dziesięciu minutach.","Shows a QR code. Scan it with a phone on the same Wi-Fi to enter your OpenRouter key, choose a model, write instructions and set a server address. Nothing is typed on the TV.":"Wyświetla kod QR. Zeskanuj go telefonem w tej samej sieci Wi-Fi, aby wprowadzić klucz OpenRouter, wybrać model, wpisać instrukcje i ustawić adres serwera. Nic nie trzeba wpisywać na telewizorze.","Shows the address, the token and an example request.":"Pokazuje adres, token oraz przykładowe zapytanie.","Shows the commands to set the key, model and instructions from a shell, and how to ask by text.":"Pokazuje polecenia do ustawienia klucza, modelu i instrukcji z poziomu powłoki oraz sposób zadawania pytań tekstowych.","Size":"Rozmiar","Skip":"Pomiń","Small":"Mały","small widgets on Home":"małe widżety na ekranie głównym","Speak now…":"Mów teraz…","speak when the card appears":"mów, gdy pojawi się karta","Stable releases":"Wydania stabilne","Stable releases are what most people want: at most one a day, made from the dev builds. Dev builds come with every change and can be less finished; choose Dev here, then use the Launcher and Service rows to install it. Going back to Stable offers the latest release again.":"Wydania stabilne to opcja polecana dla większości użytkowników: co najwyżej jedno dziennie, tworzone z wersji deweloperskich. Wersje dev pojawiają się przy każdej zmianie i mogą być mniej dopracowane; wybierz Dev tutaj, a następnie użyj wierszy Launcher i Usługa, aby je zainstalować. Powrót do Stable ponownie oferuje najnowsze stabilne wydanie.","Start":"Start","Starting":"Uruchamianie","Starts listening without the button: speak when the card appears.":"Rozpoczyna nasłuchiwanie bez przycisku: zacznij mówić, gdy pojawi się karta.","Stops contentminer and nudge (recommendations and pop-up tips) and keeps sportsalarm from starting.":"Zatrzymuje contentminer oraz nudge (rekomendacje i podpowiedzi) oraz blokuje uruchamianie sportsalarm.","Stops LG’s ad, recommendation and telemetry services and blocks a few ad servers. Nothing is uninstalled, and it only applies while this launcher is Home.":"Zatrzymuje usługi reklamowe, rekomendacje i telemetrię LG oraz blokuje wybrane serwery reklamowe. Nic nie jest odinstalowywane i działa to tylko wtedy, gdy ten launcher jest ekranem głównym.","Stops LG’s ad, tracking, telemetry and suggestion services, in four groups you can switch separately. Nothing is uninstalled, and it only applies while this launcher is Home.":"Zatrzymuje usługi reklam, śledzenia, telemetrii i podpowiedzi LG w czterech grupach przełączanych osobno. Nic nie jest odinstalowywane i działa tylko wtedy, gdy ten launcher jest ekranem głównym.","Stops remotelogger and service-logger, which collect logs and send them to LG.":"Zatrzymuje remotelogger i service-logger, które zbierają logi i wysyłają je do LG.","Stream":"Strumień","streams":"strumienie","Suggestions and nudges":"Podpowiedzi i rekomendacje","Swaps the previous launcher version back in. The newer one stays available as an update.":"Przywraca poprzednią wersję launchera. Nowsza pozostaje dostępna jako aktualizacja.","Switch all off":"Wyłącz wszystkie","Switch all on":"Włącz wszystkie","Switch Home?":"Przełączyć ekran główny?","Switch notifications on first":"Najpierw włącz powiadomienia","Switch off LG’s voice assistant":"Wyłącz asystenta głosowego LG","Switches every group on.":"Włącza każdą grupę.","Switches the debloat off: the services start again and the hosts lines are removed.":"Wyłącza debloat: usługi zostają ponownie uruchomione, a wpisy w pliku hosts usunięte.","switching restarts the TV":"przełączenie restartuje telewizor","Switching to CleanYourTV… the TV restarts in a moment.":"Przełączanie na CleanYourTV… telewizor uruchomi się ponownie za chwilę.","Switching to LG’s Home… the TV restarts in a moment.":"Przełączanie na Home LG… telewizor uruchomi się ponownie za chwilę.","Switching…":"Przełączanie…","Sync now":"Synchronizuj teraz","synced %s":"zsynchronizowano %s","Synced photos":"Zsynchronizowane zdjęcia","Syncing with Immich…":"Synchronizacja z Immich…","syncing…":"synchronizowanie…","Syncing…":"Synchronizowanie…","syncing… %d new":"synchronizowanie… %d nowych","Syncing… %d new":"Synchronizowanie… %d nowych","Take over the Input key":"Przejmij klawisz Input","Tap Copy, then paste it into your message. Addresses and URL paths are masked. This page closes ten minutes after it was opened on the TV.":"Dotknij Kopiuj, a następnie wklej do wiadomości. Adresy i ścieżki URL są zamaskowane. Ta strona zamyka się po dziesięciu minutach od otwarcia na telewizorze.","tap to hide or show one":"dotknij, aby ukryć lub pokazać","Telemetry logs":"Dzienniki telemetrii","Temperature":"Temperatura","Test connection and save":"Przetestuj połączenie i zapisz","Test the connection":"Przetestuj połączenie","Test.\nPress the Input button once more. Our Inputs list should open over this screen.":"Test.\nNaciśnij przycisk Input jeszcze raz. Nasza lista wejść powinna otworzyć się nad tym ekranem.","Testing":"Testowanie","Text":"Tekst","the address and the token are removed from the TV":"adres i token zostaną usunięte z telewizora","the address must start with http:// or https://":"adres musi zaczynać się od http:// lub https://","the address, the channel list, the guide and your favourites are deleted":"adres, lista kanałów, przewodnik i ulubione zostaną usunięte","The AI and Home Assistant remember the last turns for ten minutes. This clears them.":"AI i Home Assistant pamiętają ostatnie wypowiedzi przez dziesięć minut. To polecenie je czyści.","The AI only":"Tylko AI","The background service behind the launcher: Live TV, picture notifications, the Input key, these updates. A failed update restores the previous files.":"Usługa w tle stojąca za launcherem: Telewizja na żywo, powiadomienia ze zdjęciami, klawisz Input, aktualizacje. Nieudana aktualizacja przywraca poprzednie pliki.","the chosen albums have no photos the TV can show":"wybrane albumy nie zawierają zdjęć, które telewizor może wyświetlić","The colour of the focus ring and highlights":"Kolor ramki zaznaczenia i wyróżnień","The date":"Data","The Guide key.\nChoose Start, then press the Guide button on your remote. It then opens the Live TV channel guide instead of LG’s guide. Clear it to get LG’s guide back.":"Klawisz Guide.\nWybierz Start, a następnie naciśnij przycisk Guide na pilocie. Będzie on otwierał przewodnik kanałów telewizji na żywo zamiast przewodnika LG. Wyczyść, aby przywrócić przewodnik LG.","The Home key (optional).\nChoose Start, then press the Home button on your remote.":"Klawisz Home (opcjonalnie).\nWybierz Start, a następnie naciśnij przycisk Home na pilocie.","The home screen you see. Updates come from GitHub releases and are checked against a SHA-256 file before they are installed. If a new launcher does not start, the previous one is put back.":"Ekran główny, który widzisz. Aktualizacje pochodzą z wydań GitHub i są sprawdzane z plikiem SHA-256 przed instalacją. Jeśli nowy launcher się nie uruchomi, przywracany jest poprzedni.","The hook did not attach on this firmware, so keys cannot be learned. The Input key stays with LG’s picker.\nUse Share log to report this.":"Hook nie mógł podpiąć się w tej wersji oprogramowania, więc nie można przypisać klawiszy. Klawisz Input pozostaje przy menu LG.\nUżyj Udostępnij dziennik, aby to zgłosić.","The Input key.\nChoose Start, then press the Input button on your remote.":"Klawisz Input.\nWybierz Start, a następnie naciśnij przycisk Input na pilocie.","The Inputs list did not open.\nIf LG’s own picker showed, the Input key is not mapped: learn it again or switch the Input key off.":"Lista wejść nie otworzyła się.\nJeśli pojawiło się menu LG, klawisz Input nie jest zmapowany: przypisz go ponownie lub wyłącz klawisz Input.","The Inputs list opened: the Input key works.":"Lista wejść otworzyła się: klawisz Input działa.","the install did not finish":"instalacja nie została ukończona","the key is forgotten and its photos are deleted from the TV":"klucz został usunięty, a jego zdjęcia skasowane z telewizora","The language of CleanYourTV’s screens: the launcher, this app and the Inputs list. Automatic follows the TV’s menu language. The percentage says how much of a language is translated; the rest stays English. Translations are files in the repository that anyone can add to.":"Język ekranów CleanYourTV: launchera, tej aplikacji i listy wejść. Automatycznie podąża za językiem menu telewizora. Wartość procentowa oznacza stopień przetłumaczenia; reszta pozostaje po angielsku. Tłumaczenia to pliki w repozytorium, które każdy może rozbudować.","the launcher’s Inputs list":"lista wejść launchera","The launcher’s own settings go back to the defaults. Apps, the theme and everything in this app stay.":"Ustawienia samego launchera wracają do wartości domyślnych. Aplikacje, motyw i wszystkie ustawienia w tej aplikacji pozostają bez zmian.","The new launcher did not start; rolling back":"Nowy launcher nie uruchomił się; wycofywanie zmian","the new launcher did not start; the previous version is back":"nowy launcher nie uruchomił się; powrócono do poprzedniej wersji","The notification listener is not running.":"Nasłuch powiadomień nie jest uruchomiony.","the old one stops working":"stary przestaje działać","The page has closed. Close this and try again.":"Strona została zamknięta. Zamknij to i spróbuj ponownie.","The page is open for ten minutes. It lists versions, the setup log and the service log; addresses and URL paths are masked.":"Strona jest aktywna przez dziesięć minut. Zawiera wersje, dziennik konfiguracji i usługi; adresy i ścieżki URL są zamaskowane.","The page opens for ten minutes. It is not encrypted: the token travels over your Wi-Fi, so use a network you trust.":"Strona otwiera się na dziesięć minut. Nie jest szyfrowana: token jest przesyłany przez Wi-Fi, więc korzystaj z zaufanej sieci.","The page stays open for ten minutes, or until you save. It is not encrypted: the key travels over your Wi-Fi, so use a network you trust.":"Strona pozostaje otwarta przez dziesięć minut lub do momentu zapisania. Nie jest szyfrowana: klucz jest przesyłany przez Wi-Fi, korzystaj z zaufanej sieci.","The page stays open for ten minutes. It is not encrypted: the playlist address, which may hold an access key, travels over your Wi-Fi.":"Strona otwiera się na dziesięć minut. Nie jest szyfrowana: adres playlisty, który może zawierać klucz dostępu, jest przesyłany przez Wi-Fi.","The page stays open while you use it, at most an hour. It is not encrypted: what you type travels over your Wi-Fi.":"Strona pozostaje otwarta w czasie używania, maksymalnie godzinę. Nie jest szyfrowana: wprowadzane dane są przesyłane przez Wi-Fi.","The page stays open while you use it, at most an hour. It is not encrypted: your photos and the Immich key travel over your Wi-Fi.":"Strona pozostaje otwarta w czasie używania, maksymalnie godzinę. Nie jest szyfrowana: zdjęcia i klucz Immich są przesyłane przez Wi-Fi.","the phone page could not start: %s":"nie udało się uruchomić strony na telefonie: %s","the picture is larger than 12 MB":"obraz jest większy niż 12 MB","The playlist address must start with http:// or https://":"Adres playlisty musi zaczynać się od http:// lub https://","The remote’s Input button opens our Inputs list instead of LG’s picker. You can change this later.":"Przycisk Input na pilocie otwiera naszą listę wejść zamiast menu wyboru LG. Możesz to później zmienić.","The remote’s Input button opens our Inputs list over the running app instead of LG’s picker. Open this screen to switch it off or to learn the button.":"Przyci  pressed.":"Nada foi pressionado.","Notification address and token":"Endereço de notificação e token","Now":"Agora","Now and the next days":"Agora e nos próximos dias","now: %s":"agora: %s","Off":"Desativado","On":"Ativado","On: pressing Input shows our Inputs list. Off: LG’s picker comes back at once.":"Ativado: pressionar Input exibe nossa lista de Entradas. Desativado: o seletor da LG volta imediatamente.","On: pressing the button you learned starts listening. A card shows what was heard.":"Ativado: pressionar o botão aprendido inicia a escuta. Um cartão exibe o que foi ouvido.","On: the Home button opens this launcher. Off: LG’s own Home. Switching restarts the TV (about a minute); the service keeps running either way.":"Ativado: o botão Home abre este inicializador. Desativado: Início padrão da LG. A alternância reinicia a TV (cerca de um minuto); o serviço continua rodando em ambos os casos.","On: the launcher has a Live TV button and tile, the Inputs list has Live TV, and the Guide key can open the channel guide. Off: all of that is hidden and LG’s own player and guide are used. Your playlist is kept.":"Ativado: o inicializador exibe botão e bloco de TV ao vivo, a lista de Entradas inclui TV ao vivo e a tecla Guide abre o guia de canais. Desativado: tudo isso fica oculto e o reprodutor e guia da LG são usados. Sua lista é mantida.","On: the TV listens on port 8767 for POST /notify with the token. Anyone who has the token and network access can show cards on this screen.":"Ativado: a TV escuta na porta 8767 para POST /notify com o token. Qualquer pessoa com o token e acesso à rede pode exibir cartões nesta tela.","On: what you say is also sent as text to a language model through OpenRouter and the answer is shown on screen. Needs your OpenRouter key; the text goes to OpenRouter and the model provider, never audio.":"Ativado: o que você fala também é enviado como texto a um modelo de linguagem via OpenRouter e a resposta aparece na tela. Requer sua chave do OpenRouter; o texto vai para o OpenRouter e provedor do modelo, nunca o áudio.","one is saved, leave empty to keep it":"um já está salvo, deixe em branco para mantê-lo","Open":"Abrir","OpenRouter key":"Chave do OpenRouter","optional":"opcional","Optional. Records the Home button’s code. The Home key keeps working exactly as before.":"Opcional. Grava o código do botão Home. A tecla Home continua funcionando exatamente como antes.","Optional. Speak into the remote and the TV turns it into text on the TV itself (Moonshine, English). The text can be sent to a server you run. Audio never leaves the TV. Needs a download of about 80 MB.":"Opcional. Fale no controle remoto e a TV converte em texto localmente (Moonshine, inglês). O texto pode ser enviado a um servidor próprio. O áudio nunca sai da TV. Requer download de cerca de 80 MB.","over the running app, ready in the background (instant)":"sobre o app em execução, pronto em segundo plano (instantâneo)","over the running app, started when pressed":"sobre o app em execução, iniciado ao pressionar","Photo %d of %d · preparing":"Foto %d de %d · preparando","Photo %d of %d · sending":"Foto %d de %d · enviando","Photos from the Immich albums you chose, downloaded to the TV every six hours (and with Sync now), so Home never waits for Immich. At most 300.":"Fotos dos álbuns do Immich selecionados, baixadas para a TV a cada seis horas (e com Sincronizar agora), para que o Início nunca espere pelo Immich. No máximo 300.","Photos uploaded from a phone, kept on the TV. At most 100.":"Fotos enviadas pelo celular, mantidas na TV. No máximo 100.","Picture size":"Tamanho da imagem","Place":"Local","Playlist":"Lista de reprodução","Playlist address (M3U)":"Endereço da lista (M3U)","Playlist removed":"Lista de reprodução removida","Playlist saved":"Lista de reprodução salva","Preparing the report…":"Preparando o relatório…","Preparing…":"Preparando…","Press and hold the text, then choose Copy":"Pressione e segure o texto e depois escolha Co hs are masked; the page closes after ten minutes.":"Exibe um código QR. Escaneie-o com um celular no mesmo Wi-Fi para copiar um relatório de erros. Endereços e caminhos de URL são mascarados; a página fecha após dez minutos.","Shows a QR code. Scan it with a phone on the same Wi-Fi to enter your OpenRouter key, choose a model, write instructions and set a server address. Nothing is typed on the TV.":"Exibe um código QR. Escaneie-o com um celular no mesmo Wi-Fi para inserir sua chave do OpenRouter, escolher um modelo, escrever instruções e definir o endereço do servidor. Nada é digitado na TV.","Shows the address, the token and an example request.":"Mostra o endereço, o token e um exemplo de requisição.","Shows the commands to set the key, model and instructions from a shell, and how to ask by text.":"Mostra os comandos para definir a chave, modelo e instruções via terminal, e como perguntar por texto.","Size":"Tamanho","Skip":"Pular","Small":"Pequeno","Speak now…":"Fale agora…","speak when the card appears":"fale quando o cartão aparecer","Stable releases":"Versões estáveis","Stable releases are what most people want: at most one a day, made from the dev builds. Dev builds come with every change and can be less finished; choose Dev here, then use the Launcher and Service rows to install it. Going back to Stable offers the latest release again.":"Versões estáveis são as recomendadas para a maioria dos usuários: no máximo uma por dia, gerada a partir das versões de desenvolvimento. Versões dev acompanham cada alteração e podem ser menos polidas; escolha Dev aqui e depois use as linhas Inicializador e Serviço para instalar. Voltar para Estável oferece a versão mais recente novamente.","Start":"Iniciar","Starting":"Iniciando","Starts listening without the button: speak when the card appears.":"Inicia a escuta sem o botão: fale quando o cartão aparecer.","Stops contentminer and nudge (recommendations and pop-up tips) and keeps sportsalarm from starting.":"Interrompe contentminer e nudge (recomendações e dicas em pop-up) e impede sportsalarm de iniciar.","Stops LG’s ad, recommendation and telemetry services and blocks a few ad servers. Nothing is uninstalled, and it only applies while this launcher is Home.":"Interrompe serviços de anúncios, recomendações e telemetria da LG e bloqueia alguns servidores de anúncios. Nada é desinstalado e aplica-se apenas enquanto este inicializador for o Início.","Stops LG’s ad, tracking, telemetry and suggestion services, in four groups you can switch separately. Nothing is uninstalled, and it only applies while this launcher is Home.":"Interrompe serviços de anúncios, rastreamento, telemetria e sugestões da LG, em quatro grupos que você pode alternar separadamente. Nada é desinstalado e aplica-se apenas enquanto este inicializador for o Início.","Stops remotelogger and service-logger, which collect logs and send them to LG.":"Interrompe remotelogger e service-logger, que coletam logs e os enviam para a LG.","Stream":"Transmissão","streams":"transmissões","Suggestions and nudges":"Sugestões e avisos","Swaps the previous launcher version back in. The newer one stays available as an update.":"Restaura a versão anterior do inicializador. A versão mais nova permanece disponível como atualização.","Switch all off":"Desativar todos","Switch all on":"Ativar todos","Switch Home?":"Alternar Início?","Switch notifications on first":"Ative as notificações primeiro","Switch off LG’s voice assistant":"Desativar o assistente de voz da LG","Switches every group on.":"Ativa todos os grupos.","Switches the debloat off: the services start again and the hosts lines are removed.":"Desativa o debloat: os serviços reiniciam e as entradas no hosts são removidas.","switching restarts the TV":"a alternância reinicia a TV","Switching to CleanYourTV… the TV restarts in a moment.":"Alternando para o CleanYourTV… a TV reiniciará em instantes.","Switching to LG’s Home… the TV restarts in a moment.":"Alternando para o Início da L  instalação não foi concluída","the key is forgotten and its photos are deleted from the TV":"a chave é esquecida e suas fotos são excluídas da TV","The language of CleanYourTV’s screens: the launcher, this app and the Inputs list. Automatic follows the TV’s menu language. The percentage says how much of a language is translated; the rest stays English. Translations are files in the repository that anyone can add to.":"O idioma das telas do CleanYourTV: o inicializador, este app e a lista de Entradas. Automático segue o idioma dos menus da TV. A porcentagem indica quanto do idioma está traduzido; o restante permanece em inglês. As traduções são arquivos no repositório aos quais qualquer pessoa pode contribuir.","the launcher’s Inputs list":"a lista de Entradas do inicializador","The launcher’s own settings go back to the defaults. Apps, the theme and everything in this app stay.":"As configurações do próprio inicializador voltam aos padrões. Apps, o tema e tudo neste app permanecem.","The new launcher did not start; rolling back":"O novo inicializador não iniciou; revertendo","the new launcher did not start; the previous version is back":"o novo inicializador não iniciou; a versão anterior está de volta","The notification listener is not running.":"O ouvinte de notificações não está em execução.","the old one stops working":"o antigo para de funcionar","The page has closed. Close this and try again.":"A página foi fechada. Feche isto e tente novamente.","The page is open for ten minutes. It lists versions, the setup log and the service log; addresses and URL paths are masked.":"A página fica aberta por dez minutos. Ela lista versões, o log de configuração e o log do serviço; endereços e caminhos de URL são mascarados.","The page opens for ten minutes. It is not encrypted: the token travels over your Wi-Fi, so use a network you trust.":"A página abre por dez minutos. Ela não é criptografada: o token trafega pelo seu Wi-Fi, portanto use uma rede confiável.","The page
