 a JPEG, PNG or WebP picture":"не JPEG, PNG или WebP","not a picture the TV can show":"это изображение телевизор показать не может","not available":"недоступно","not available on this firmware":"недоступно на этой прошивке","not connected":"не подключено","Not connected.":"Не подключено.","Not found":"Не найдено","not installed":"не установлено","not learned":"не запомнено","not paused yet":"ещё не приостановлен","not set":"не задано","not set · More > Home Assistant":"не настроен · Ещё > Home Assistant","not set · shows a card only":"не задано · показывается только карточка","not set up":"не настроен","Nothing changes.":"Ничего не меняется.","nothing to remove":"удалять нечего","Nothing was pressed.":"Ничего не нажато.","Notification address and token":"Адрес и токен уведомлений","Now":"Сейчас","Now and the next days":"Сейчас и на ближайшие дни","now: %s":"сейчас: %s","Off":"Выкл.","On":"Вкл.","On: pressing Input shows our Inputs list. Off: LG’s picker comes back at once.":"Вкл.: нажатие Input показывает наш список входов. Выкл.: сразу возвращается выбор LG.","On: pressing the button you learned starts listening. A card shows what was heard.":"Вкл.: нажатие запомненной кнопки начинает слушать. Карточка показывает, что было услышано.","On: the Home button opens this launcher. Off: LG’s own Home. Switching restarts the TV (about a minute); the service keeps running either way.":"Вкл.: кнопка Home открывает этот лаунчер. Выкл.: собственный главный экран LG. Переключение перезапускает телевизор (около минуты); служба работает в обоих случаях.","On: the launcher has a Live TV button and tile, the Inputs list has Live TV, and the Guide key can open the channel guide. Off: all of that is hidden and LG’s own player and guide are used. Your playlist is kept.":"Вкл.: у лаунчера есть кнопка и плитка прямого эфира, в списке входов есть прямой эфир, а кнопка Guide может открыть программу каналов. Выкл.: всё это скрыто и используются проигрыватель и программа LG. Ваш плейлист сохраняется.","On: the TV listens on port 8767 for POST /notify with the token. Anyone who has the token and network access can show cards on this screen.":"Вкл.: телевизор слушает порт 8767 и принимает POST /notify с токеном. Любой, у кого есть токен и доступ к сети, может показывать карточки на этом экране.","On: what you say is also sent as text to a language model through OpenRouter and the answer is shown on screen. Needs your OpenRouter key; the text goes to OpenRouter and the model provider, never audio.":"Вкл.: сказанное также отправляется текстом языковой модели через OpenRouter, и ответ показывается на экране. Нужен ваш ключ OpenRouter; текст уходит в OpenRouter и к поставщику модели, звук — никогда.","one is saved, leave empty to keep it":"ключ сохранён, оставьте пустым, чтобы не менять","Open":"Открыть","OpenRouter key":"Ключ OpenRouter","optional":"необязательно","Optional. Records the Home button’s code. The Home key keeps working exactly as before.":"Необязательно. Запоминает код кнопки Home. Кнопка Home работает точно как раньше.","Optional. Speak into the remote and the TV turns it into text on the TV itself (Moonshine, English). The text can be sent to a server you run. Audio never leaves the TV. Needs a download of about 80 MB.":"Необязательно. Говорите в пульт, и телевизор сам превращает речь в текст (Moonshine, английский). Текст можно отправить на ваш сервер. Звук никогда не покидает телевизор. Нужна загрузка около 80 МБ.","over the running app, ready in the background (instant)":"поверх приложения, готово в фоне (мгновенно)","over the running app, started when pressed":"поверх приложения, запускается при нажатии","Photo %d of %d · preparing":"Фото %d из %d · подготовка","Photo %d of %d · sending":"Фото %d из %d · отправка","Photos from the Immich albums you chose, downloaded to the TV every six hours (and with Sync now), so Home never waits for Immich. At most 300.":"Фото из выбранных альбомов Immich, загружаемые на телевизор каждые шесть часов (и по кнопке «Синхронизировать»), чтобы главный экран никогда не ждал Immich. Не больше 300.","Photos uploaded from a phone, kept on the TV. At most 100.":"Фото, загруженные с телефона и хранящиеся на телевизоре. Не больше 100.","Picture size":"Размер фото","Place":"Место","Playlist":"Плейлист","Playlist address (M3U)":"Адрес плейлиста (M3U)","Playlist removed":"Плейлист удалён","Playlist saved":"Плейлист сохранён","Preparing the report…":"Подготовка отчёта…","Preparing…":"Подготовка…","Press and hold the text, then choose Copy":"Нажмите и удерживайте текст, затем выберите «Копировать»","Press the %s button now…":"Нажмите кнопку %s сейчас…","Puts the dock, the top buttons, hidden apps, the app order and the clock back to the defaults. The theme stays.":"Возвращает док, верхние кнопки, скрытые приложения, порядок приложений и часы к значениям по умолчанию. Тема остаётся.","QR code for your phone":"QR-код для телефона","Reading status…":"Чтение состояния…","Reads the code of your remote’s Input button from the hook, then tests that our list opens. The default is 241. Clear goes back to it.":"Считывает код кнопки Input вашего пульта через хук, затем проверяет, что открывается наш список. По умолчанию 241. «Сбросить» возвращает к нему.","Recent":"Недавние","Recent channels cleared":"Недавние каналы очищены","recommended first · installed %s":"рекомендуется сначала · установлено %s","Records the code of the remote button that starts listening. Try the microphone button first; any spare button works.":"Запоминает код кнопки пульта, которая начинает слушать. Сначала попробуйте кнопку микрофона; подойдёт любая свободная кнопка.","Records the Guide button’s code. Afterwards it opens the Live TV channel guide over whatever is running (only while Live TV is on). Clear it to get LG’s guide back.":"Запоминает код кнопки Guide. Потом она открывает программу каналов прямого эфира поверх всего (только когда прямой эфир включён). Сбросьте её, чтобы вернуть программу LG.","Refresh playlist and guide":"Обновить плейлист и программу","Refreshing in the background":"Обновление в фоне","Refreshing…":"Обновление…","refused":"отклонено","reloaded":"перезагружено","Remove all uploads":"Удалить все загрузки","Remove CleanYourTV?":"Удалить CleanYourTV?","Remove the playlist":"Удалить плейлист","Remove the playlist?":"Удалить плейлист?","Remove voice":"Удалить голос","Removes the apps, the boot scripts and your settings, then restarts the TV so LG’s Home comes back.":"Удаляет приложения, загрузочные скрипты и ваши настройки, затем перезапускает телевизор, чтобы вернулся главный экран LG.","Removing CleanYourTV… the TV restarts in a moment and LG’s Home comes back.":"Удаление CleanYourTV… телевизор сейчас перезапустится, и вернётся главный экран LG.","Reset Home customisation":"Сбросить настройки главного экрана","Restarting the service":"Перезапуск службы","Restarts the TV; LG’s own Home is Home after it starts. You can switch back here.":"Перезапускает телевизор; после запуска главным экраном будет собственный экран LG. Вернуть можно здесь.","Restarts the TV; this launcher is Home after it starts.":"Перезапускает телевизор; после запуска главным экраном будет этот лаунчер.","Right column":"Правая колонка","Running apps":"Открытые приложения","Save":"Сохранить","Save albums and sync":"Сохранить альбомы и синхронизировать","Save JSON":"Сохранить JSON","Saved":"Сохранено","Saved. Open Home on the TV to see it.":"Сохранено. Откройте главный экран на телевизоре, чтобы увидеть.","Saved. The TV is loading your channels now; you can close this page.":"Сохранено. Телевизор загружает ваши каналы; эту страницу можно закрыть.","Saved. You can close this page.":"Сохранено. Эту страницу можно закрыть.","Saving…":"Сохранение…","scan with a phone to copy the address and token":"отсканируйте телефоном, чтобы скопировать адрес и токен","Search":"Найти","Second line (where there is room)":"Вторая строка (если есть место)","Select all":"Выделить всё","selected":"выбрано","Send the text to":"Отправлять текст на","Send the text to your own server":"Отправлять текст на свой сервер","Sends what you say as text to Home Assistant’s Assist and shows its answer. Needs the address and a long-lived access token (Home Assistant profile page), entered on your phone. Choosing this row tests the connection.":"Отправляет сказанное текстом в Assist Home Assistant и показывает ответ. Нужны адрес и долгосрочный токен доступа (страница профиля Home Assistant), введённые на телефоне. Выбор этой строки проверяет соединение.","Server token":"Токен сервера","Service":"Служба","Service %s":"Служба %s","set up":"настроен","Set up anyway":"Всё равно настроить","set up from your phone":"настройте с телефона","Set up from your phone":"Настроить с телефона","set the Home Assistant address too":"укажите также адрес Home Assistant","set up Home Assistant first":"сначала настройте Home Assistant","Set up Live TV":"Настроить прямой эфир","Set up now":"Настроить сейчас","Set up with commands":"Настроить командами","Setting up… %s":"Настройка… %s","Setting up… the screen blinks once while LG’s system restarts":"Настройка… экран один раз мигнёт, пока система LG перезапускается","Settings":"Настройки","settings and apps are deleted; the TV restarts":"настройки и приложения удаляются; телевизор перезапускается","Settings for Live TV: switch it on or off, set up or remove your playlist, refresh the guide and learn the Guide key.":"Настройки прямого эфира: включить или выключить, настроить или удалить плейлист, обновить программу и запомнить кнопку Guide.","Share log":"Поделиться журналом","Share the log":"Поделиться журналом","Show":"Показывать","Show as QR code":"Показать QR-код","Show Live TV":"Показывать прямой эфир","Shows a QR code. A phone that scans it opens a page, served by the TV for ten minutes, that shows the notification address and the token with Copy buttons (for Home Assistant, for example). The token is a secret.":"Показывает QR-код. Телефон, который его отсканирует, откроет страницу (телевизор показывает её десять минут) с адресом уведомлений и токеном и кнопками «Копировать» (например, для Home Assistant). Токен — секрет.","Shows a QR code. On the phone page you upload photos (they are made the right size on the phone), delete uploads, connect Immich, choose albums and hide single photos.":"Показывает QR-код. На странице телефона вы загружаете фото (телефон сам подгоняет размер), удаляете загрузки, подключаете Immich, выбираете альбомы и скрываете отдельные фото.","Shows a QR code. Scan it with a phone on the same Wi-Fi to copy a report for a bug report. Addresses and URL paths are masked; the page closes after ten minutes.":"Показывает QR-код. Отсканируйте его телефоном в той же сети Wi-Fi, чтобы скопировать отчёт для сообщения об ошибке. Адреса и пути URL скрыты; страница закрывается через десять минут.","Shows a QR code. Scan it with a phone on the same Wi-Fi to enter your OpenRouter key, choose a model, write instructions and set a server address. Nothing is typed on the TV.":"Показывает QR-код. Отсканируйте его телефоном в той же сети Wi-Fi, чтобы ввести ключ OpenRouter, выбрать модель, написать инструкции и указать адрес сервера. На телевизоре ничего вводить не нужно.","Shows the address, the token and an example request.":"Показывает адрес, токен и пример запроса.","Shows the commands to set the key, model and instructions from a shell, and how to ask by text.":"Показывает команды, чтобы задать ключ, модель и инструкции из оболочки, и как спросить текстом.","Size":"Размер","Skip":"Пропустить","Small":"Маленький","small widgets on Home":"небольшие виджеты на главном экране","Speak now…":"Говорите…","speak when the card appears":"говорите, когда появится карточка","Stable releases":"Стабильные выпуски","Stable releases are what most people want: at most one a day, made from the dev builds. Dev builds come with every change and can be less finished; choose Dev here, then use the Launcher and Service rows to install it. Going back to Stable offers the latest release again.":"Стабильные выпуски нужны большинству: не больше одного в день, из тестовых сборок. Тестовые сборки приходят с каждым изменением и могут быть менее готовыми; выберите их здесь, затем установите через строки «Лаунчер» и «Служба». Возврат к стабильным снова предложит последний выпуск.","Start":"Начать","Starting":"Запуск","Starts listening without the button: speak when the card appears.":"Начинает слушать без кнопки: говорите, когда появится карточка.","Stops contentminer and nudge (recommendations and pop-up tips) and keeps sportsalarm from starting.":"Останавливает contentminer и nudge (рекомендации и всплывающие подсказки) и не даёт запуститься sportsalarm.","Stops LG’s ad, recommendation and telemetry services and blocks a few ad servers. Nothing is uninstalled, and it only applies while this launcher is Home.":"Останавливает рекламные, рекомендательные службы и телеметрию LG и блокирует несколько рекламных серверов. Ничего не удаляется, и это действует, только пока этот лаунчер — главный экран.","Stops LG’s ad, tracking, telemetry and suggestion services, in four groups you can switch separately. Nothing is uninstalled, and it only applies while this launcher is Home.":"Останавливает рекламные службы, слежение, телеметрию и подсказки LG — четыре группы, которые можно включать отдельно. Ничего не удаляется, и это действует, только пока этот лаунчер — главный экран.","Stops remotelogger and service-logger, which collect logs and send them to LG.":"Останавливает remotelogger и service-logger, которые собирают журналы и отправляют их в LG.","Stream":"Поток","streams":"потоки","Suggestions and nudges":"Подсказки и напоминания","Swaps the previous launcher version back in. The newer one stays available as an update.":"Возвращает предыдущую версию лаунчера. Новая остаётся доступной как обновление.","Switch all off":"Выключить всё","Switch all on":"Включить всё","Switch Home?":"Сменить главный экран?","Switch notifications on first":"Сначала включите уведомления","Switch off LG’s voice assistant":"Выключить голосовой ассистент LG","Switches every group on.":"Включает все группы.","Switches the debloat off: the services start again and the hosts lines are removed.":"Выключает Debloat: службы снова запускаются, а строки в hosts удаляются.","switching restarts the TV":"переключение перезапускает телевизор","Switching to CleanYourTV… the TV restarts in a moment.":"Переход на CleanYourTV… телевизор сейчас перезапустится.","Switching to LG’s Home… the TV restarts in a moment.":"Переход на главный экран LG… телевизор сейчас перезапустится.","Switching…":"Переключение…","Sync now":"Синхронизировать","synced %s":"синхронизировано %s","Synced photos":"Синхронизированные фото","Syncing with Immich…":"Синхронизация с Immich…","syncing…":"синхронизация…","Syncing…":"Синхронизация…","syncing… %d new":"синхронизация… новых: %d","Syncing… %d new":"Синхронизация… новых: %d","Take over the Input key":"Перехватывать кнопку Input","Tap Copy, then paste it into your message. Addresses and URL paths are masked. This page closes ten minutes after it was opened on the TV.":"Нажмите «Копировать» и вставьте в сообщение. Адреса и пути URL скрыты. Страница закрывается через десять минут после открытия на телевизоре.","tap to hide or show one":"нажмите, чтобы скрыть или показать","Telemetry logs":"Журналы телеметрии","Temperature":"Температура","Test connection and save":"Проверить соединение и сохранить","Test the connection":"Проверить подключение","Test.\nPress the Input button once more. Our Inputs list should open over this screen.":"Проверка.\nНажмите кнопку Input ещё раз. Поверх экрана должен открыться наш список входов.","Testing":"Проверка","Text":"Текст","the address and the token are removed from the TV":"адрес и токен будут удалены с телевизора","the address must start with http:// or https://":"адрес должен начинаться с http:// или https://","the address, the channel list, the guide and your favourites are deleted":"адрес, список каналов, программа и избранное будут удалены","The AI and Home Assistant remember the last turns for ten minutes. This clears them.":"ИИ и Home Assistant помнят последние реплики десять минут. Это их очищает.","The AI only":"Только ИИ","The background service behind the launcher: Live TV, picture notifications, the Input key, these updates. A failed update restores the previous files.":"Фоновая служба лаунчера: прямой эфир, уведомления с картинками, кнопка Input, эти обновления. Неудачное обновление восстанавливает прежние файлы.","the chosen albums have no photos the TV can show":"в выбранных альбомах нет фото, которые может показать телевизор","The colour of the focus ring and highlights":"Цвет рамки фокуса и выделений","The date":"Дата","The Guide key.\nChoose Start, then press the Guide button on your remote. It then opens the Live TV channel guide instead of LG’s guide. Clear it to get LG’s guide back.":"Кнопка Guide.\nВыберите «Начать», затем нажмите кнопку Guide на пульте. После этого она открывает программу прямого эфира вместо программы LG. Сбросьте её, чтобы вернуть программу LG.","The Home key (optional).\nChoose Start, then press the Home button on your remote.":"Кнопка Home (необязательно).\nВыберите «Начать», затем нажмите кнопку Home на пульте.","The home screen you see. Updates come from GitHub releases and are checked against a SHA-256 file before they are installed. If a new launcher does not start, the previous one is put back.":"Главный экран, который вы видите. Обновления приходят из выпусков GitHub и проверяются по файлу SHA-256 перед установкой. Если новый лаунчер не запускается, возвращается предыдущий.","The hook did not attach on this firmware, so keys cannot be learned. The Input key stays with LG’s picker.\nUse Share log to report this.":"Хук не подключился на этой прошивке, поэтому кнопки запомнить нельзя. Кнопка Input остаётся за выбором LG.\nСообщите об этом через «Поделиться журналом».","The Input key.\nChoose Start, then press the Input button on your remote.":"Кнопка Input.\nВыберите «Начать», затем нажмите кнопку Input на пульте.","The Inputs list did not open.\nIf LG’s own picker showed, the Input key is not mapped: learn it again or switch the Input key off.":"Список входов не открылся.\nЕсли появился выбор LG, кнопка Input не назначена: запомните её снова или выключите перехват кнопки Input.","The Inputs list opened: the Input key works.":"Список входов открылся: кнопка Input работает.","the install did not finish":"установка не завершилась","the key is forgotten and its photos are deleted from the TV":"ключ забыт, а его фото удалены с телевизора","The language of CleanYourTV’s screens: the launcher, this app and the Inputs list. Automatic follows the TV’s menu language. The percentage says how much of a language is translated; the rest stays English. Translations are files in the repository that anyone can add to.":"Язык экранов CleanYourTV: лаунчера, этого приложения и списка входов. «Автоматически» следует языку меню телевизора. Процент показывает, какая часть языка переведена; остальное остаётся на английском. Переводы — это файлы в репозитории, которые может дополнить каждый.","the launcher’s Inputs list":"список входов лаунчера","The launcher’s own settings go back to the defaults. Apps, the theme and everything in this app stay.":"Собственные настройки лаунчера возвращаются к значениям по умолчанию. Приложения, тема и всё в этом приложении остаются.","The new launcher did not start; rolling back":"Новый лаунчер не запустился; возврат","the new launcher did not start; the previous version is back":"новый лаунчер не запустился; вернулась предыдущая версия","The notification listener is not running.":"Приём уведомлений не работает.","the old one stops working":"старый перестанет работать","The page has closed. Close this and try again.":"Страница закрылась. Закройте это и попробуйте снова.","The page is open for ten minutes. It lists versions, the setup log and the service log; addresses and URL paths are masked.":"Страница открыта десять минут. В ней версии, журнал установки и журнал службы; адреса и пути URL скрыты.","The page opens for ten minutes. It is not encrypted: the token travels over your Wi-Fi, so use a network you trust.":"Страница открыта десять минут. Она не зашифрована: токен передаётся по вашей сети Wi-Fi, поэтому используйте сеть, которой доверяете.","The page stays open for ten minutes, or until you save. It is not encrypted: the key travels over your Wi-Fi, so use a network you trust.":"Страница открыта десять минут или до сохранения. Она не зашифрована: ключ передаётся по вашей сети Wi-Fi, поэтому используйте сеть, которой доверяете.","The page stays open for ten minutes. It is not encrypted: the playlist address, which may hold an access key, travels over your Wi-Fi.":"Страница открыта десять минут. Она не зашифрована: адрес плейлиста, в котором может быть ключ доступа, передаётся по вашей сети Wi-Fi.","The page stays open while you use it, at most an hour. It is not encrypted: what you type travels over your Wi-Fi.":"Страница открыта, пока вы ею пользуетесь, но не дольше часа. Она не зашифрована: то, что вы вводите, передаётся по вашей сети Wi-Fi.","The page stays open while you use it, at most an hour. It is not encrypted: your photos and the Immich key travel over your Wi-Fi.":"Страница открыта, пока вы ею пользуетесь, но не дольше часа. Она не зашифрована: ваши фото и ключ Immich передаются по вашей сети Wi-Fi.","the phone page could not start: %s":"не удалось открыть страницу для телефона: %s","the picture is larger than 12 MB":"изображение больше 12 МБ","The playlist address must start with http:// or https://":"Адрес плейлиста должен начинаться с http:// или https://","The remote’s Input button opens our Inputs list instead of LG’s picker. You can change this later.":"Кнопка Input на пульте открывает наш список входов вместо выбора LG. Это можно изменить позже.","The re ","On: the TV listens on port 8767 for POST /notify with the token. Anyone who has the token and network access can show cards on this screen.":"Açık: TV 8767 numaralı portu dinler ve token ile POST /notify kabul eder. Token'a ve ağa erişimi olan herkes bu ekranda kart gösterebilir.","On: what you say is also sent as text to a language model through OpenRouter and the answer is shown on screen. Needs your OpenRouter key; the text goes to OpenRouter and the model provider, never audio.":"Açık: söyledikleriniz ayrıca metin olarak OpenRouter üzerinden bir dil modeline gönderilir ve yanıt ekranda gösterilir. Kendi OpenRouter anahtarınız gerekir; metin OpenRouter'a ve model sağlayıcısına gider, ses asla.","one is saved, leave empty to keep it":"anahtar kayıtlı, değiştirmemek için boş bırakın","Open":"Aç","OpenRouter key":"OpenRouter anahtarı","optional":"isteğe bağlı","Optional. Records the Home button’s code. The Home key keeps working exactly as before.":"İsteğe bağlı. Home tuşunun kodunu öğrenir. Home tuşu tam olarak eskisi gibi çalışır.","Optional. Speak into the remote and the TV turns it into text on the TV itself (Moonshine, English). The text can be sent to a server you run. Audio never leaves the TV. Needs a download of about 80 MB.":"İsteğe bağlı. Kumandaya konuşun, TV konuşmayı kendisi metne çevirir (Moonshine, İngilizce). Metin kendi sunucunuza gönderilebilir. Ses asla TV'den çıkmaz. Yaklaşık 80 MB indirme gerekir.","over the running app, ready in the background (instant)":"uygulamanın üstünde, arka planda hazır (anında)","over the running app, started when pressed":"uygulamanın üstünde, basınca başlar","Photo %d of %d · preparing":"Fotoğraf %d / %d · hazırlanıyor","Photo %d of %d · sending":"Fotoğraf %d / %d · gönderiliyor","Photos from the Immich albums you chose, downloaded to the TV every six hours (and with Sync now), so Home never waits for Immich. At most 300.":"Seçili Immich albümlerinden fotoğraflar; ana ekran Immich'i hiç beklemesin diye altı saatte bir (ve Şimdi eşitle ile) TV'ye indirilir. En fazla 300.","Photos uploaded from a phone, kept on the TV. At most 100.":"Telefondan yüklenen ve TV'de saklanan fotoğraflar. En fazla 100.","Picture size":"Fotoğraf boyutu","Place":"Yer","Playlist":"Oynatma listesi","Playlist address (M3U)":"Oynatma listesi adresi (M3U)","Playlist removed":"Oynatma listesi kaldırıldı","Playlist saved":"Oynatma listesi kaydedildi","Preparing the report…":"Rapor hazırlanıyor…","Preparing…":"Hazırlanıyor…","Press and hold the text, then choose Copy":"Metne basılı tutun, sonra Kopyala'yı seçin","Press the %s button now…":"Şimdi %s tuşuna basın…","Puts the dock, the top buttons, hidden apps, the app order and the clock back to the defaults. The theme stays.":"Dock'u, üst düğmeleri, gizli uygulamaları, uygulama sırasını ve saati varsayılana döndürür. Tema kalır.","QR code for your phone":"Telefon için QR kodu","Reading status…":"Durum okunuyor…","Reads the code of your remote’s Input button from the hook, then tests that our list opens. The default is 241. Clear goes back to it.":"Kumandanızın Input tuşunun kodunu hook üzerinden okur, sonra listemizin açıldığını test eder. Varsayılan 241. Sıfırla buna döndürür.","Recent":"Son","Recent channels cleared":"Son kanallar temizlendi","recommended first · installed %s":"önce önerilen · yüklü %s","Records the code of the remote button that starts listening. Try the microphone button first; any spare button works.":"Dinlemeyi başlatan kumanda tuşunun kodunu öğrenir. Önce mikrofon tuşunu deneyin; boştaki herhangi bir tuş olur.","Records the Guide button’s code. Afterwards it opens the Live TV channel guide over whatever is running (only while Live TV is on). Clear it to get LG’s guide back.":"Rehber tuşunun kodunu öğrenir. Sonra tuş, Canlı TV kanal rehberini her şeyin üstünde açar (yalnızca Canlı TV açıkken). LG'nin rehberini geri getirmek için sıfırlayın.","Refresh playlist and guide":"Oynatma listesini ve rehberi yenile","Refreshing in the background":"Arka planda yenileniyor","Refreshing…":"Yenileniyor…","refused":"reddedildi","reloaded":"yeniden yüklendi","Remove all uploads":"Tüm yüklemeleri kaldır","Remove CleanYourTV?":"CleanYourTV kaldırılsın mı?","Remove the playlist":"Oynatma listesini kaldır","Remove the playlist?":"Oynatma listesi kaldırılsın mı?","Remove voice":"Sesi kaldır","Removes the apps, the boot scripts and your settings, then restarts the TV so LG’s Home comes back.":"Uygulamaları, açılış betiklerini ve ayarlarınızı kaldırır, sonra LG'nin ana ekranının geri gelmesi için TV'yi yeniden başlatır.","Removing CleanYourTV… the TV restarts in a moment and LG’s Home comes back.":"CleanYourTV kaldırılıyor… TV şimdi yeniden başlayacak ve LG'nin ana ekranı geri gelecek.","Reset Home customisation":"Ana ekranı sıfırla","Restarting the service":"Hizmet yeniden başlatılıyor","Restarts the TV; LG’s own Home is Home after it starts. You can switch back here.":"TV'yi yeniden başlatır; açılınca LG'nin kendi ana ekranı ana ekran olur. Buradan geri dönebilirsiniz.","Restarts the TV; this launcher is Home after it starts.":"TV'yi yeniden başlatır; açılınca bu başlatıcı ana ekran olur.","Right column":"Sağ sütun","Running apps":"Açık uygulamalar","Save":"Kaydet","Save albums and sync":"Albümleri kaydet ve eşitle","Save JSON":"JSON’u kaydet","Saved":"Kaydedildi","Saved. Open Home on the TV to see it.":"Kaydedildi. Görmek için TV’de ana ekranı açın.","Saved. The TV is loading your channels now; you can close this page.":"Kaydedildi. TV kanallarınızı yüklüyor; bu sayfayı kapatabilirsiniz.","Saved. You can close this page.":"Kaydedildi. Bu sayfayı kapatabilirsiniz.","Saving…":"Kaydediliyor…","scan with a phone to copy the address and token":"adresi ve token'ı kopyalamak için telefonla tarayın","Search":"Ara","Second line (where there is room)":"İkinci satır (yer varsa)","Select all":"Tümünü seç","selected":"seçili","Send the text to":"Metni gönder","Send the text to your own server":"Metni kendi sunucunuza gönderin","Sends what you say as text to Home Assistant’s Assist and shows its answer. Needs the address and a long-lived access token (Home Assistant profile page), entered on your phone. Choosing this row tests the connection.":"Söylediklerinizi metin olarak Home Assistant'ın Assist'ine gönderir ve yanıtı gösterir. Telefondan girilen adres ve uzun ömürlü erişim token'ı (Home Assistant profil sayfası) gerekir. Bu satırı seçmek bağlantıyı test eder.","Server token":"Sunucu token'ı","Service":"Hizmet","Service %s":"Hizmet %s","set up":"ayarlandı","Set up anyway":"Yine de ayarla","set up from your phone":"telefonla ayarlayın","Set up from your phone":"Telefonla ayarla","set the Home Assistant address too":"Home Assistant adresini de girin","set up Home Assistant first":"önce Home Assistant'ı ayarlayın","Set up Live TV":"Canlı TV'yi ayarla","Set up now":"Şimdi ayarla","Set up with commands":"Komutlarla ayarla","Setting up… %s":"Ayarlanıyor… %s","Setting up… the screen blinks once while LG’s system restarts":"Ayarlanıyor… LG'nin sistemi yeniden başlarken ekran bir kez yanıp söner","Settings":"Ayarlar","settings and apps are deleted; the TV restarts":"ayarlar ve uygulamalar kaldırılır; TV yeniden başlar","Settings for Live TV: switch it on or off, set up or remove your playlist, refresh the guide and learn the Guide key.":"Canlı TV ayarları: açın veya kapatın, oynatma listesini ayarlayın veya kaldırın, rehberi yenileyin ve Rehber tuşunu öğretin.","Share log":"Günlüğü paylaş","Share the log":"Günlüğü paylaş","Show":"Göster","Show as QR code":"QR kodunu göster","Show Live TV":"Canlı TV'yi göster","Shows a QR code. A phone that scans it opens a page, served by the TV for ten minutes, that shows the notification address and the token with Copy buttons (for Home Assistant, for example). The token is a secret.":"Bir QR kodu gösterir. Onu tarayan telefon, bildirim adresini ve token'ı Kopyala düğmeleriyle gösteren bir sayfa açar (TV on dakika boyunca sunar; örneğin Home Assistant için). Token bir sırdır.","Shows a QR code. On the phone page you upload photos (they are made the right size on the phone), delete uploads, connect Immich, choose albums and hide single photos.":"Bir QR kodu gösterir. Telefon sayfasında fotoğraf yüklersiniz (telefon boyutlandırır), yüklemeleri silersiniz, Immich'i bağlarsınız, albüm seçersiniz ve tek tek fotoğrafları gizlersiniz.","Shows a QR code. Scan it with a phone on the same Wi-Fi to copy a report for a bug report. Addresses and URL paths are masked; the page closes after ten minutes.":"Bir QR kodu gösterir. Bir hata raporuna kopyalamak için aynı Wi-Fi'deki bir telefonla tarayın. Adresler ve URL yolları gizlenir; sayfa on dakika sonra kapanır.","Shows a QR code. Scan it with a phone on the same Wi-Fi to enter your OpenRouter key, choose a model, write instructions and set a server address. Nothing is typed on the TV.":"Bir QR kodu gösterir. OpenRouter anahtarını girmek, model seçmek, talimat yazmak ve sunucu adresi belirlemek için aynı Wi-Fi'deki bir telefonla tarayın. TV'de yazmanız gerekmez.","Shows the address, the token and an example request.":"Adresi, token'ı ve örnek bir isteği gösterir.","Shows the commands to set the key, model and instructions from a shell, and how to ask by text.":"Anahtarı, modeli ve talimatları kabuktan ayarlama komutlarını ve metinle nasıl sorulacağını gösterir.","Size":"Boyut","Skip":"Atla","Small":"Küçük","small widgets on Home":"Ana ekranda küçük bileşenler","Speak now…":"Konuşun…","speak when the card appears":"kart görününce konuşun","Stable releases":"Kararlı sürümler","Stable releases are what most people want: at most one a day, made from the dev builds. Dev builds come with every change and can be less finished; choose Dev here, then use the Launcher and Service rows to install it. Going back to Stable offers the latest release again.":"Kararlı sürümler çoğu kişi içindir: geliştirme sürümlerinden, günde en fazla bir. Geliştirme sürümleri her değişiklikle gelir ve daha az olgun olabilir; burada seçin, sonra Başlatıcı ve Hizmet satırlarıyla yükleyin. Kararlıya dönmek en son sürümü yeniden önerir.","Start":"Başlat","Starting":"Başlatılıyor","Starts listening without the button: speak when the card appears.":"Tuşsuz dinlemeye başlar: kart görününce konuşun.","Stops contentminer and nudge (recommendations and pop-up tips) and keeps sportsalarm from starting.":"contentminer ve nudge'ı (öneriler ve açılır ipuçları) durdurur, sportsalarm'ın başlamasını engeller.","Stops LG’s ad, recommendation and telemetry services and blocks a few ad servers. Nothing is uninstalled, and it only applies while this launcher is Home.":"LG'nin reklam, öneri ve telemetri hizmetlerini durdurur ve birkaç reklam sunucusunu engeller. Hiçbir şey silinmez ve yalnızca bu başlatıcı ana ekranken geçerlidir.","Stops LG’s ad, tracking, telemetry and suggestion services, in four groups you can switch separately. Nothing is uninstalled, and it only applies while this launcher is Home.":"LG'nin reklam hizmetlerini, izlemeyi, telemetriyi ve ipuçlarını durdurur: ayrı ayrı açılabilen dört grup. Hiçbir şey silinmez ve yalnızca bu başlatıcı ana ekranken geçerlidir.","Stops remotelogger and service-logger, which collect logs and send them to LG.":"Günlük toplayıp LG'ye gönderen remotelogger ve service-logger'ı durdurur.","Stream":"Akış","streams":"akışlar","Suggestions and nudges":"Öneriler ve hatırlatmalar","Swaps the previous launcher version back in. The newer one stays available as an update.":"Başlatıcının önceki sürümünü geri yükler. Yenisi güncelleme olarak kalır.","Switch all off":"Hepsini kapat","Switch all on":"Hepsini aç","Switch Home?":"Ana ekran değiştirilsin mi?","Switch notifications on first":"Önce bildirimleri açın","Switch off LG’s voice assistant":"LG'nin sesli asistanını kapat","Switches every group on.":"Tüm grupları açar.","Switches the debloat off: the services start again and the hosts lines are removed.":"Debloat'u kapatır: hizmetler yeniden başlar ve hosts satırları kaldırılır.","switching restarts the TV":"geçiş TV'yi yeniden başlatır","Switching to CleanYourTV… the TV restarts in a moment.":"CleanYourTV'ye geçiliyor… TV şimdi yeniden başlayacak.","Switching to LG’s Home… the TV restarts in a moment.":"LG'nin ana ekranına geçiliyor… TV şimdi yeniden başlayacak.","Switching…":"Geçiliyor…","Sync now":"Şimdi eşitle","synced %s":"%s eşitlendi","Synced photos":"Eşitlenen fotoğraflar","Syncing with Immich…":"Immich ile eşitleniyor…","syncing…":"eşitleniyor…","Syncing…":"Eşitleniyor…","syncing… %d new":"eşitleniyor… %d yeni","Syncing… %d new":"Eşitleniyor… %d yeni","Take over the Input key":"Input tuşunu yakala","Tap Copy, then paste it into your message. Addresses and URL paths are masked. This page closes ten minutes after it was opened on the TV.":"Kopyala'ya dokunun ve rapora yapıştırın. Adresler ve URL yolları gizlenir. Sayfa TV'de açıldıktan on dakika sonra kapanır.","tap to hide or show one":"gizlemek veya göstermek için dokunun","Telemetry logs":"Telemetri günlükleri","Temperature":"Sıcaklık","Test connection and save":"Bağlantıyı test et ve kaydet","Test the connection":"Bağlantıyı test et","Test.\nPress the Input button once more. Our Inputs list should open over this screen.":"Test.\nInput tuşuna bir kez daha basın. Bizim giriş listemiz ekranın üstünde açılmalı.","Testing":"Test","Text":"Metin","the address and the token are removed from the TV":"adres ve token TV’den silinir","the address must start with http:// or https://":"adres http:// veya https:// ile başlamalı","the address, the channel list, the guide and your favourites are deleted":"adres, kanal listesi, rehber ve favoriler silinir","The AI and Home Assistant remember the last turns for ten minutes. This clears them.":"Yapay zekâ ve Home Assistant son konuşmaları on dakika hatırlar. Bu, onları temizler.","The AI only":"Yalnızca yapay zekâ","The background service behind the launcher: Live TV, picture notifications, the Input key, these updates. A failed update restores the previous files.":"Başlatıcının arka plan hizmeti: Canlı TV, resimli bildirimler, Input tuşu, bu güncellemeler. Başarısız bir güncelleme eski dosyaları geri yükler.","the chosen albums have no photos the TV can show":"seçili albümlerde TV'nin gösterebileceği fotoğraf yok","The colour of the focus ring and highlights":"Odak halkasının ve vurguların rengi","The date":"Tarih","The Guide key.\nChoose Start, then press the Guide button on your remote. It then opens the Live TV channel guide instead of LG’s guide. Clear it to get LG’s guide back.":"Rehber tuşu.\nBaşlat'ı seçin, sonra kumandadaki Rehber tuşuna basın. Ardından LG'nin rehberi yerine Canlı TV rehberini açar. LG'ninkini geri getirmek için sıfırlayın.","The Home key (optional).\nChoose Start, then press the Home button on your remote.":"Home tuşu (isteğe bağlı).\nBaşlat'ı seçin, sonra kumandadaki Home tuşuna basın.","The home screen you see. Updates come from GitHub releases and are checked against a SHA-256 file before they are installed. If a new launcher does not start, the previous one is put back.":"Gördüğünüz ana ekran. Güncellemeler GitHub sürümlerinden gelir ve yüklenmeden önce SHA-256 dosyasıyla denetlenir. Yeni başlatıcı açılmazsa öncekine dönülür.","The hook did not attach on this firmware, so keys cannot be learned. The Input key stays with LG’s picker.\nUse Share log to report this.":"Hook bu yazılımda bağlanmadı, bu yüzden tuşlar öğretilemez. Input tuşu LG'nin seçicisinde kalır.\nLütfen Günlüğü paylaş ile bildirin.","The Input key.\nChoose Start, then press the Input button on your remote.":"Input tuşu.\nBaşlat'ı seçin, sonra kumandadaki Input tuşuna basın.","The Inputs list did not open.\nIf LG’s own picker showed, the Input key is not mapped: learn it again or switch the Input key off.":"Giriş listesi açılmadı.\nLG'nin seçicisi geldiyse Input tuşu atanmamıştır: yeniden öğretin veya Input tuşunu yakalamayı kapatın.","The Inputs list opened: the Input key works.":"Giriş listesi açıldı: Input tuşu çalışıyor.","the install did not finish":"yükleme tamamlanmadı","the key is forgotten and its photos are deleted from the TV":"anahtar unutuldu ve fotoğrafları TV'den silindi","The language of CleanYourTV’s screens: the launcher, this app and the Inputs list. Automatic follows the TV’s menu language. The percentage says how much of a language is translated; the rest stays English. Translations are files in the repository that anyone can add to.":"CleanYourTV ekranlarının dili: başlatıcı, bu uygulama ve giriş listesi. Otomatik, TV'nin menü dilini izler. Yüzde, dilin ne kadarının çevrildiğini gösterir; geri kalanı İngilizce kalır. Çeviriler depoda herkesin genişletebileceği dosyalardır.","the launcher’s Inputs list":"başlatıcının giriş listesi","The launcher’s own settings go back to the defaults. Apps, the theme and everything in this app stay.":"Başlatıcının kendi ayarları varsayılana döner. Uygulamalar, tema ve bu uygulamadaki her şey kalır.","The new launcher did not start; rolling back":"Yeni başlatıcı açılmadı; geri dönülüyor","the new launcher did not start; the previous version is back":"yeni başlatıcı açılmadı; önceki geri yüklendi","The notification listener is not running.":"Bildirim alıcısı çalışmıyor.","the old one stops working":"eskisi çalışmayı bırakır","The page has closed. Close this and try again.":"Sayfa kapandı. Bunu kapatıp tekrar deneyin.","The page is open for ten minutes. It lists versions, the setup log and the service log; addresses and URL paths are masked.":"Sayfa on dakika açık kalır. Sürümleri, yükleme günlüğünü ve hizmet günlüğünü içerir; adresler ve URL yolları gizlenir.","The page opens for ten minutes. It is not encrypted: the token travels over your Wi-Fi, so use a network you trust.":"Sayfa on dakika açık kalır. Şifrelenmez: token Wi-Fi ağınızda iletilir, bu yüzden güvendiğiniz bir ağ kullanın.","The page stays open for ten minutes, or until you save. It is not encrypted: the key travels over your Wi-Fi, so use a n       draw();

}
/* before the setup (or when it failed) the service is not running: update the package through the root service instead */
function execOut(m) {
  var o = {};
  try {
    o = JSON.parse(m);
  } catch (e) {}
  return { ok: o.returnValue !== false, out: String(o.stdoutString || ''), err: String(o.stderrString || o.errorText || '') };
}
function offlineCheck() {
  banner('Checking for updates\u2026', 'work');
  rootExec('node ' + SVC + '/helper/selfupdate.js check').then(function (m) {
    var e = execOut(m),
      r = null;
    try {
      r = JSON.parse(e.out);
    } catch (x) {}
    if (!r || r.error) {
      banner('Could not check: ' + ((r && r.error) || e.err || 'no answer'), 'err');
      return;
    }
    upd = r.updateTo ? r : null;
    build();
    if (upd) idx = updIdx;
    draw();
    banner(
      r.updateTo ? 'Version ' + r.updateTo + ' is available; this one is ' + r.installed + '.' : 'Up to date (' + r.installed + ').',
      r.updateTo ? 'ok' : ''
    );
  });
}
function offlineUpdate() {
  if (!upd) return;
  banner('Updating to ' + upd.updateTo + '\u2026', 'work');
  rootExec('rm -f /tmp/cytv-selfupdate.log; nohup node ' + SVC + '/helper/selfupdate.js install > /tmp/cytv-selfupdate.log 2>&1 &').then(
    function () {
      pollUpdate(0);
    }
  );
}
function pollUpdate(n) {
  rootExec('tail -n 3 /tmp/cytv-selfupdate.log 2>/dev/null').then(function (m) {
    var t = execOut(m).out.trim(),
      last = t.split('\n').pop();
    if (/^DONE/.test(last)) {
      upd = null;
      banner(last.replace(/^DONE /, ''), 'ok');
      build();
      draw();
      return;
    }
    if (/^ERROR/.test(last)) {
      banner('Update failed: ' + last.replace(/^ERROR /, ''), 'err');
      return;
    }
    if (n > 120) {
      banner('The update is taking too long. Log: /tmp/cytv-selfupdate.log on the TV.', 'err');
      return;
    }
    if (last) banner('Updating\u2026 ' + last, 'work');
    setTimeout(function () {
      pollUpdate(n + 1);
    }, 2000);
  });
}
/* the remote's Input and Home buttons differ between remotes and firmware: learn their codes from the hook, then test */
function kShow(text, list) {

function closeKeys() {

function kName(n) {

function kStep(n) {

          sub: 'LG\u2019s guide again',

          fn: function () {

          },
        },
        { label: 'Close', fn: closeKeys },

      .then(function () {
        return api('/api/manager/status');
      })
      .then(
        function (s) {
          st = s;
          kShow(
            'Done.\nInput key ' +
              ((s.keys || {}).input || '241') +
              '.\nThe Home key is optional: learn it from the main list if you want it recorded.',
            [{ label: 'Close', fn: closeKeys }]
          );
        },
        function () {
          closeKeys();
        }
      );
}
function kClear(name) {
  api('/api/manager/clear-key', { name: name })
    .then(function () {
      return api('/api/manager/status');
    })
    .then(
      function (s) {
        st = s;
        kShow(
          name === 'input'
            ? 'Input key cleared.\nIt uses the default code (' + ((s.keys || {}).input || '241') + ').'
            : name === 'voice'
              ? 'Voice button cleared.'
              : name === 'guide'
                ? 'Guide key cleared. LG\u2019s guide is back.'
                : 'Home key cleared.',
          [{ label: 'Close', fn: closeKeys }]
        );
      },
      function () {
        closeKeys();
      }
    );
}
function kLearn(name) {
  api('/api/manager/learn-key', { name: name }).then(function () {
    kShow('Press the ' + kName(name) + ' button now\u2026', [
      {
        label: 'Cancel',
        fn: function () {
          kStep(name);
        },
      },
    ]);
    (function poll() {
      kTimer = setTimeout(function () {
        api('/api/manager/learn-state').then(
          function (l) {
            if (view !== 'keys') return;
            if (l.state === 'got') {
              kShow(kName(name) + ' key learned: code ' + l.code + '.', [
                {
                  label: name === 'input' ? 'Continue to the test' : 'Close',
                  fn: function () {
                    api('/api/manager/status').then(function (s) {
                      st = s;
                      if (name === 'input') kStep('test');
                      else closeKeys();
                    });
                  },
                },
              ]);
              return;
            }
            if (l.state === 'unsupported') {
              api('/api/manager/options', { inputKey: false });
              kShow(
                'The hook did not attach on this firmware, so keys cannot be learned. The Input key stays with LG\u2019s picker.\nUse Share log to report this.',
                [{ label: 'Close', fn: closeKeys }]
              );
              return;
            }
            if (l.state === 'timeout') {
              kShow('Nothing was pressed.', [
                {
                  label: 'Try again',
                  fn: function () {
                    kLearn(name);
                  },
                },
                {
                  label: name === 'input' ? 'Skip' : 'Close',
                  fn: function () {
                    if (name === 'input') kStep('test');
                    else closeKeys();
                  },
                },
              ]);
              return;
            }
            poll();
          },
          function () {
            poll();
          }
        );
      }, 500);
    })();
  });
}
function kTest() {
  api('/api/manager/test-key').then(function (t0) {
    kShow('Test.\nPress the Input button once more. Our Inputs list should open over this screen.', [
      {
        label: 'Skip',
        fn: function () {
          kStep('done');
        },
      },
    ]);
    var until = Date.now() + 40000;
    (function poll() {
      kTimer = setTimeout(function () {
        api('/api/manager/test-key').then(
          function (t) {
            if (view !== 'keys') return;
            if (t.pickerShownAt > t0.now) {
              kShow('The Inputs list opened: the Input key works.', [
                {
                  label: 'Continue',
                  fn: function () {
                    kStep('done');
                  },
                },
              ]);
              return;
            }
            if (Date.now() > until) {
              kShow(
                'The Inputs list did not open.\nIf LG\u2019s own picker showed, the Input key is not mapped: learn it again or switch the Input key off.',
                [
                  {
                    label: 'Learn again',
                    fn: function () {
                      kStep('input');
                    },
                  },
                  {
                    label: 'Skip',
                    fn: function () {
                      kStep('done');
                    },
                  },
                ]
              );
              return;
            }
            poll();
          },
          function () {
            poll();
          }
        );
      }, 700);
    })();
  });
}
function drawQr(url) {
  var q = qrcode(0, 'M');
  q.addData(url);
  q.make();
  var n = q.getModuleCount(),
    cell = Math.max(4, Math.floor(640 / (n + 8))),
    cv = $('qr'),
    size = cell * (n + 8),
    g;
  cv.width = cv.height = size;
  g = cv.getContext('2d');
  g.fillStyle = '#fff';
  g.fillRect(0, 0, size, size);
  g.fillStyle = '#000';
  for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (q.isDark(r, c)) g.fillRect((c + 4) * cell, (r + 4) * cell, cell, cell);
}
function openShare() {

  $('share').querySelector('ol').innerHTML = tr(
    '<li>Phone on the <b>same Wi-Fi</b> as the TV.</li><li>Scan the code with the camera.</li><li>Tap <b>Copy</b> on the page and paste it into your message.</li>'
  );
  $('share').style.display = 'block';
  $('shareurl').textContent = '';
  $('qrbox').style.visibility = 'hidden';
  $('sharemsg').textContent = tr('Preparing the report\u2026');
  rootExec('rm -f /tmp/cytv-sharelog.json; nohup node ' + SVC + '/helper/sharelog.js > /tmp/cytv-sharelog.out 2>&1 &').then(function () {

}
function pollShare(n) {
  if (view !== 'share') return;
  rootExec('cat /tmp/cytv-sharelog.json 2>/dev/null').then(function (m) {
    var st = null;
    try {
      st = JSON.parse(JSON.parse(m).stdoutString || 'null');
    } catch (e) {}

      $('qrbox').style.visibility = 'visible';

function closeShare() {

  }

function doSetup(force) {
  forceOffer = false;

  var flags =
    (setup.debloat ? '--debloat' : '--no-debloat') + ' ' + (setup.inputKey ? '--input-key' : '--no-input-key') + (force ? ' --force' : '');
  rootExec(
    'rm -f /media/developer/cytv-setup.log*; nohup sh ' +
      SVC +
      '/bootstrap.sh install ' +
      flags +
      ' > /media/developer/cytv-setup.log 2>&1 &'
  ).then(function (m) {
    var o = {};
    try {
      o = JSON.parse(m);
    } catch (e) {}
    if (o.returnValue === false) {
      banner(
        'Could not start the setup: ' + (o.errorText || 'no answer from the Homebrew Channel service (is it installed and up to date?)'),
        'err'

    }

function logTail(cb) {
  rootExec('tail -n 3 /media/developer/cytv-setup.log 2>/dev/null').then(function (m) {
    var o = {};

      o = JSON.parse(m);
    } catch (e) {}

        .replace(/\[cleanyourtv\] /g, '')

}
function waitUp(n) {

}
document.addEventListener('keydown', function (e) {
  var k = e.keyCode;
  if (k === 38) next(-1);
  else if (k === 40) next(1);
  else if (k === 13) act();
  else if (k === 461 || k === 27 || k === 8 || k === 10009) {
    if (view === 'share') closeShare();
    else if (view === 'keys') closeKeys();
    else if (view !== 'main') pop();

      try {
        window.close();
      } catch (x) {}
    }
  }
  e.preventDefault();
});
document.addEventListener('click', function (e) {

    closeShare();
    return;
  }
  var r = e.target.closest && e.target.closest('.row');

    idx = +r.getAttribute('data-i');

    act();
  }
