<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TV Remote</title>
<style>
html,body{margin:0;height:100%;background:#101218;color:#f4f5f7;font:16px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column;justify-content:center;padding:28px 22px}
.logo{width:60px;height:60px;border-radius:18px;background:#1a1c23;border:1px solid #2e3140;display:flex;align-items:center;justify-content:center;margin:0 0 18px}
.logo svg{width:30px;height:30px;stroke:#ff8a5b;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:30px;line-height:1.15;margin:0 0 10px}
p{color:#a3a8b8;margin:0 0 22px}
.hide{display:none}
.big{width:100%;height:76px;border:0;border-radius:22px;background:#ff8a5b;color:#1b1008;font:800 20px ui-sans-serif,system-ui,sans-serif;box-shadow:0 0 34px rgba(255,138,91,.28)}
.big:active{transform:scale(.985)}
.lnk{width:100%;height:56px;margin-top:12px;border-radius:18px;background:#1a1c23;border:1px solid #2e3140;color:#ff8a5b;font:700 16px ui-sans-serif,system-ui,sans-serif}
.small{margin-top:20px;color:#7d8296;font-size:13px;text-align:center}
#msg{color:#f0a0a0;font-size:14px;min-height:20px;margin:14px 0 0}
</style>
</head>
<body>
<div class="logo"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></svg></div>
<h1>The TV is off</h1>
<p>Turn it on and the remote opens by itself.</p>
<div id=name class=hide><p>Connected TV: <b id=tv></b></p></div>
<button class="big" id=on>Turn on the TV</button>
<button class="lnk" id=retry>Try again</button>
<p id=msg></p>
<p class="small" id=change>Another TV</p>
<script>
var A = window.CYTV_APP || null;
function $(i){return document.getElementById(i)}
function call(n){
  try{ return A && typeof A[n] === 'function' ? A[n]() : null }catch(e){ return null }
}
$('on').onclick = function(){
  $('msg').textContent = '';
  if (!call('wake')) { $('msg').textContent = 'Pair this phone with the TV once.'; return }
  $('on').textContent = 'Waking the TV…';
  $('on').disabled = true;
};
$('retry').onclick = function(){
  $('msg').textContent = '';
  call('open');
};
$('change').onclick = function(){ call('start') };
/* the TV may be turning on by another means: open the remote as soon as it answers */
setInterval(function(){ if (call('up')) call('open') }, 3000);
/* the native side says when the wake packet got nothing */
window.cytvOff = function(m){ $('on').textContent = 'Turn on the TV'; $('on').disabled = false; $('msg').textContent = m || '' };
window.cytvName = function(n){ if (!n) return; $('tv').textContent = n; $('name').className = '' };
(function(){ var n = call('name'); if (n) { $('tv').textContent = n; $('name').className = ''; } })();
</script>
</body>
</html>
