<!doctype html>
<html lang=en>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name=referrer content=no-referrer>
<title>TV Remote</title>
<style>
html,body{direction:ltr}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font:16px -apple-system,system-ui,sans-serif;background:#101116;color:#f4f5f7;margin:0}
#wrap{position:relative;overflow:hidden;min-height:100vh;display:flex;flex-direction:column;justify-content:center;max-width:430px;margin:0 auto;padding:26px 20px 26px}#wrap>*{position:relative}
#wrap .glow{position:absolute;left:-80px;top:-120px;width:360px;height:360px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,138,91,.2),transparent)}
h1{font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-.02em;margin:6px 0 6px}h1+p{font-size:16px;margin:0}
p{color:#a3a8b8;line-height:1.5;margin:8px 0}p b{color:#f4f5f7}small{color:#7b8092;font-size:13px;line-height:1.5}
label{display:block;font-size:14px;font-weight:600;color:#a3a8b8;margin:6px 0 8px}
.hide{display:none!important}
button,input{font:inherit;color:#f4f5f7;background:#1a1c23;border:1px solid #2e3140;border-radius:18px}
button{display:block;width:100%;font-weight:700;touch-action:manipulation}
input{width:100%;height:56px;padding:0 16px;font-size:17px;margin:0 0 10px}
.big{height:96px;border:0;background:#ff8a5b;color:#1b1008;font-size:21px;font-weight:800;margin:0 0 16px;box-shadow:0 12px 30px rgba(255,138,91,.3)}
.pri{height:58px;border:0;background:#ff8a5b;color:#1b1008;font-size:18px;font-weight:800;margin-top:14px}
.lnk{height:44px;color:#ff8a5b}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:60;width:calc(100% - 32px);max-width:398px;margin:0;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.45;text-align:left;pointer-events:none;opacity:0;transform:translate(-50%,-24px);transition:transform .25s ease,opacity .25s ease;box-shadow:0 12px 30px rgba(0,0,0,.45);background:#1a1c23;border:1px solid #2e3140;color:#dde0ea}.toast.ok{background:#1b2420;border-color:#2c4a3a;color:#bfe9cf}.toast.warn{background:#241f16;border-color:#5a4a2b;color:#f0d9a8}.toast.on{opacity:1;transform:translate(-50%,0)}@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.box{background:#1a1c23;border:1px solid #2e3140;border-radius:20px;padding:16px 16px 4px;margin:22px 0 0}
.step{display:flex;align-items:flex-start;color:#dde0ea;font-size:15px;line-height:1.45;margin:0 0 12px}
.step i{flex:none;width:26px;height:26px;border-radius:50%;background:#232631;color:#ff8a5b;font:700 13px system-ui;font-style:normal;display:flex;align-items:center;justify-content:center;margin-right:12px}
</style>
<div id=toast class=toast role=status aria-live=polite></div>
<div id=wrap>
<div class=glow></div>
<h1>The TV is off</h1>
<p>Turn it on and the remote opens by itself.</p>
<p id=name class=hide>Connected TV: <b id=tv></b></p>
<div style="margin-top:22px">
  <button class=big id=on>Turn on the TV</button>
  <button class=lnk id=retry>Try again</button>
  <button class=lnk id=change>Another TV</button>
</div>
</div>
<script>
var A=window.CYTV_APP||null;
function $(i){return document.getElementById(i)}
/* every message is a toast that slides in at the top over the page and goes away by itself; it never takes room in the page (the same as the start page) */
var toastT=0;
function toast(s,k,ms){var e=$('toast');clearTimeout(toastT);e.textContent=s;e.className='toast '+(k||'info');void e.offsetWidth;e.className='toast '+(k||'info')+' on';toastT=setTimeout(function(){e.className='toast '+(k||'info')},ms||(k==='warn'?7000:3500))}
function call(n){
  try{return A&&typeof A[n]==='function'?A[n]():null}catch(e){return null}
}
$('on').onclick=function(){
  if(!call('wake')){toast('Pair this phone with the TV once.','warn');return}
  $('on').textContent='Waking the TV…';
  $('on').disabled=true;
};
$('retry').onclick=function(){call('open')};
$('change').onclick=function(){call('start')};
/* the TV may be turning on by another means: open the remote as soon as it answers */
setInterval(function(){if(call('up'))call('open')},3000);
/* the native side says when the wake packet got nothing */
window.cytvOff=function(m){$('on').textContent='Turn on the TV';$('on').disabled=false;toast(m||'The TV did not answer.','warn')};
window.cytvName=function(n){if(!n)return;$('tv').textContent=n;$('name').className=''};
(function(){var n=call('name');if(n){$('tv').textContent=n;$('name').className=''}})();
</script>
</html>
