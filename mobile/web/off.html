<!doctype html>
<html lang=en>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name=referrer content=no-referrer>
<title>TV Remote</title>
<style>
html,body{direction:ltr}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font:16px -apple-system,system-ui,sans-serif;background:#101116;color:#f4f5f7;margin:0}
#wrap{position:relative;overflow:hidden;min-height:100vh;display:flex;flex-direction:column;max-width:430px;margin:0 auto;padding:72px 20px 24px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}#wrap>*{position:relative}
#wrap .glow{position:absolute;left:-100px;top:-140px;width:320px;height:320px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,138,91,.14),transparent)}
.view{display:flex;flex-direction:column;flex:1}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.02em;color:#7b8092;margin:0 0 8px;min-height:20px}
h1{font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-.02em;margin:0 0 8px}
.sub{font-size:16px;line-height:1.5;color:#a3a8b8;margin:0 0 24px}
.hide{display:none!important}
button{display:block;width:100%;font:inherit;font-weight:700;touch-action:manipulation;color:#f4f5f7;border-radius:16px}
.pri{height:58px;border:0;border-radius:18px;background:#ff8a5b;color:#1b1008;font-size:18px;font-weight:800;box-shadow:0 10px 24px rgba(255,138,91,.25)}.pri:active{transform:scale(.98)}.pri:disabled{opacity:.55}
.sec{height:52px;margin-top:8px;border:1.5px solid #3a3f52;border-radius:18px;background:transparent;font-size:15px}
.lnk{height:48px;margin:8px 0 0;border:0;background:transparent;color:#a3a8b8;font-size:15px;font-weight:600}
.actions{margin-top:auto;padding-top:24px}
.pill{align-self:flex-start;line-height:1.5;margin:0 0 24px;padding:8px 14px;border-radius:999px;background:#14161c;border:1.5px solid #646b82;font-size:15px;font-weight:700;color:#fff}.pill span{color:#a3a8b8;font-weight:500}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:60;width:calc(100% - 32px);max-width:398px;margin:0;padding:12px 16px 12px 14px;border-radius:16px;font-size:14px;line-height:1.45;text-align:left;pointer-events:none;opacity:0;transform:translate(-50%,-24px);transition:transform .25s ease,opacity .25s ease;box-shadow:0 12px 30px rgba(0,0,0,.45);background:#1b1d25;border:1px solid #2e3140;border-left:4px solid #8a8fa0;color:#dde0ea}.toast.ok{background:#12231b;border-left-color:#30a46c;color:#bfe9cf}.toast.warn{background:#2a2412;border-left-color:#f5c451;color:#ffe9a8}.toast.on{opacity:1;transform:translate(-50%,0)}@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
<div id=toast class=toast role=status aria-live=polite></div>
<div id=wrap>
<div class=glow></div>
<div class=view>
  <p class=eyebrow>&nbsp;</p>
  <h1>The TV is off</h1>
  <p class=sub>Turn it on with the button below or with its own remote. The remote opens by itself when the TV is on.</p>
  <p id=name class="pill hide"><span>TV &middot; </span><b id=tv></b></p>
  <div class=actions>
    <button class=pri id=on>Turn on the TV</button>
    <button class=sec id=retry>Check again</button>
    <button class=lnk id=change>Use a different TV</button>
  </div>
</div>
</div>
<script>
var A=window.CYTV_APP||null;
function $(i){return document.getElementById(i)}
/* every message is a toast that slides in at the top over the page and goes away by itself; it never takes room in the page (the same as the start page) */
var toastT=0;
function toast(s,k,ms){var e=$('toast');clearTimeout(toastT);e.textContent=s;e.setAttribute('role',k==='warn'?'alert':'status');e.className='toast '+(k||'info');void e.offsetWidth;e.className='toast '+(k||'info')+' on';toastT=setTimeout(function(){e.className='toast '+(k||'info')},ms||(k==='warn'?10000:3500))}
function call(n){
  try{return A&&typeof A[n]==='function'?A[n]():null}catch(e){return null}
}
$('on').onclick=function(){
  if(!call('wake')){toast('Pair this phone with the TV first, then it can turn the TV on. Tap Use a different TV to set up.','warn');return}
  clearTimeout(toastT);$('toast').className='toast';
  $('on').textContent='Waking the TV…';
  $('on').disabled=true;
};
$('retry').onclick=function(){call('open')};
$('change').onclick=function(){call('start')};
/* the TV may be turning on by another means: open the remote as soon as it answers */
setInterval(function(){if(call('up'))call('open')},3000);
/* the native side says when the wake packet got nothing */
window.cytvOff=function(m){$('on').textContent='Turn on the TV';$('on').disabled=false;toast(m||'The TV did not answer.','warn')};
window.cytvName=function(n){if(!n)return;$('tv').textContent=n;$('name').className='pill'};
(function(){var n=call('name');if(n){$('tv').textContent=n;$('name').className='pill'}})();
</script>
</html>
