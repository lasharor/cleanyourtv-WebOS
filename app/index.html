#view {

  left: 0;
  top: var(--view-top);

  height: calc(1080px - var(--view-top));

}

  position: absolute;

}
#dock {

#grid {

  gap: var(--gap-y) var(--gap-x);
}
/* an overlay grid: hidden until the focus moves down into it, then dark layer + grid over the screen above the dock */
[data-grid="overlay"] #grid {
  z-index: 3;
  opacity: 0;
  pointer-events: none;
  transition: opacity calc(0.22s * var(--spd)) linear;
}
[data-grid="overlay"].grid-open #grid {
  opacity: 1;
  pointer-events: auto;
}
[data-grid="overlay"] #scroll::before,
[data-grid="push"] #scroll::before {
  content: "";
  position: absolute;
  left: 0;
  top: -1600px;
  width: 1920px;
  height: 4400px;

}

[data-grid="push"].grid-open #scroll::before {
  opacity: 1;
}
/* push: the grid sits under the dock; focusing it scrolls the dock up and fades the grid in */
[data-grid="push"] #grid {
  z-index: 3;
  opacity: 0;
  pointer-events: none;
  transition: opacity calc(0.25s * var(--spd)) linear;
}

  pointer-events: auto;
}

   half gaps at the ends cancel out. */
[data-galign="center"] #grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  margin-left: calc(var(--gap-x) / -2);
  width: calc(var(--grid-w) + var(--gap-x));
}
/* the grid's own gap (#grid) would add to the margins where flex gap works: off for the centred row */
[data-galign="center"] #grid {
  gap: 0;
}
[data-galign="center"] #grid .tile {
  width: var(--tile-w);
  margin: 0 calc(var(--gap-x) / 2) var(--gap-y);
}
.tile::after {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  right: 0;
  bottom: 0;
  border-radius: inherit;

}

.tile {
  --c: 74, 84, 112;
  --b: 20, 22, 27;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  will-change: transform;
  background: rgb(var(--b));
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, var(--tile-border));

}
.snap .tile,

.tile.fill {

}
.tile.press {
  transform: scale(0.96) !important;
  transition-duration: calc(0.06s * var(--spd));
}
.tile.moving {
  z-index: 10;
  transform: scale(1.08);
  box-shadow: 0 28px 42px rgba(0, 0, 0, 0.75);
}
.tile.moving::before {

}
.tile.launching {
  opacity: 0.82;
}
.tile.disintegrate-prep {
  transform: scale(0.92) !important;
  transition: transform calc(0.06s * var(--spd)) ease-out !important;
}
.tile.disintegrate {
  pointer-events: none !important;
  will-change: transform, opacity;
  transition:
    transform calc(0.38s * var(--spd)) cubic-bezier(0.2, 0.8, 0.2, 1),

  overflow: visible;
}
.disintegrate-p {
  position: absolute;
  pointer-events: none;
  border-radius: 50%;
  opacity: 1;
  will-change: transform, opacity;
  transform: translate3d(0, 0, 0) scale(1);
  transition:
    transform calc(0.4s * var(--spd)) cubic-bezier(0.1, 0.85, 0.25, 1),

}
.tile img {
  object-fit: contain;
}
.tile svg {

}
.tile .t {

  padding: 12px;

}
/* The focus ring is a pseudo-element with its own radius: Chromium before 94 draws an outline as a rectangle, not around rounded corners. */
.tile.f {

}
.tile.f::before {
  content: "";
  position: absolute;
  pointer-events: none;
  left: calc(-1 * (var(--ring-off) + var(--ring-w)));
  top: calc(-1 * (var(--ring-off) + var(--ring-w)));
  right: calc(-1 * (var(--ring-off) + var(--ring-w)));
  bottom: calc(-1 * (var(--ring-off) + var(--ring-w)));

  border-radius: calc(var(--tile-r) + var(--ring-off) + var(--ring-w));
}

}

.tile.fill.f::before {
  display: none;
}
.tile.fill.f {
  box-shadow:
    0 0 0 var(--ring-w) var(--focus),
    0 24px 36px rgba(0, 0, 0, 0.6);
}
#dock .tile {
  width: var(--dock-w);
  height: var(--dock-h);
  border-radius: var(--dock-rad);
  /* below 1 the wallpaper shows through the tile (dock.tileAlpha); a tile that fills with app art stays opaque */
  background: rgba(var(--b), var(--dock-tile-alpha));
}
/* frosted glass: a tint over the whole tile and its icon (dock.tileFrost), so the loud brand colour is calmed
   without a floating square (tile and icon dim together); the focused tile keeps its ring and full colour.
   dock.tileFrostColor sets the tint (--dock-frost-rgb): light for a glassy frost, dark to deepen. */
#dock .tile:not(.f)::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  right: 0;
  bottom: 0;
  border-radius: inherit;
  pointer-events: none;

}

}
.slab {

}

.tile .rd {
  position: absolute;

  right: 14px;

}

}
/* Wallpapers (wall.js): two photo layers that cross-fade and a darkening layer, behind everything; the theme's own background steps back */
.wp,
.wpd {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  opacity: 0;
  pointer-events: none;
}

  background-size: cover;
  background-position: center;
  transition: opacity calc(1.2s * var(--spd)) linear;
}
.wp.on,
.wpon .wpd {
  opacity: 1;
}

  background-image: none;
}

  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  z-index: 5;
  pointer-events: none;
}
.card {

.card[data-align="left"] {
  text-align: start;
}
.card[data-align="center"] {
  text-align: center;
}
.card[data-align="right"] {
  text-align: end;
}
/* while the app grid is open, only the cards the theme keeps (grid: keep) stay */
.grid-open .card:not(.keep) {

}

.card-greeting .l2 {

}

  font-size: 1.25em;
}

.card-template {

.card-weather {

}

.wx-none {
  margin-top: 6px;
  font-size: calc(24px * var(--fs));
  color: var(--ink2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.wx-days {
  display: flex;
  margin-top: 16px;
  font-size: calc(22px * var(--fs));
}
[data-align="right"] .wx-days {
  justify-content: flex-end;
}
.wx-days > div {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 96px;
}
.wx-days > div + div {
  margin-left: 18px;
}
.wx-days svg {
  width: 34px;
  height: 34px;
  margin: 6px 0;
}
.wx-days small {
  color: var(--ink2);
  font-size: 1em;
}
/* a list keeps its height to its rows (at most the slot's), and its text starts on the reading side */
.card-ha-entities {
  height: auto !important;
  max-height: var(--ch);
  text-align: start !important;
}
/* Home Assistant cards: an entity (icon, state, name) on a glass panel, a list of entities, a camera picture */
.card-ha-entity,
.card-ha-entities {
  padding: 16px 24px;
  border-radius: calc(var(--tile-r) * 1.2);
  background: var(--pill-bg);
  box-shadow: inset 0 0 0 1px var(--pill-ring);
  color: var(--ink);
}
.card-ha-entity {
  display: flex;
  align-items: center;
  transition:
    transform calc(0.15s * var(--spd)) ease-out,
    background-color calc(0.15s * var(--spd)) linear;
}
.card-ha-entity.on .ha-i {
  color: var(--acc);
}
.card-ha-entity.f {
  background: var(--acc);
  color: var(--acc-ink);
  transform: scale(1.04);
}
.card-ha-entity.f .ha-i,
.card-ha-entity.f .ha-n {
  color: inherit;
}
.ha-i svg {
  display: block;
  width: 48px;
  height: 48px;
  margin-right: 20px;
}
.ha-tx {
  flex: 1;
  min-width: 0;
  text-align: start;
}
.ha-s {
  font-size: calc(40px * var(--fs));
  font-weight: 600;
  line-height: 1.1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ha-n {
  margin-top: 4px;
  font-size: calc(22px * var(--fs));
  color: var(--ink2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ha-title {
  font-size: calc(26px * var(--fs));
  font-weight: 700;
  margin-bottom: 8px;
}
.ha-row {
  display: flex;
  align-items: center;
  padding: 8px 0;
  font-size: calc(24px * var(--fs));
}
.ha-row + .ha-row {
  border-top: 1px solid rgba(255, 255, 255, 0.08);
}
.ha-ri svg {
  display: block;
  width: 28px;
  height: 28px;
  margin-right: 14px;
  color: var(--ink2);
}
.ha-rn {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ha-rs {
  margin-left: 16px;
  font-weight: 600;
  white-space: nowrap;
}
.card-ha-camera {
  border-radius: calc(var(--tile-r) * 1.2);
  background: rgba(0, 0, 0, 0.35);
}
.card-ha-camera img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.card-ha-camera .ha-n {
  padding: 22px 26px;
}
/* the Home Assistant weather card: now on the left, the forecast in columns on the right */
.card-ha-weather {
  display: flex;
  align-items: center;
  color: var(--ink);
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
}
.hw-now {
  flex: none;
  min-width: 250px;
  text-align: start;
}
.hw-top {
  display: flex;
  align-items: center;
}
.hw-t {
  font-size: calc(76px * var(--fs));
  font-weight: 600;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.hw-c {
  margin-top: 10px;
  font-size: calc(26px * var(--fs));
  font-weight: 600;
  white-space: nowrap;
}
.hw-f,
.hw-msg {
  margin-top: 4px;
  font-size: calc(22px * var(--fs));
  color: rgba(255, 255, 255, 0.72);
  white-space: nowrap;
}
.hw-fc {
  flex: 1;
  display: flex;
  justify-content: flex-end;
  margin-left: 28px;
  padding-left: 24px;
  border-left: 1px solid rgba(255, 255, 255, 0.16);
}
.hw-fc > div {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 84px;
  font-size: calc(22px * var(--fs));
}
.hw-fc > div + div {
  margin-left: 10px;
}
.hw-d {
  color: rgba(255, 255, 255, 0.75);
  text-transform: capitalize;
  white-space: nowrap;
}
.hw-fc svg {
  width: 38px;
  height: 38px;
  margin: 8px 0;
}
.hw-fc b {
  font-weight: 600;
}
.hw-fc small {
  font-size: 0.9em;
  color: rgba(255, 255, 255, 0.62);
}
.hw-fc i {
  margin-top: 2px;
  font-style: normal;
  font-size: 0.82em;
  color: #9fd3ff;
}
/* OLED care (cards.js): dimmed after three minutes without a key; the slow shift of the whole layer is not animated */
.cards-idle .card {
  opacity: 0.45;
  transition: opacity 2s linear;
}
/* ---------- scenes and the glass clock (scenes.js; after couch-tv, MIT). Layers: photo, shade, glass clock, the scenery cut out of
   the photo, the late-evening dimming; then the rest of Home. Only opacity is animated. ---------- */
@font-face {
  font-family: "CYTV Clock";
  font-weight: 300;
  font-display: block;
  src: url(antonio.woff2) format("woff2");
}
#scenes,
#gsolo {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  pointer-events: none;
}
body.scenes-on {
  background-image: none;
}
/* the scenes take the place of the theme's wallpaper and of Wallpapers */
.scenes-on .wp,
.scenes-on .wpd {
  display: none;
}
.scene {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  display: none;
  opacity: 0;
  transition: opacity calc(1.6s * var(--spd)) ease-in-out;
  will-change: opacity;
}
.scene.ready {
  display: block;
}
.scene.on {
  opacity: 1;
}
.scene .sbg,
.scene .fg,
.scene .shade,
.scene .late {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
}
.scene .sbg,
.scene .fg {
  object-fit: cover;
}
/* after 10 pm the scene dims a little (an overlay, no filter) */
.scene .late {
  background: #000;
  opacity: 0;
  transition: opacity 2s linear;
}
.late .scene .late {
  opacity: 0.28;
}
.gclock {
  position: absolute;
  left: 0;
  right: 0;
  top: 150px;
  text-align: center;
  white-space: nowrap;
  font-family: "CYTV Clock", "Arial Narrow", sans-serif;
  font-weight: 300;
  font-size: 400px;
  line-height: 0.82;
  letter-spacing: -0.02em;
}
.gclock .fill {
  display: block;
  padding: 0.2em 0;
  margin: -0.2em 0;
  color: transparent;
  -webkit-background-clip: text;
  background-clip: text;
  background-size: 1920px 1080px;
  background-repeat: no-repeat;
}
.gclock .rim,
.gclock .sheen {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  bottom: 0;
}
.gclock .rim {
  color: rgba(255, 255, 255, 0.1);
  -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.55);
}
.gclock .sheen {
  color: transparent;
  -webkit-background-clip: text;
  background-clip: text;
  background-image: linear-gradient(
    160deg,
    rgba(255, 255, 255, 0.55) 0%,
    rgba(255, 255, 255, 0) 38%,
    rgba(255, 255, 255, 0) 70%,
    rgba(255, 255, 255, 0.22) 100%
  );
}
/* without scenes: a white frosted fill */
#gsolo .gclock .fill {
  background-image: linear-gradient(170deg, rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0.12));
}
/* the scenes, as in couch-tv: Night pink glass behind the peak */
.s-night .gclock .fill {
  filter: brightness(1.15) saturate(1.2);
  opacity: 0.9;
}
.s-night .gclock .rim {
  color: rgba(255, 200, 215, 0.06);
  -webkit-text-stroke-color: rgba(255, 215, 225, 0.5);
}
/* Golden hour: a little smaller, low enough for the volcano's tip to rise into the digits */
.s-golden .gclock {
  top: 152px;
  font-size: 390px;
}
/* Waterline: the clock on the water; under the line a soft reflection */
.s-water .shade {
  background: linear-gradient(180deg, rgba(0, 12, 24, 0.42) 0%, rgba(0, 12, 24, 0.12) 40%, rgba(0, 0, 0, 0) 52%, rgba(0, 20, 40, 0.5) 100%);
}
.s-water .gclock {
  top: 268px;
  font-size: 420px;
}
.s-water .gclock.under {
  opacity: 0.7;
  transform: translateX(5px);
}
.s-water .gclock.under .rim {
  -webkit-text-stroke-color: rgba(170, 240, 255, 0.5);
}
/* Fog: a big dark clock on the left, sinking into the misty hills */
.s-fog .gclock {
  left: 96px;
  right: auto;
  top: 172px;
  font-size: 470px;
  text-align: left;
}
.s-fog .gclock .fill {
  filter: brightness(0.46) saturate(0.8) contrast(1.1);
  opacity: 0.8;
}
.s-fog .gclock .rim {
  color: transparent;
  -webkit-text-stroke-color: rgba(255, 255, 255, 0.6);
}
.s-fog .gclock .sheen {
  display: none;
}
/* Dawn: warm light at the top, the clock low enough for the ridges to cross it */
.s-dawn .shade {
  background: linear-gradient(180deg, rgba(50, 28, 12, 0.42) 0%, rgba(50, 28, 12, 0) 55%);
}
.s-dawn .gclock {
  top: 230px;
}
/* Custom theme scenes: clock and date position come from CSS variables set per-scene by scenes.js */
.s-custom .gclock {
  top: var(--scene-clock-top, 150px);
  font-size: var(--scene-clock-size, 400px);
}
.s-custom .gclock.under {
  opacity: 0.7;
  transform: translateX(5px);
}
[data-cstyle="glass"].scene-custom #clock {
  top: var(--scene-date-top, 96px);
}
/* with the glass clock the text clock steps aside: only the date stays, centred above the glass clock (each scene places it) */
[data-cstyle="glass"] #time,
[data-cstyle="glass"] #greet {
  display: none;
}
[data-cstyle="glass"] #clock {
  left: 0;
  right: 0;
  top: 96px;
  bottom: auto;
  transform: none;
  justify-content: center;
  height: auto;
}
[data-cstyle="glass"] #date {
  margin: 0;
  padding: 0;
  font-size: calc(34px * var(--date-s));
  font-weight: 500;
  color: #fff;
  text-shadow: 0 2px 18px rgba(0, 0, 0, 0.25);
  white-space: nowrap;
  transition: opacity calc(0.6s * var(--spd)) ease-in-out;
}
[data-cstyle="glass"].scene-night #date {
  color: rgba(255, 232, 238, 0.92);
}
[data-cstyle="glass"].scene-golden #clock {
  top: 106px;
}
[data-cstyle="glass"].scene-water #clock {
  top: 216px;
}
[data-cstyle="glass"].scene-dawn #clock {
  top: 176px;
}
[data-cstyle="glass"].scene-fog #clock {
  left: 104px;
  right: auto;
  top: 116px;
  justify-content: flex-start;
}
[data-cstyle="glass"].scene-fog #date {
  color: #16201d;
  text-shadow: none;
}
/* the light misty sky of Fog: the top buttons turn dark so they stay visible */
.scenes-on.scene-fog .pill:not(.f) {
  background: rgba(22, 32, 29, 0.14);
  box-shadow: inset 0 0 0 1px rgba(22, 32, 29, 0.28);
  color: #16201d;
}
/* custom scenes with darkSky true: same dark pill treatment for bright-sky scenes */
.scenes-on.scene-dark-sky .pill:not(.f) {
  background: rgba(22, 32, 29, 0.14);
  box-shadow: inset 0 0 0 1px rgba(22, 32, 29, 0.28);
  color: #16201d;
}
/* glass cards (cards.style): scenes.js puts the blurred scene behind each one; this is the frame, and the panel without scenes */
[data-cards="glass"] .card-weather,
[data-cards="glass"] .card-ha-weather,
[data-cards="glass"] .card-ha-entity,
[data-cards="glass"] .card-ha-entities,
[data-cards="glass"] .card-ha-camera {
  padding: 22px 28px;
  border-radius: 30px;
  background-color: rgba(30, 20, 28, 0.34);
  box-shadow:
    inset 0 0 0 1px rgba(255, 220, 230, 0.2),
    inset 0 1px 0 rgba(255, 230, 238, 0.22),
    0 24px 60px rgba(0, 0, 0, 0.28);
  text-shadow: 0 1px 8px rgba(0, 0, 0, 0.22);
  color: #fff;
}
[data-cards="glass"] .card-ha-camera {
  padding: 0;
}
[data-cards="glass"] .card-ha-entity.f {
  background-image: none !important;
  background-color: var(--acc);
  color: var(--acc-ink);
  text-shadow: none;
}
/* the app grid over frosted glass (scenes.js #sglass) instead of the dark layer, with scenes and glass cards */
#sglass {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  z-index: 1;
  opacity: 0;
  pointer-events: none;
  background-size:
    100% 100%,
    1920px 1080px;
  transition: opacity calc(0.25s * var(--spd)) linear;
}
.scenes-on[data-cards="glass"].grid-open #sglass {
  opacity: 1;
}
.scenes-on[data-cards="glass"] #scroll::before {
  display: none;
}
/* menus */
#ov {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  z-index: 30;
  background: var(--menu-bg);
  display: flex;
  align-items: center;
  justify-content: center;
}
#ov .panel {
  width: 760px;
  display: flex;
  flex-direction: column;
}
#ov .panel > * + * {
  margin-top: 12px;
}
#ov h2 {
  font-size: 46px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.row {
  display: flex;
  align-items: center;
  height: 84px;
  padding: 0 34px;
  border-radius: var(--row-r);
  font-size: calc(30px * var(--fs));
  font-weight: 500;
  background: var(--panel2);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
}
.row > * + * {
  margin-left: 22px;
}
.row svg {
  width: 34px;
  height: 34px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.row .lb {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.row .st {
  font-size: 22px;
  opacity: 0.65;
  /* a long translation (German, Russian) is cut with "...", not wrapped out of the row; the label keeps at least 40% */
  flex: 0 1 auto;
  min-width: 0;
  max-width: 60%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.row.dim {
  opacity: 0.6;
}
.row.f {
  background: var(--acc);
  color: var(--acc-ink);
  opacity: 1;
}
.more {
  height: 22px;
  text-align: center;
  font-size: 20px;
  color: var(--ink2);
}
#ov .msep {
  height: 6px;
}
/* a menu with pictures (Customise > Theme): the list moves right, the focused row's picture and description are on the left */
#ov.ws {
  justify-content: flex-end;
  padding-right: 150px;
}
#ovside {
  position: absolute;
  left: 150px;
  top: 190px;
  width: 820px;
  z-index: 31;
}
#ovside .pvbox {
  width: 820px;
  height: 461px;
  border-radius: var(--row-r);
  overflow: hidden;
  background: var(--panel2);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
}
#ovside img {
  width: 820px;
  height: 461px;
  object-fit: cover;
  display: block;
}
#ovside .pt {
  margin-top: 30px;
  font-size: 40px;
  font-weight: 700;
  letter-spacing: -0.02em;
}
#ovside .pd {
  margin-top: 12px;
  font-size: 26px;
  line-height: 1.35;
  color: var(--ink2);
  white-space: pre-line;
  max-height: 210px;
  overflow: hidden;
}
/* a note in a menu (how to hide an app, the hidden gestures): text only, the focus skips it */
#ov .mnote {
  padding: 6px 34px 0;
  font-size: calc(24px * var(--fs));
  line-height: 1.35;
  color: var(--ink2);
  white-space: normal;
}
/* Live TV (inside the launcher). The channel banner, the guide and its menus take the theme's colours (--panel, --acc, ...);
   the error and setup cards keep their own. */
#lv {
  --ink2: rgba(245, 246, 248, 0.76);
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  z-index: 60;
  background: #000;
  display: none;
}
#lv.on {
  display: block;
}
#lv-stage,
#lv-stage video {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  background: #000;
}
#lv .layer {
  position: absolute;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s linear;
}
#lv .layer.on {
  opacity: 1;
}
#lv-guide.on,
#lv-filter.on,
#lv-menu.on {
  pointer-events: auto; /* the pointer works on them while they are open */
}
/* channel banner: a floating panel in the launcher's style */
#lv-osd {
  left: 96px;
  right: 96px;
  bottom: 64px;
  height: 232px;
  border-radius: 44px;
  padding: 0 44px 0 36px;
  display: flex;
  align-items: center;
  background: var(--panel);
  box-shadow:
    inset 0 0 0 1px rgba(255, 255, 255, 0.1),
    0 30px 60px rgba(0, 0, 0, 0.5);
}
/* channel banner: a floating panel in the launcher's style */
#lv-osd > * + * {
  margin-left: 32px;
}
#lv-osd .logo {
  width: 150px;
  height: 150px;
  border-radius: 34px;
  background: var(--panel2);
  object-fit: contain;
  flex: none;
}
#lv-osd .num {
  font-size: 92px;
  font-weight: 700;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  min-width: 120px;
  flex: none;
}
#lv-osd .info {
  flex: 1;
  min-width: 0;
}
#lv-osd .name {
  font-size: 50px;
  font-weight: 700;
  letter-spacing: -0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#lv-osd .now {
  font-size: 32px;
  margin-top: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#lv-osd .next {
  font-size: 26px;
  color: var(--ink2);
  margin-top: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pbar {
  height: 8px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.18);
  overflow: hidden;
}
.pbar i {
  display: block;
  height: 100%;
  border-radius: 4px;
  background: currentColor;
  width: 0;
}
#lv-osd .pbar {
  margin-top: 16px;
  color: var(--acc);
}
#lv-numin {
  right: 96px;
  top: 64px;
  font-size: 88px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
#lv-msg {
  left: 0;
  right: 0;
  top: 0;
  bottom: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 34px;
}
#lv-msg > * + * {
  margin-top: 18px;
}
#lv-msg.on {
  background: rgba(0, 0, 0, 0.62);
}
#lv-msg b {
  font-size: 56px;
  letter-spacing: -0.02em;
}
#lv-msg .small {
  font-size: 26px;
  color: var(--ink2);
  max-width: 1100px;
}
#lv.gd #lv-spin,
#lv.gd #lv-tune {
  visibility: hidden; /* the guide list covers the middle of the screen */
}
#lv-tune {
  left: 0;
  right: 0;
  top: 590px;
  text-align: center;
  font-size: 30px;
  color: var(--ink2);
}
#lv-toast {
  left: 50%;
  bottom: 64px;
  transform: translateX(-50%);
  padding: 16px 34px;
  border-radius: 30px;
  background: rgba(12, 13, 17, 0.94);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
  font-size: 28px;
  white-space: nowrap;
}
#lv-stats {
  left: 48px;
  top: 40px;
  padding: 14px 22px;
  border-radius: 24px;
  background: rgba(0, 0, 0, 0.65);
  font: 24px/1.35 monospace;
  white-space: pre;
  color: #cfe;
}
#lv-menu,
#lv-filter {
  right: 96px;
  top: 196px;
  width: 640px;
  padding: 30px 28px 22px;
  border-radius: 40px;
  background: var(--panel);
  box-shadow:
    inset 0 0 0 1px rgba(255, 255, 255, 0.1),
    0 30px 60px rgba(0, 0, 0, 0.5);
}
#lv-menu h3,

function disintegrateApp(a, done) {
  var el = tiles[a.id];
  if (!el || !el.parentNode) {
    if (done) done();
    return;
  }
  var rect = el.getBoundingClientRect();
  var col = el.style.getPropertyValue('--c') || '120, 140, 180';

  el.classList.add('disintegrate-prep');

  setTimeout(function () {
    el.classList.remove('disintegrate-prep');
    el.classList.add('disintegrate');

    var box = document.createElement('div');
    box.className = 'disintegrate-box';
    box.style.left = Math.round(rect.left) + 'px';
    box.style.top = Math.round(rect.top) + 'px';
    box.style.width = Math.round(rect.width) + 'px';
    box.style.height = Math.round(rect.height) + 'px';
    document.body.appendChild(box);

    var N = 10;
    var particles = [];
    for (var i = 0; i < N; i++) {
      var p = document.createElement('span');
      p.className = 'disintegrate-p';
      var size = Math.floor(7 + Math.random() * 6);
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.background = i % 2 === 0 ? 'rgb(' + col + ')' : 'rgba(255, 255, 255, 0.85)';

      var startX = rect.width / 2 - size / 2;
      var startY = rect.height / 2 - size / 2;
      p.style.left = Math.round(startX) + 'px';
      p.style.top = Math.round(startY) + 'px';
      box.appendChild(p);

      var angle = (i / N) * 2 * Math.PI + (Math.random() - 0.5) * 0.4;
      var dist = Math.round(65 + Math.random() * 65);
      var dx = Math.round(Math.cos(angle) * dist);
      var dy = Math.round(Math.sin(angle) * dist);
      particles.push({ el: p, dx: dx, dy: dy });
    }

    /* force layout reflow so the browser commits the initial translate3d(0, 0, 0) */
    void box.offsetHeight;

    setTimeout(function () {
      for (var j = 0; j < particles.length; j++) {
        var pt = particles[j];
        pt.el.style.transform = 'translate3d(' + pt.dx + 'px, ' + pt.dy + 'px, 0) scale(0)';
        pt.el.style.opacity = '0';
      }
    }, 20);

    setTimeout(function () {
      box.remove();
      if (el && el.parentNode) el.remove();
      delete tiles[a.id];
      if (done) done();
    }, 400);
  }, 50);
}

    ord = [];

    gridApp = gi[gpos],

function handleMoveKey(k) {
  if (!moving) return;
  var di = dockIds(),
    dpos = di.indexOf(moving),
    gi = gridAppIds(),
    cols = TH.cols || 4,
    d;
  if (dpos >= 0) {
    if (k === 37) {
      if (dpos > 0) {
        d = di.slice();
        d[dpos] = d[dpos - 1];
        d[dpos - 1] = moving;
        cfg.dock = d;
        rebuild(true);
      }
    } else if (k === 39) {
      if (dpos < di.length - 1) {
        d = di.slice();
        d[dpos] = d[dpos + 1];
        d[dpos + 1] = moving;
        cfg.dock = d;
        rebuild(true);
      } else {
        if (gi.length > 0) swapDockAndGrid(dpos, 0);
      }
    } else if (k === 40) {
      var targetGpos = Math.min(dpos, Math.min(cols - 1, gi.length - 1));
      if (targetGpos >= 0) {
        swapDockAndGrid(dpos, targetGpos);
      } else if (di.length > 1) {
        cfg.sort = 'custom';
        cfg.dock = di.filter(function (x) {
          return x !== moving;

        cfg.order = [moving];

      swapDockAndGrid(di.length - 1, 0);

    if (gpos >= 0 && gpos < gi.length - 1) {

        cfg.dock = di.concat(moving);
        cfg.order = ord;
        rebuild(true);
      } else {

/* Pointer focus follows real pointer movement only: a tile sliding under a still cursor, a cursor jitter when
   the remote is picked up, or a pointer move right after a button press must not steal the focus. */
document.addEventListener('mousemove', function (ev) {
  if (stack.length || LIVE.on || Date.now() - lastKey < 1500) return;
  if (lastMX < 0) {
    lastMX = ev.clientX;
    lastMY = ev.clientY;
    return;
  }
  if (Math.abs(ev.clientX - lastMX) + Math.abs(ev.clientY - lastMY) < 24) return;
  lastMX = ev.clientX;
  lastMY = ev.clientY;
  var el = ev.target.closest ? ev.target.closest('.tile,.pill') : null,
    p = el && posOf(el);
  if (p && !(p[0] === r && p[1] === c)) setFocus(p[0], p[1]);

document.addEventListener('keydown', function (e) {
  var k = e.keyCode;
  /* a right-to-left layout: Left moves to what is on the left, which is the next tile in the row (Live TV keeps left-to-right) */
  if (rtl() && !LIVE.on && (k === 37 || k === 39)) k = 76 - k;
  lastKey = Date.now();
  if (LIVE.on) {
    LIVE.key(e);
    return;
  }

    if (k === 13 || k === 461 || k === 27 || k === 8) {
      stopMoving();
      e.preventDefault();
      return;

    if (k >= 37 && k <= 40) {
      handleMoveKey(k);
      e.preventDefault();
      return;
    }

    if (k === 13) {
      if (downEnter && Date.now() - lastEnter < 1500) {
        lastEnter = Date.now();
        e.preventDefault();
        return;
      }
      downEnter = true;
      lastEnter = Date.now();
      swallowUp = true;
      /* a row with a hold action (an input in the Inputs list) opens on release; held, it shows its options */
      var mm = stack[stack.length - 1],
        it = mm.items[mm.idx];

        held = false;

        downT = setTimeout(function () {

          it.hold();

        return;

    return;

    return;

  function fetchVisible() {

        ids = L.list

  /* search: the TV's own keyboard types into an input; the list follows what is typed */
  function startSearch() {

  /* filters */
  function fvals(k) {
    return [''].concat(fac[k]);
  }
  function filterRows() {
    return [
      { k: 'cc', label: t('Country'), val: F.cc ? cname(F.cc) : t('All') },
      { k: 'lang', label: t('Language'), val: F.lang || t('All') },
      { k: 'q', label: t('Quality'), val: F.q || t('All') },
      { k: 'clear', label: t('Clear filters'), val: '' },
    ];
  }
  function drawFilter() {
    var r = filterRows(),
      h = '<h3>' + lesc(t('Filters')) + '</h3>';
    for (var i = 0; i < r.length; i++)
      h +=
        '<div class="mrow' +
        (i === FP.i ? ' f' : '') +
        '" data-i="' +
        i +
        '"><div class="ml">' +
        lesc(r[i].label) +
        '</div><div class="mv">' +
        (r[i].k === 'clear' ? '' : '‹ ') +
        lesc(r[i].val) +
        (r[i].k === 'clear' ? '' : ' ›') +
        '</div></div>';
    setHtml($('lv-filter'), h);
  }
  function stepFilter(k, d) {
    var v = fvals(k),
      i = v.indexOf(F[k]);
    i = (i + d + v.length) % v.length;
    F[k] = v[i];
    relist();
    drawFilter();
  }
  function filterKey(k) {
    if (k === 38) {
      if (FP.i > 0) FP.i--;
    } else if (k === 40) {
      if (FP.i < 3) FP.i++;
    } else if (k === 37 || k === 39) {
      var r = filterRows()[FP.i];
      if (r.k !== 'clear') stepFilter(r.k, k === 37 ? -1 : 1);
      return;
    } else if (k === 13) {
      var r2 = filterRows()[FP.i];
      if (r2.k === 'clear') {
        F = { cc: '', lang: '', q: '' };
        relist();
      } else FP.open = false;
    } else if (k === 405 || k === 461 || k === 27 || k === 8) {
      FP.open = false;
    }
    if (!FP.open) {
      layer('lv-filter', false);
      drawList();
      return;
    }
    drawFilter();
  }

  /* the player menu (Yellow while watching) */
  function menuItems() {
    var c = byNum[cur],
      it = [
        {
          label: t('Favourite'),

      streams.forEach(function (s, i) {
        it.push({

            pickStream(i);
          },
        });
      });
    it.push({
      label: t('Statistics'),
      sub: t(stats ? 'On' : 'Off'),
      fn: function () {
        setStats(!stats);
        drawMenu();
      },
    });
    it.push({
      label: t('Close'),
      sub: '',
      fn: function () {
        M.open = false;
        layer('lv-menu', false);
      },

    return it;
  }
  function drawMenu() {
    M.items = menuItems();
    if (M.i >= M.items.length) M.i = M.items.length - 1;
    var h = '<h3>' + lesc(byNum[cur].name) + '</h3>';
    for (var i = 0; i < M.items.length; i++)
      h +=
        '<div class="mrow' +

        i +

  }
  function openMenu() {
    M.open = true;

  }
  function menuKey(k) {
    if (k === 38) {
      if (M.i > 0) M.i--;
    } else if (k === 40) {
      if (M.i < M.items.length - 1) M.i++;
    } else if (k === 13) {
      M.items[M.i].fn();
      return;
    } else if (k === 405 || k === 461 || k === 27 || k === 8) {
      M.open = false;
      layer('lv-menu', false);
      return;

  /* statistics (Blue while watching): what the TV tells a web page about the picture */
  function statsText() {
    var v = video;
    if (!v) return '';
    var q = v.getVideoPlaybackQuality ? v.getVideoPlaybackQuality() : null,
      ahead = 0;
    try {
      if (v.buffered && v.buffered.length) ahead = v.buffered.end(v.buffered.length - 1) - v.currentTime;
    } catch (e) {}
    return (
      (v.videoWidth ? v.videoWidth + '×' + v.videoHeight : 'no picture') +
      '\n' +
      t('buffer') +
      ' ' +
      ahead.toFixed(1) +
      ' s\n' +
      (q ? t('frames') + ' ' + q.totalVideoFrames + ', ' + t('dropped') + ' ' + q.droppedVideoFrames + '\n' : '') +
      t('Stream') +
      ' ' +
      (si + 1) +
      '/' +
      streams.length +
      (reloads ? '  (' + t('reloaded') + ')' : '')
    );
  }
  function setStats(on) {
    stats = on;
    clearInterval(statsT);
    layer('lv-stats', on);
    if (on) {
      $('lv-stats').textContent = statsText();
      statsT = setInterval(function () {

  function digit(d) {
    numBuf += d;
    if (numBuf.length > 5) numBuf = numBuf.slice(-5);
    $('lv-numin').textContent = numBuf;
    layer('lv-numin', true);
    clearTimeout(numT);
    numT = setTimeout(function () {
      var n = parseInt(numBuf, 10);

  function setup() {
    api('/api/live/pair', {}).then(function (p) {
      msg(
        '<b>' +
          t('Set up Live TV') +
          '</b><div>' +
          t('Open this address on your phone or computer:') +
          '</div><b>' +
          lesc(p.url) +
          '</b><div>' +
          t('and enter this code:') +
          '</div><b>' +
          lesc(p.code) +
          '</b><div class="small">' +
          t('Then paste your M3U playlist address. This page closes by itself.') +
          '</div>' +
          '<div class="small">' +
          t('This plays your own playlist, not the TV\u2019s tuner. For antenna or cable, add a TV button in Customise.') +
          '</div>'
      );
      clearInterval(setupT);
      setupT = setInterval(function () {
        if (!o.on) {
          clearInterval(setupT);
          return;
        }
        api('/api/live/status').then(function (s) {
          if (s.configured) {
            clearInterval(setupT);
            boot();
          }
        });
      }, 2500);
    });
  }
  function facets() {
    function top(k) {
      var n = {};
      chans.forEach(function (c) {
        if (c[k]) n[c[k]] = (n[c[k]] || 0) + 1;
      });
      return Object.keys(n)
        .sort(function (a, b) {
          return n[b] - n[a] || (a < b ? -1 : 1);
        })
        .slice(0, 40);
    }
    fac = {
      cc: top('cc'),
      lang: top('lang'),
      q: ['SD', 'HD', 'FHD', '4K'].filter(function (q) {
        return chans.some(function (c) {
          return c.q === q;
        });
      }),
    };
  }
  function boot() {
    msg('<div>' + t('Loading channels...') + '</div>');
    api('/api/live/status')
      .then(function (s) {
        if (!s.configured) {
          setup();
          return;
        }
        var tries = 0;
        (function load() {
          if (!o.on) return;
          api('/api/live/channels').then(function (x) {
            if (!x.channels.length) {
              if (++tries > 40) {
                msg('<div>' + lesc(s.error || 'No channels') + '</div>');
                return;
              }
              setTimeout(load, 2000);
              return;
            }
            groups = x.groups;
            chans = x.channels.map(function (r) {
              return {
                num: r[0],
                id: r[1],
                name: r[2],
                group: r[3],
                logo: r[4],
                url: r[5],
                key: r[6] || '',
                cc: r[7] || '',
                lang: r[8] || '',
                q: r[9] || '',
                fl: r[10] || 0,
                cats: r[11] || (r[3] ? [r[3]] : []),
                alt: (r[12] || []).map(function (a) {
                  return { url: a[0], q: a[1] };
                }),
              };
            });
            byNum = {};
            byKey = {};
            chans.forEach(function (c) {
              byNum[c.num] = c;
              if (c.key) byKey[c.key] = c;
            });
            loaded = true;
            facets();
            var last = 0;
            try {
              last = parseInt(localStorage.getItem('live.last'), 10);
            } catch (e) {}
            api('/api/live/state')
              .then(
                function (st) {
                  S = { fav: st.fav || [], recent: st.recent || [], failed: st.failed || {} };
                },
                function () {}
              )
              .then(function () {
                layer('lv-msg', false);
                play(byNum[last] ? last : chans[0].num);
                if (guideNext) {
                  guideNext = false;
                  openList();
                }
              });
          });
        })();
      })
      .catch(function () {
        msg('<div>' + t('The helper is not reachable.') + '</div>');
        setTimeout(function () {
          if (o.on) boot();
        }, 3000);
      });
  }
  function step(d) {
    var i = chans.indexOf(byNum[cur]);
    i = (i + d + chans.length) % chans.length;
    play(chans[i].num, false, 180);
  }
  var guideNext = false;
  o.enter = function (guide) {
    o.on = true;
    guideNext = !!guide;
    $('lv').classList.add('on');
    if (loaded && byNum[cur]) {
      play(cur);
      if (guideNext) {
        guideNext = false;
        openList();
      }
    } else boot();
  };
  /* playback the TV paused while it hid the window for a moment (see liveGuard in input.js) */
  o.resume = function () {
    if (o.on && video && video.paused) {
      try {
        var r = video.play();
        if (r && r.catch) r.catch(function () {});
      } catch (e) {}
    }
  };
  o.toggleGuide = function () {
    if (!loaded) return;
    if (L.open) closeList();
    else {
      M.open = false;
      layer('lv-menu', false);
      openList();
    }
  };
  o.exit = function () {
    o.on = false;
    closeList();
    M.open = false;
    layer('lv-menu', false);
    setStats(false);
    full = {};
    release();
    clearTimeout(osdT);
    clearTimeout(numT);
    clearTimeout(toastT);
    clearInterval(setupT);
    layer('lv-osd', false);
    layer('lv-numin', false);
    layer('lv-msg', false);
    layer('lv-spin', false);
    layer('lv-tune', false);
    layer('lv-toast', false);
    $('lv').classList.remove('on');
  };
  o.key = function (e) {
    var k = e.keyCode;
    if (searching) {
      /* the input has the keys; only Enter and Back are ours */
      if (k === 13) {
        e.preventDefault();
        endSearch(true);
      } else if (k === 461 || k === 27) {
        e.preventDefault();
        if (Q) endSearch(false);
        else endSearch(true);
      }
      return;
    }
    e.preventDefault();
    if (!loaded) {
      if (k === 461 || k === 27 || k === 8) o.exit();
      return;
    }
    if (FP.open) {
      filterKey(k);
      return;
    }
    if (M.open) {
      menuKey(k);
      return;
    }
    if (L.open) {
      var n7 = 7;
      if (k === 38) {
        if (L.ci > 0) L.ci--;
      } else if (k === 40) {
        if (L.ci < L.list.length - 1) L.ci++;
      } else if (k === 33 || k === 427) {
        L.ci = Math.max(0, L.ci - n7);
      } else if (k === 34 || k === 428) {
        L.ci = Math.min(L.list.length - 1, L.ci + n7);
      } else if (k === 37) {
        if (L.g > 0) {
          L.g--;
          L.list = listFor(L.g);
          L.ci = 0;
        }
      } else if (k === 39) {
        if (L.g < groups.length + 2) {
          L.g++;
          L.list = listFor(L.g);
          L.ci = 0;
        }
      } else if (k === 13) {
        if (L.list[L.ci]) {
          var n = L.list[L.ci].num;
          closeList();
          play(n);
          return;
        }
      } else if (k === 458) {
        closeList();
        return;
      } else if (k === 404) {
        toggleFav(L.list[L.ci]);
        return;
      } else if (k === 405) {
        FP.open = true;
        FP.i = 0;
        drawFilter();
        layer('lv-filter', true);
        return;
      } else if (k === 403) {
        startSearch();
        return;
      } else if (k === 461 || k === 27 || k === 8) {
        if (Q || F.cc || F.lang || F.q) {
          Q = '';
          F = { cc: '', lang: '', q: '' };
          relist();
          return;
        }
        closeList();
        return;
      } else if (k >= 48 && k <= 57) {
        closeList();
        digit(k - 48);
        return;
      } else return;
      drawList();
      fetchVisible();
      return;
    }
    if (k === 13) {
      if (failed) play(cur);
      else openList();
    } else if (k === 404) toggleFav(byNum[cur]);
    else if (k === 405) openMenu();
    else if (k === 406) setStats(!stats);
    else if (k === 38 || k === 33 || k === 427) step(1);
    else if (k === 40 || k === 34 || k === 428) step(-1);
    else if (k === 458) openList();
    else if (k === 457 || k === 37 || k === 39) showOsd();
    else if (k >= 48 && k <= 57) digit(k - 48);
    else if (k >= 96 && k <= 105) digit(k - 96);
    else if (k === 461 || k === 27 || k === 8) o.exit();
  };

  /* ---- the pointer (Magic Remote): the same actions as the keys, on every screen ----
     hover selects, a click opens or picks, the wheel scrolls (or zaps while watching), holding a click is the options: a channel's
     favourite in the guide, the player menu on the picture. A click outside a panel closes it. */
  var lvEl = $('lv'),
    holdP = 0,
    heldP = false,
    wheelAt = 0,
    pX = -1,
    pY = -1;
  function near(ev, sel) {
    return ev.target && ev.target.closest ? ev.target.closest(sel) : null;
  }
  function num(el, a) {
    return +el.getAttribute(a);
  }
  lvEl.addEventListener('mousemove', function (ev) {
    if (!o.on || !loaded || searching || Date.now() - lastKey < 1500) return;
    if (pX < 0) {
      pX = ev.clientX;
      pY = ev.clientY;
      return;
    }
    if (Math.abs(ev.clientX - pX) + Math.abs(ev.clientY - pY) < 24) return; // real movement only, as on the home screen
    pX = ev.clientX;
    pY = ev.clientY;
    var el;
    if (FP.open) {
      el = near(ev, '#lv-filter .mrow');
      if (el && num(el, 'data-i') !== FP.i) {
        FP.i = num(el, 'data-i');
        drawFilter();
      }
    } else if (M.open) {
      el = near(ev, '#lv-menu .mrow');
      if (el && num(el, 'data-i') !== M.i) {
        M.i = num(el, 'data-i');
        drawMenu();
      }
    } else if (L.open) {
      el = near(ev, '.crow');
      if (el && num(el, 'data-j') !== L.ci) {
        L.ci = num(el, 'data-j');
        drawList(true);
        fetchVisible();
      }
    } else showOsd();
  });
  lvEl.addEventListener('mousedown', function (ev) {
    heldP = false;
    clearTimeout(holdP);
    if (!o.on || !loaded || searching || FP.open || M.open) return;
    var el = L.open ? near(ev, '.crow') : null;
    if (L.open && !el) return;
    holdP = setTimeout(function () {
      heldP = true;
      if (el) toggleFav(L.list[num(el, 'data-j')]);
      else openMenu();
    }, 650);
  });
  lvEl.addEventListener('mouseup', function () {
    clearTimeout(holdP);
  });
  lvEl.addEventListener('click', function (ev) {
    if (heldP) {
      heldP = false;
      return;
    }
    if (!o.on) return;
    if (searching) {
      if (ev.target.id !== 'lv-search') endSearch(true);
      return;
    }
    if (!loaded) return;
    var el;
    if (FP.open) {
      el = near(ev, '#lv-filter .mrow');
      if (!el) {
        FP.open = false;
        layer('lv-filter', false);
        drawList();
        return;
      }
      FP.i = num(el, 'data-i');
      var r = filterRows()[FP.i];
      if (r.k === 'clear') {
        F = { cc: '', lang: '', q: '' };
        relist();
        drawFilter();
      } else stepFilter(r.k, 1);
      return;
    }
    if (M.open) {
      el = near(ev, '#lv-menu .mrow');
      if (!el) {
        M.open = false;
        layer('lv-menu', false);
        return;
      }
      M.i = num(el, 'data-i');
      M.items[M.i].fn();
      return;
    }
    if (L.open) {
