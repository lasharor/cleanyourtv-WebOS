/* Built for a weak TV GPU: only transform and opacity ever animate; no blur, masks or filters. Everything a theme changes (manager > Theme) is a

:root {

  --spd: 1;
  --glow-op: 1;
  --wall: none;
  --pill-bg: rgba(255, 255, 255, 0.09);
  --pill-ring: rgba(255, 255, 255, 0.1);
  --pill-r: 32px;
  --pill-h: 64px;

  --menu-bg: rgba(5, 6, 9, 0.97);
  --row-r: 30px;
  --clock-l: 96px;
  --clock-r: auto;
  --clock-t: 54px;
  --clock-b: auto;
  --clock-tx: none;
  --clock-ai: flex-start;
  --clock-s: 1;
  --date-s: 1;
  --clock-d: flex;
  --date-d: block;
  --greet-d: none;
  --bar-l: auto;
  --bar-r: 96px;
  --bar-t: 54px;
  --bar-b: auto;
  --bar-tx: none;
  --bar-d: flex;
  --name-d: block;
  --name-x: 96px;
  --name-y: 150px;
  --name-a: left;
  --name-s: 1;
  --view-top: 300px;
  --dock-l: 96px;
  --dock-r: auto;
  --dock-t: 60px;
  --dock-b: auto;
  --dock-tx: none;
  --dock-w: 408px;
  --dock-h: 230px;
  --dock-gap: 32px;
  --dock-rad: 36px;
  --dock-panel: 0;
  --dock-tile-alpha: 1;
  --dock-tile-frost: 0;
  --dock-frost-rgb: 255, 255, 255;
  --dock-pad: 0px;
  --dock-lift: -10px;
  --dock-fs: 1.05;
  --cols: 10;
  --tile-w: 151px;
  --tile-h: 151px;
  --gap-x: 24px;
  --gap-y: 26px;

  --grid-w: 1728px;
  --grid-t: 350px;
  --grid-fs: 1.12;
  --ov-dim: 0.95;

}
* {
  box-sizing: border-box;
  margin: 0;
}
html,
body {

}

}

}

  top: 0;

  height: 1080px;

  pointer-events: none;
}
#clock {

}

#date {

#bar {

  position: absolute;
  left: var(--bar-l);
  right: var(--bar-r);
  top: var(--bar-t);
  bottom: var(--bar-b);
  transform: var(--bar-tx);
  display: var(--bar-d);

}

}
.pill {
  display: flex;
  align-items: center;

}
.pill > * + * {

.pill svg {

}

}

  justify-content: center;
}
[data-bar="flat"] .pill {
  background: none;
  box-shadow: none;
}
[data-labels="hide"] .pill span {
  display: none;
}

#shelf {
  position: absolute;
  left: 0;
  right: 0;
  top: var(--name-y);
  height: 120px;
  padding: 0 var(--name-x);
  text-align: var(--name-a);
  display: var(--name-d);
  z-index: 5;
}
/* Customise > Show app name off */
[data-shelf="off"] #shelf {
  display: none;
}
#name {
  font-size: calc(92px * var(--fs) * var(--name-s));
  font-weight: 700;
  letter-spacing: -0.028em;
  line-height: 1.05;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* the view clips rows as they scroll up under the shelf */
#view {
  position: absolute;
  left: 0;
  top: var(--view-top);
  width: 1920px;
  height: calc(1080px - var(--view-top));
  overflow: hidden;
  z-index: 2;
}
#scroll {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: calc(1080px - var(--view-top));
  transition: transform calc(0.3s * var(--spd)) ease-out;
  will-change: transform;
}
#dock {
  position: absolute;
  left: var(--dock-l);
  right: var(--dock-r);
  top: var(--dock-t);
  bottom: var(--dock-b);
  transform: var(--dock-tx);
  display: flex;
  z-index: 4;
  padding: var(--dock-pad);
  border-radius: calc(var(--dock-rad) + var(--dock-pad));
  background: rgba(255, 255, 255, var(--dock-panel));
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, calc(var(--dock-panel) * 1.4));
}
#dock > * + * {
  margin-left: var(--dock-gap);
}
#grid {
  position: absolute;
  left: var(--grid-l);
  top: var(--grid-t);
  width: var(--grid-w);
  display: grid;
  grid-template-columns: repeat(var(--cols), 1fr);
  gap: var(--gap-y) var(--gap-x);
}
/* an overlay grid: hidden until the focus moves down into it, then dark layer + grid over the screen above the dock */
[data-grid="overlay"] #grid {
  z-index: 3;
  opacity: 0;
  pointer-events: none;
  transition: opacity calc(0.22s * var(--spd)) linear;
}
[data-grid="overlay"].grid-open #grid {
  opacity: 1;
  pointer-events: auto;
}
[data-grid="overlay"] #scroll::before,
[data-grid="push"] #scroll::before {
  content: "";
  position: absolute;
  left: 0;
  top: -1600px;
  width: 1920px;
  height: 4400px;
  z-index: 2;
  opacity: 0;
  pointer-events: none;
  background: rgba(var(--night-rgb), var(--ov-dim));
  transition: opacity calc(0.22s * var(--spd)) linear;
}
[data-grid="overlay"].grid-open #scroll::before,
[data-grid="push"].grid-open #scroll::before {
  opacity: 1;
}
/* push: the grid sits under the dock; focusing it scrolls the dock up and fades the grid in */
[data-grid="push"] #grid {
  z-index: 3;
  opacity: 0;
  pointer-events: none;
  transition: opacity calc(0.25s * var(--spd)) linear;
}
[data-grid="push"].grid-open #grid {
  opacity: 1;
  pointer-events: auto;
}
/* the app name stays with the dock's resting place; with the grid open it would sit among the tiles */
[data-grid="push"] #shelf {
  transition: opacity calc(0.25s * var(--spd)) linear;
}
[data-grid="push"].grid-open #shelf {
  opacity: 0;
}
/* every row of tiles centred, also a last row that is not full. A flex row, spaced with margins: Chromium before 84 (webOS 5 and 6)
   ignores gap in flex, so the tiles touched there and a tenth one fitted in a nine-column row. The grid is widened by one gap so the
   half gaps at the ends cancel out. */
[data-galign="center"] #grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  margin-left: calc(var(--gap-x) / -2);
  width: calc(var(--grid-w) + var(--gap-x));
}
/* the grid's own gap (#grid) would add to the margins where flex gap works: off for the centred row */
[data-galign="center"] #grid {
  gap: 0;
}
[data-galign="center"] #grid .tile {
  width: var(--tile-w);
  margin: 0 calc(var(--gap-x) / 2) var(--gap-y);
}
.tile::after {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  right: 0;
  bottom: 0;
  border-radius: inherit;
  pointer-events: none;
  opacity: var(--gloss);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0) 46%, rgba(0, 0, 0, 0.24));
}

.tile {
  --c: 74, 84, 112;
  --b: 20, 22, 27;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  will-change: transform;
  background: rgb(var(--b));
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, var(--tile-border));
  transition: transform calc(0.12s * var(--spd)) cubic-bezier(0.3, 1.35, 0.5, 1);
}
.snap .tile,
.snap .pill {
  transition: none;
} /* held arrow key: follow the focus without animating each step */
.tile.fill {
  overflow: hidden;
}
.tile.fill img {
  object-fit: fill;
}
.tile.press {
  transform: scale(0.96) !important;
  transition-duration: calc(0.06s * var(--spd));
}
.tile.moving {
  z-index: 10;
  transform: scale(1.08);
  box-shadow: 0 28px 42px rgba(0, 0, 0, 0.75);
}
.tile.moving::before {
  border-style: dashed;
  border-color: var(--accent);
}
.tile.launching {
  opacity: 0.82;
}
.tile.disintegrate-prep {
  transform: scale(0.92) !important;
  transition: transform calc(0.06s * var(--spd)) ease-out !important;
}
.tile.disintegrate {
  pointer-events: none !important;
  will-change: transform, opacity;
  transition:
    transform calc(0.38s * var(--spd)) cubic-bezier(0.2, 0.8, 0.2, 1),
    opacity calc(0.32s * var(--spd)) ease-out !important;
  transform: scale(0.15) !important;
  opacity: 0 !important;
}
.disintegrate-box {
  position: fixed;
  pointer-events: none;
  z-index: 1000;
  overflow: visible;
}
.disintegrate-p {
  position: absolute;
  pointer-events: none;
  border-radius: 50%;
  opacity: 1;
  will-change: transform, opacity;
  transform: translate3d(0, 0, 0) scale(1);
  transition:
    transform calc(0.4s * var(--spd)) cubic-bezier(0.1, 0.85, 0.25, 1),
    opacity calc(0.35s * var(--spd)) ease-out;
}
.tile img {
  object-fit: contain;
}
.tile svg {
  fill: none;
  stroke: var(--ink);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0.9;
}
.tile .t {
  font-size: calc(26px * var(--fs));
  font-weight: 600;
  padding: 12px;
  text-align: center;
  line-height: 1.15;
  opacity: 0.9;
}
/* The focus ring is a pseudo-element with its own radius: Chromium before 94 draws an outline as a rectangle, not around rounded corners. */
.tile.f {
  z-index: 3;
  box-shadow: 0 24px 36px rgba(0, 0, 0, 0.6);
}
.tile.f::before {
  content: "";
  position: absolute;
  pointer-events: none;
  left: calc(-1 * (var(--ring-off) + var(--ring-w)));
  top: calc(-1 * (var(--ring-off) + var(--ring-w)));
  right: calc(-1 * (var(--ring-off) + var(--ring-w)));
  bottom: calc(-1 * (var(--ring-off) + var(--ring-w)));
  border: var(--ring-w) solid var(--focus);
  border-radius: calc(var(--tile-r) + var(--ring-off) + var(--ring-w));
}
#dock .tile.f::before {
  border-radius: calc(var(--dock-rad) + var(--ring-off) + var(--ring-w));
}
/* a tile that crops its picture (overflow: hidden) would cut the ring off: it gets a ring that sits against the tile */
.tile.fill.f::before {
  display: none;
}
.tile.fill.f {
  box-shadow:
    0 0 0 var(--ring-w) var(--focus),
    0 24px 36px rgba(0, 0, 0, 0.6);
}
#dock .tile {
  width: var(--dock-w);
  height: var(--dock-h);
  border-radius: var(--dock-rad);
  /* below 1 the wallpaper shows through the tile (dock.tileAlpha); a tile that fills with app art stays opaque */
  background: rgba(var(--b), var(--dock-tile-alpha));
}
/* frosted glass: a tint over the whole tile and its icon (dock.tileFrost), so the loud brand colour is calmed
   without a floating square (tile and icon dim together); the focused tile keeps its ring and full colour.
   dock.tileFrostColor sets the tint (--dock-frost-rgb): light for a glassy frost, dark to deepen. */
#dock .tile:not(.f)::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  right: 0;
  bottom: 0;
  border-radius: inherit;
  pointer-events: none;
  background: rgba(var(--dock-frost-rgb), var(--dock-tile-frost));
}
#dock .tile img {
  height: calc(56% * var(--icon-s, 1));
  max-width: calc(65% * var(--icon-s, 1));
}
#dock .tile svg {
  width: calc(96px * var(--icon-s, 1));
  height: calc(96px * var(--icon-s, 1));
}
#dock .tile.f {
  transform: translateY(var(--dock-lift)) scale(var(--dock-fs));
}
#grid .tile {
  height: var(--tile-h);
  border-radius: var(--tile-r);
}
#grid .tile img {
  width: calc(64% * var(--icon-s, 1));
  height: calc(64% * var(--icon-s, 1));
  max-width: calc(75% * var(--icon-s, 1));
}
#grid .tile svg {
  width: calc(64px * var(--icon-s, 1));
  height: calc(64px * var(--icon-s, 1));
}
#grid .tile.f {
  transform: scale(var(--grid-fs));
}
#grid .tile.sys {
  flex-direction: column;
}
#grid .tile.sys > * + * {
  margin-top: 8px;
}
.slab {
  font-size: 22px;
  font-weight: 600;
  color: var(--ink2);
}
#grid .tile.sys {
  background: rgba(255, 255, 255, 0.05);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
}
/* an app that is open: a green dot, as in the Inputs picker (a child element: ::before is the focus ring, ::after the gloss) */
.tile .rd {
  position: absolute;
  z-index: 1;
  right: 14px;
  top: 14px;
  width: 14px;
  height: 14px;
  border-radius: 7px;
  background: #1fbf5a;
  box-shadow: 0 0 0 3px rgba(11, 12, 16, 0.85);
  pointer-events: none;
}
#dock .tile .rd {
  right: 20px;
  top: 20px;
  width: 18px;
  height: 18px;
  border-radius: 9px;
}
/* an input pinned to Home: the HDMI symbol over its name, the port under a name; dimmed while nothing is connected */
.tile.inp {
  flex-direction: column;
}
.tile.inp > * + * {
  margin-top: 6px;
}
.tile.inp .slab {
  color: var(--ink);
  max-width: 90%;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.tile.inp .slab.sub {
  font-size: 18px;
  color: var(--ink2);
}
.tile.inp .slab:empty {
  display: none;
}
.tile.inp.off {
  opacity: 0.55;
}
/* in the dock the symbol and the name follow the tile's height, so a small square dock (Horizon) fits them too */
#dock .tile.inp svg {
  width: calc(var(--dock-h) * 0.3);
  height: calc(var(--dock-h) * 0.3);
}
#dock .tile.inp .slab {
  font-size: calc(var(--dock-h) * 0.11);
}
#dock .tile.inp .slab.sub {
  font-size: calc(var(--dock-h) * 0.085);
}

#toast {
  position: absolute;
  bottom: 64px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 40;
  padding: 18px 38px;
  border-radius: 34px;
  font-size: 28px;
  max-width: 1500px; /* a long message (an error with its next step, a long translation) wraps instead of running off the screen */
  width: max-content;
  text-align: center;
  background: var(--panel);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
  opacity: 0;
  pointer-events: none;
}
#toast.on {
  opacity: 1;
}
/* Wallpapers (wall.js): two photo layers that cross-fade and a darkening layer, behind everything; the theme's own background steps back */
.wp,
.wpd {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  opacity: 0;
  pointer-events: none;
}
.wp {
  background-size: cover;
  background-position: center;
  transition: opacity calc(1.2s * var(--spd)) linear;
}
.wp.on,
.wpon .wpd {
  opacity: 1;
}
body.wpon {
  background-image: none;
}
/* cards: small widgets in the theme's slots (app/src/js/cards.js); placed like the clock, from the slot's edges */
#cards {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  z-index: 5;
  pointer-events: none;
}
.card {
  position: absolute;
  left: var(--cl);
  right: var(--cr);
  top: var(--ct);
  bottom: var(--cb);
  transform: var(--ctx);
  overflow: hidden;
  transition: opacity calc(0.25s * var(--spd)) linear;
}
/* text follows the side the slot is on (start and end, so it is mirrored in a right-to-left language) */
.card[data-align="left"] {
  text-align: start;
}
.card[data-align="center"] {
  text-align: center;
}
.card[data-align="right"] {
  text-align: end;
}
/* while the app grid is open, only the cards the theme keeps (grid: keep) stay */
.grid-open .card:not(.keep) {
  opacity: 0;
}
/* the greeting: one line in capitals, like the theme greeting above the clock; the second line (the date) in plain text below */
.card-greeting {
  display: flex;
  flex-direction: column;
  font-size: calc(24px * var(--fs) * var(--date-s));
  color: rgba(245, 246, 248, 0.88);
  line-height: 1.2;
}
.card-greeting .l1,
.card-greeting .l2 {
  flex: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-greeting .l1 {
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.card-greeting .l2 {
  margin-top: 6px;
  font-size: 1.25em;
}
/* a text card: lines of text, a "#" line as a heading, in three sizes */
.card-template {
  color: var(--ink);
  font-size: calc(30px * var(--fs));
  line-height: 1.3;
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
}
.card-template[data-size="small"] {
  font-size: calc(22px * var(--fs));
}
.card-template[data-size="large"] {
  font-size: calc(44px * var(--fs));
}
/* the other line styles of a template: ### a big light line, > a small dim one*/
.card-template .dsp {
  font-size: 1.8em;
  font-weight: 300;
  line-height: 1.1;
}
.card-template .mu {
  font-size: 0.75em;
  color: rgba(245, 246, 248, 0.7);
}
.card-template .hd {
  font-size: 1.6em;
  font-weight: 700;
  line-height: 1.15;
}
/* the weather card: the icon and the temperature, the place and the sky in words, and the next days in a row */
.card-weather {
  color: var(--ink);
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
}
.wx-now {
  display: flex;
  align-items: center;
}
[data-align="right"] .wx-now {
  justify-content: flex-end;
}
[data-align="center"] .wx-now {
  justify-content: center;
}
.wx-i svg {
  display: block;
  width: calc(64px * var(--fs));
  height: calc(64px * var(--fs));
  margin: 0 16px 0 0;
}
.wx-t {
  font-size: calc(64px * var(--fs));
  font-weight: 600;
  line-height: 1;
}
.wx-p,
.wx-none {
  margin-top: 6px;
  font-size: calc(24px * var(--fs));
  color: var(--ink2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.wx-days {
  display: flex;
  margin-top: 16px;
  font-size: calc(22px * var(--fs));
}
[data-align="right"] .wx-days {
  justify-content: flex-end;
}
.wx-days > div {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 96px;
}
.wx-days > div + div {
  margin-left: 18px;
}
.wx-days svg {
  width: 34px;
  height: 34px;
  margin: 6px 0;
}
.wx-days small {
  color: var(--ink2);
  font-size: 1em;
}
/* a list keeps its height to its rows (at most the slot's), and its text starts on the reading side */
.card-ha-entities {
  height: auto !important;
  max-height: var(--ch);
  text-align: start !important;
}
/* Home Assistant cards: an entity (icon, state, name) on a glass panel, a list of entities, a camera picture */
.card-ha-entity,
.card-ha-entities {
  padding: 16px 24px;
  border-radius: calc(var(--tile-r) * 1.2);
  background: var(--pill-bg);
  box-shadow: inset 0 0 0 1px var(--pill-ring);
  color: var(--ink);
}
.card-ha-entity {
  display: flex;
  align-items: center;
  transition:
    transform calc(0.15s * var(--spd)) ease-out,
    background-color calc(0.15s * var(--spd)) linear;
}
.card-ha-entity.on .ha-i {
  color: var(--acc);
}
.card-ha-entity.f {
  background: var(--acc);
  color: var(--acc-ink);
  transform: scale(1.04);
}
.card-ha-entity.f .ha-i,
.card-ha-entity.f .ha-n {
  color: inherit;
}
.ha-i svg {
  display: block;
  width: 48px;
  height: 48px;
  margin-right: 20px;
}
.ha-tx {
  flex: 1;
  min-width: 0;
  text-align: start;
}
.ha-s {
  font-size: calc(40px * var(--fs));
  font-weight: 600;
  line-height: 1.1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ha-n {
  margin-top: 4px;
  font-size: calc(22px * var(--fs));
  color: var(--ink2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ha-title {
  font-size: calc(26px * var(--fs));
  font-weight: 700;
  margin-bottom: 8px;
}
.ha-row {
  display: flex;
  align-items: center;
  padding: 8px 0;
  font-size: calc(24px * var(--fs));
}
.ha-row + .ha-row {
  border-top: 1px solid rgba(255, 255, 255, 0.08);
}
.ha-ri svg {
  display: block;
  width: 28px;
  height: 28px;
  margin-right: 14px;
  color: var(--ink2);
}
.ha-rn {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ha-rs {
  margin-left: 16px;
  font-weight: 600;
  white-space: nowrap;
}
.card-ha-camera {
  border-radius: calc(var(--tile-r) * 1.2);
  background: rgba(0, 0, 0, 0.35);
}
.card-ha-camera img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.card-ha-camera .ha-n {
  padding: 22px 26px;
}
/* Spotify now playing: a pill with the cover (square, unaltered), a small label, the title, the artist and a thin bar;
   the bar's fill grows with a transform, the GPU's only job. A place smaller than 200 high (np-sm) is compact. */
.card-nowplaying {
  display: flex;
  align-items: center;
  box-sizing: border-box;
  padding: 20px;
  color: var(--ink);
  background: rgba(8, 12, 18, 0.62);
  border-radius: 27px;
}
.card-nowplaying .np-art {
  flex: none;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 10px;
  overflow: hidden;
}
.card-nowplaying .np-art {
  transition: transform calc(0.15s * var(--spd)) ease-out;
}
.card-nowplaying .np-art.f {
  box-shadow: 0 0 0 4px var(--focus);
  transform: scale(1.04);
}
.card-nowplaying .np-art {
  position: relative;
}
.card-nowplaying .np-art img {
  position: absolute;
  left: 0;
  top: 0;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: opacity calc(0.45s * var(--spd)) ease-out;
}
.card-nowplaying .np-t {
  flex: 1;
  min-width: 0;
  padding: 0 30px;
  text-align: left;
}
.card-nowplaying .np-s {
  font-size: 22px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  opacity: 0.6;
}
.card-nowplaying .np-n {
  font-size: 40px;
  font-weight: 600;
  margin-top: 2px;
}
.card-nowplaying .np-a {
  font-size: 30px;
  opacity: 0.7;
  margin-top: 2px;
}
.card-nowplaying .np-s,
.card-nowplaying .np-n,
.card-nowplaying .np-a {
  white-space: nowrap;
  overflow: hidden;
  direction: ltr;
}
.card-nowplaying .np-s span,
.card-nowplaying .np-n span,
.card-nowplaying .np-a span {
  display: inline-block;
  unicode-bidi: plaintext;
}
/* the text is wider than the card: it runs to its end and back, resting a while at each end */
.card-nowplaying .np-run span {
  animation: np-fw 10s linear infinite alternate;
}
.card-nowplaying .np-run.np-rtl span {
  animation-name: np-bw;
}
@keyframes np-fw {
  0%,
  18% {
    transform: translateX(0);
  }
  82%,
  100% {
    transform: translateX(var(--np-d));
  }
}
@keyframes np-bw {
  0%,
  18% {
    transform: translateX(var(--np-d));
  }
  82%,
  100% {
    transform: translateX(0);
  }
}
.card-nowplaying .np-bar {
  height: 9px;
  margin-top: 12px;
  border-radius: 5px;
  background: rgba(255, 255, 255, 0.18);
  overflow: hidden;
}
.card-nowplaying .np-bar i {
  display: block;
  height: 100%;
  background: var(--ink);
  transform: scaleX(0);
  transform-origin: 0 50%;
}
.card-nowplaying .np-c {
  display: flex;
  align-items: center;
  margin-top: 18px;
}
.card-nowplaying .np-time {
  flex: none;
  margin-left: auto;
  font-size: 24px;
  opacity: 0.75;
  white-space: nowrap;
  direction: ltr;
}
.card-nowplaying .np-btn {
  flex: none;
  width: 52px;
  height: 52px;
  margin-right: 14px;
  border-radius: 26px;
  color: inherit;
  transition:
    transform calc(0.15s * var(--spd)) ease-out,
    background-color calc(0.15s * var(--spd)) linear;
}
.card-nowplaying .np-btn svg {
  display: block;
  width: 28px;
  height: 28px;
  margin: 12px;
  fill: currentColor;
}
.card-nowplaying .np-btn.f {
  background: var(--acc);
  color: var(--acc-ink);
  transform: scale(1.1);
}
.card-nowplaying.np-sm .np-c {
  display: none;
}
.card-nowplaying.np-sm {
  padding: 0 20px 0 0;
  border-radius: 14px;
}
.card-nowplaying.np-sm .np-art {
  border-radius: 14px 0 0 14px;
}
.card-nowplaying.np-sm .np-t {
  padding: 0 18px;
}
.card-nowplaying.np-sm .np-s {
  font-size: 16px;
}
.card-nowplaying.np-sm .np-n {
  font-size: 28px;
  margin-top: 2px;
}
.card-nowplaying.np-sm .np-a {
  font-size: 22px;
  margin-top: 0;
}
.card-nowplaying.np-sm .np-bar {
  height: 5px;
  margin-top: 8px;
}
/* the Home Assistant weather card: now on the left, the forecast in columns on the right */
.card-ha-weather {
  display: flex;
  align-items: center;
  color: var(--ink);
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
}
.hw-now {
  flex: none;
  min-width: 250px;
  text-align: start;
}
.hw-top {
  display: flex;
  align-items: center;
}
.hw-t {
  font-size: calc(76px * var(--fs));
  font-weight: 600;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.hw-c {
  margin-top: 10px;
  font-size: calc(26px * var(--fs));
  font-weight: 600;
  white-space: nowrap;
}
.hw-f,
.hw-msg {
  margin-top: 4px;
  font-size: calc(22px * var(--fs));
  color: rgba(255, 255, 255, 0.72);
  white-space: nowrap;
}
.hw-fc {
  flex: 1;
  display: flex;
  justify-content: flex-end;
  margin-left: 28px;
  padding-left: 24px;
  border-left: 1px solid rgba(255, 255, 255, 0.16);
}
.hw-fc > div {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 84px;
  font-size: calc(22px * var(--fs));
}
.hw-fc > div + div {
  margin-left: 10px;
}
.hw-d {
  color: rgba(255, 255, 255, 0.75);
  text-transform: capitalize;
  white-space: nowrap;
}
.hw-fc svg {
  width: 38px;
  height: 38px;
  margin: 8px 0;
}
.hw-fc b {
  font-weight: 600;
}
.hw-fc small {
  font-size: 0.9em;
  color: rgba(255, 255, 255, 0.62);
}
.hw-fc i {
  margin-top: 2px;
  font-style: normal;
  font-size: 0.82em;
  color: #9fd3ff;
}
/* OLED care (cards.js): dimmed after three minutes without a key; the slow shift of the whole layer is not animated */
.cards-idle .card {
  opacity: 0.45;
  transition: opacity 2s linear;
}
/* ---------- scenes and the glass clock (scenes.js; after couch-tv, MIT). Layers: photo, shade, glass clock, the scenery cut out of
   the photo, the late-evening dimming; then the rest of Home. Only opacity is animated. ---------- */
@font-face {
  font-family: "CYTV Clock";
  font-weight: 300;
  font-display: block;
  src: url(antonio.woff2) format("woff2");
}
#scenes,
#gsolo {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  pointer-events: none;
}
body.scenes-on {
  background-image: none;
}
/* the scenes take the place of the theme's wallpaper and of Wallpapers */
.scenes-on .wp,
.scenes-on .wpd {
  display: none;
}
.scene {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  display: none;
  opacity: 0;
  transition: opacity calc(1.6s * var(--spd)) ease-in-out;
  will-change: opacity;
}
.scene.ready {
  display: block;
}
.scene.on {
  opacity: 1;
}
.scene .sbg,
.scene .fg,
.scene .shade,
.scene .late {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
}
.scene .sbg,
.scene .fg {
  object-fit: cover;
}
/* after 10 pm the scene dims a little (an overlay, no filter) */
.scene .late {
  background: #000;
  opacity: 0;
  transition: opacity 2s linear;
}
.late .scene .late {
  opacity: 0.28;
}
.gclock {
  position: absolute;
  left: 0;
  right: 0;
  top: 150px;
  text-align: center;
  white-space: nowrap;
  font-family: "CYTV Clock", "Arial Narrow", sans-serif;
  font-weight: 300;
  font-size: 400px;
  line-height: 0.82;
  letter-spacing: -0.02em;
}
.gclock .fill {
  display: block;
  padding: 0.2em 0;
  margin: -0.2em 0;
  color: transparent;
  -webkit-background-clip: text;
  background-clip: text;
  background-size: 1920px 1080px;
  background-repeat: no-repeat;
}
.gclock .rim,
.gclock .sheen {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  bottom: 0;
}
.gclock .rim {
  color: rgba(255, 255, 255, 0.1);
  -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.55);
}
.gclock .sheen {
  color: transparent;
  -webkit-background-clip: text;
  background-clip: text;
  background-image: linear-gradient(
    160deg,
    rgba(255, 255, 255, 0.55) 0%,
    rgba(255, 255, 255, 0) 38%,
    rgba(255, 255, 255, 0) 70%,
    rgba(255, 255, 255, 0.22) 100%
  );
}
/* without scenes: a white frosted fill */
#gsolo .gclock .fill {
  background-image: linear-gradient(170deg, rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0.12));
}
/* the scenes, as in couch-tv: Night pink glass behind the peak */
.s-night .gclock .fill {
  filter: brightness(1.15) saturate(1.2);
  opacity: 0.9;
}
.s-night .gclock .rim {
  color: rgba(255, 200, 215, 0.06);
  -webkit-text-stroke-color: rgba(255, 215, 225, 0.5);
}
/* Golden hour: a little smaller, low enough for the volcano's tip to rise into the digits */
.s-golden .gclock {
  top: 152px;
  font-size: 390px;
}
/* Waterline: the clock on the water; under the line a soft reflection */
.s-water .shade {
  background: linear-gradient(180deg, rgba(0, 12, 24, 0.42) 0%, rgba(0, 12, 24, 0.12) 40%, rgba(0, 0, 0, 0) 52%, rgba(0, 20, 40, 0.5) 100%);
}
.s-water .gclock {
  top: 268px;
  font-size: 420px;
}
.s-water .gclock.under {
  opacity: 0.7;
  transform: translateX(5px);
}
.s-water .gclock.under .rim {
  -webkit-text-stroke-color: rgba(170, 240, 255, 0.5);
}
/* Fog: a big dark clock on the left, sinking into the misty hills */
.s-fog .gclock {
  left: 96px;
  right: auto;
  top: 172px;
  font-size: 470px;
  text-align: left;
}
.s-fog .gclock .fill {
  filter: brightness(0.46) saturate(0.8) contrast(1.1);
  opacity: 0.8;
}
.s-fog .gclock .rim {
  color: transparent;
  -webkit-text-stroke-color: rgba(255, 255, 255, 0.6);
}
.s-fog .gclock .sheen {
  display: none;
}
/* Dawn: warm light at the top, the clock low enough for the ridges to cross it */
.s-dawn .shade {
  background: linear-gradient(180deg, rgba(50, 28, 12, 0.42) 0%, rgba(50, 28, 12, 0) 55%);
}
.s-dawn .gclock {
  top: 230px;
}
/* Custom theme scenes: clock and date position come from CSS variables set per-scene by scenes.js */
.s-custom .gclock {
  top: var(--scene-clock-top, 150px);
  font-size: var(--scene-clock-size, 400px);
}
.s-custom .gclock.under {
  opacity: 0.7;
  transform: translateX(5px);
}
[data-cstyle="glass"].scene-custom #clock {
  top: var(--scene-date-top, 96px);
}
/* with the glass clock the text clock steps aside: only the date stays, centred above the glass clock (each scene places it) */
[data-cstyle="glass"] #time,
[data-cstyle="glass"] #greet {
  display: none;
}
[data-cstyle="glass"] #clock {
  left: 0;
  right: 0;
  top: 96px;
  bottom: auto;
  transform: none;
  justify-content: center;
  height: auto;
}
[data-cstyle="glass"] #date {
  margin: 0;
  padding: 0;
  font-size: calc(34px * var(--date-s));
  font-weight: 500;
  color: #fff;
  text-shadow: 0 2px 18px rgba(0, 0, 0, 0.25);
  white-space: nowrap;
  transition: opacity calc(0.6s * var(--spd)) ease-in-out;
}
[data-cstyle="glass"].scene-night #date {
  color: rgba(255, 232, 238, 0.92);
}
[data-cstyle="glass"].scene-golden #clock {
  top: 106px;
}
[data-cstyle="glass"].scene-water #clock {
  top: 216px;
}
[data-cstyle="glass"].scene-dawn #clock {
  top: 176px;
}
[data-cstyle="glass"].scene-fog #clock {
  left: 104px;
  right: auto;
  top: 116px;
  justify-content: flex-start;
}
[data-cstyle="glass"].scene-fog #date {
  color: #16201d;
  text-shadow: none;
}
/* the light misty sky of Fog: the top buttons turn dark so they stay visible */
.scenes-on.scene-fog .pill:not(.f) {
  background: rgba(22, 32, 29, 0.14);
  box-shadow: inset 0 0 0 1px rgba(22, 32, 29, 0.28);
  color: #16201d;
}
/* custom scenes with darkSky true: same dark pill treatment for bright-sky scenes */
.scenes-on.scene-dark-sky .pill:not(.f) {
  background: rgba(22, 32, 29, 0.14);
  box-shadow: inset 0 0 0 1px rgba(22, 32, 29, 0.28);
  color: #16201d;
}
/* glass cards (cards.style): scenes.js puts the blurred scene behind each one; this is the frame, and the panel without scenes */
[data-cards="glass"] .card-weather,
[data-cards="glass"] .card-ha-weather,
[data-cards="glass"] .card-ha-entity,
[data-cards="glass"] .card-ha-entities,
[data-cards="glass"] .card-ha-camera {
  padding: 22px 28px;
  border-radius: 30px;
  background-color: rgba(30, 20, 28, 0.34);
  box-shadow:
    inset 0 0 0 1px rgba(255, 220, 230, 0.2),
    inset 0 1px 0 rgba(255, 230, 238, 0.22),
    0 24px 60px rgba(0, 0, 0, 0.28);
  text-shadow: 0 1px 8px rgba(0, 0, 0, 0.22);
  color: #fff;
}
[data-cards="glass"] .card-ha-camera {
  padding: 0;
}
[data-cards="glass"] .card-ha-entity.f {
  background-image: none !important;
  background-color: var(--acc);
  color: var(--acc-ink);
  text-shadow: none;
}
/* the app grid over frosted glass (scenes.js #sglass) instead of the dark layer, with scenes and glass cards */
#sglass {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  z-index: 1;
  opacity: 0;
  pointer-events: none;
  background-size:
    100% 100%,
    1920px 1080px;
  transition: opacity calc(0.25s * var(--spd)) linear;
}
.scenes-on[data-cards="glass"].grid-open #sglass {
  opacity: 1;
}
.scenes-on[data-cards="glass"] #scroll::before {
  display: none;
}
/* menus */
#ov {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  z-index: 30;
  background: var(--menu-bg);
  display: flex;
  align-items: center;
  justify-content: center;
}
#ov .panel {
  width: 760px;
  display: flex;
  flex-direction: column;
}
#ov .panel > * + * {
  margin-top: 12px;
}
#ov h2 {
  font-size: 46px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
/* a tabbed menu (Customise): the tabs across the top of the panel; the panel hangs from a fixed place so they do not move from tab to tab */
#ov.tb {
  align-items: flex-start;
}
#ov.tb .panel {
  margin-top: 150px;
}
#ov .mtabs {
  display: flex;
  margin-top: 0;
}
#ov .mt {
  height: 56px;
  padding: 0 28px;
  margin-right: 12px;
  border-radius: var(--row-r);
  font-size: calc(26px * var(--fs));
  font-weight: 500;
  line-height: 56px;
  white-space: nowrap;
  background: var(--panel2);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
  opacity: 0.7;
}
#ov .mt.on {
  background: var(--acc);
  color: var(--acc-ink);
  opacity: 1;
}
.row {
  display: flex;
  align-items: center;
  height: 84px;
  padding: 0 34px;
  border-radius: var(--row-r);
  font-size: calc(30px * var(--fs));
  font-weight: 500;
  background: var(--panel2);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
}
.row > * + * {
  margin-left: 22px;
}
.row svg {
  width: 34px;
  height: 34px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.row .lb {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.row .st {
  font-size: 22px;
  opacity: 0.65;
  /* a long translation (German, Russian) is cut with "...", not wrapped out of the row; the label keeps at least 40% */
  flex: 0 1 auto;
  min-width: 0;
  max-width: 60%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.row.dim {
  opacity: 0.6;
}
.row.f {
  background: var(--acc);
  color: var(--acc-ink);
  opacity: 1;
}
.more {
  height: 22px;
  text-align: center;
  font-size: 20px;
  color: var(--ink2);
}
#ov .msep {
  height: 6px;
}
/* a menu with pictures (Customise > Theme): the list moves right, the focused row's picture and description are on the left */
#ov.ws {
  justify-content: flex-end;
  padding-right: 150px;
}
#ovside {
  position: absolute;
  left: 150px;
  top: 190px;
  width: 820px;
  z-index: 31;
}
#ovside .pvbox {
  width: 820px;
  height: 461px;
  border-radius: var(--row-r);

      p.style.left = Math.round(startX) + 'px';
      p.style.top = Math.round(startY) + 'px';
      box.appendChild(p);

      var angle = (i / N) * 2 * Math.PI + (Math.random() - 0.5) * 0.4;
      var dist = Math.round(65 + Math.random() * 65);
      var dx = Math.round(Math.cos(angle) * dist);
      var dy = Math.round(Math.sin(angle) * dist);
      particles.push({ el: p, dx: dx, dy: dy });
    }

    /* force layout reflow so the browser commits the initial translate3d(0, 0, 0) */
    void box.offsetHeight;

    setTimeout(function () {
      for (var j = 0; j < particles.length; j++) {
        var pt = particles[j];
        pt.el.style.transform = 'translate3d(' + pt.dx + 'px, ' + pt.dy + 'px, 0) scale(0)';
        pt.el.style.opacity = '0';
      }
    }, 20);

    setTimeout(function () {
      box.remove();
      if (el && el.parentNode) el.remove();
      delete tiles[a.id];
      if (done) done();
    }, 400);
  }, 50);
}

  if (stack.length || LIVE.on || PAGER.on || Date.now() - lastKey < 1500) return;
  if (lastMX < 0) {
    lastMX = ev.clientX;
    lastMY = ev.clientY;
    return;
  }
  if (Math.abs(ev.clientX - lastMX) + Math.abs(ev.clientY - lastMY) < 24) return;
  lastMX = ev.clientX;
  lastMY = ev.clientY;
  var el = ev.target.closest ? ev.target.closest('.tile,.pill,.np-btn,.np-art') : null,
    p = el && posOf(el);
  if (p && !(p[0] === r && p[1] === c)) setFocus(p[0], p[1]);
});

document.addEventListener('keydown', function (e) {
  var k = e.keyCode;
  /* a right-to-left layout: Left moves to what is on the left, which is the next tile in the row (Live TV keeps left-to-right) */
  if (rtl() && !LIVE.on && (k === 37 || k === 39)) k = 76 - k;
  lastKey = Date.now();
  if (PAGER.on) {
    PAGER.key(e);
    return;
  }
  if (LIVE.on) {
    LIVE.key(e);
    return;
  }
  if (!stack.length && !moving && PAGES.length && PAGER.pageKey(e)) return; /* the number and colour buttons turn the page */
  if (moving) {
    if (k === 13 || k === 461 || k === 27 || k === 8) {
      stopMoving();
      e.preventDefault();
      return;
    }
    if (k >= 37 && k <= 40) {
      handleMoveKey(k);
      e.preventDefault();
      return;
    }
  }
  if (stack.length) {
    if (k === 13) {
      if (downEnter && Date.now() - lastEnter < 1500) {
        lastEnter = Date.now();
        e.preventDefault();
        return;
      }
      downEnter = true;
      lastEnter = Date.now();
      swallowUp = true;
      /* a row with a hold action (an input in the Inputs list) opens on release; held, it shows its options */
      var mm = stack[stack.length - 1],
        it = mm.items[mm.idx];
      if (it && it.hold) {
        menuHold = it;
        held = false;
        clearTimeout(downT);
        downT = setTimeout(function () {
          held = true;
          it.hold();
        }, 650);
        e.preventDefault();
        return;
      }
    }
    if (menuKey(k)) e.preventDefault();
    return;
  }
  if ((TH.overlay || TH.push) && r >= 2 && (k === 461 || k === 27 || k === 8)) {

    e.preventDefault();
    return;
  } /* Back closes the grid overlay */
  if (k === 461 || k === 27 || k === 8) {
    runningMenu();
    e.preventDefault();
    return;
  } /* Back on the home screen: the running apps */
  var len = rows[r].length;
  if (k >= 37 && k <= 40) {
    var tn = performance.now();

      document.body.classList.add('snap');
      clearTimeout(snapT);
      snapT = setTimeout(function () {
        document.body.classList.remove('snap');

    }
    lastMove = tn;

  /* the buttons of the Spotify card sit under the buttons of the top row: Down from one of those goes to them (Play or Pause), Up from them
     goes back, and Up from the dock goes to the buttons of the top row */
  var cs = ctlStart();
  if (cs >= 0 && k === 40 && r === 0 && !rows[0][c]._b) setFocus(0, ctlAt('toggle') >= 0 ? ctlAt('toggle') : cs);
  else if (cs >= 0 && k === 38 && r === 0 && rows[0][c]._b) setFocus(0, cs - 1);
  else if (cs >= 0 && k === 38 && r === 1 && rows[1] !== rows[0]) setFocus(0, mapCol(len, cs, c));
  else if (k === 37 && c > 0) setFocus(r, c - 1);
  else if (k === 39 && c < len - 1) setFocus(r, c + 1);
  else if (k === 38 && r > 0) setFocus(r - 1, mapCol(len, rows[r - 1].length, c));
  else if (k === 40 && r < rows.length - 1) setFocus(r + 1, mapCol(len, rows[r + 1].length, c));
  else if (k === 13) {
    /* webOS repeats keydown while OK is held, sometimes without e.repeat: only the first one starts the hold timer */
    if (!downEnter || Date.now() - lastEnter > 1500) {
      downEnter = true;
      held = false;
      clearTimeout(downT);
      var t = rows[r][c];
      t.classList.add('press');
      downT = setTimeout(function () {
        held = true;
        t.classList.remove('press');
        options(t);
      }, 650);
    }
    lastEnter = Date.now();
  } else return;
  e.preventDefault();
});
document.addEventListener('keyup', function (e) {
  if (e.keyCode !== 13) return;
  lastKey = Date.now();
  clearTimeout(downT);
  var pr = document.querySelector('.press');
  if (pr) pr.classList.remove('press');
  if (menuHold) {
    var was = held;
    menuHold = null;
    swallowUp = false;
    downEnter = false;
    held = false;
    if (!was) pickMenu();
    return;
  }
  if (swallowUp) {
    swallowUp = false;
    downEnter = false;
    return;
  }
  if (downEnter && !held) act(rows[r][c]);
  downEnter = false;
  held = false;
});
/* Some TVs (an OLED48C16LA, webOS 6, issue 26) hide the Home window for a moment right after a launch with {live:true}, then show
   it again with a relaunch of plain {keepAlive:true}. For 5 s after such a launch, neither closes Live TV. A Home key press is also a
   relaunch with {keepAlive:true} (webOS 25), so that relaunch is only ignored after such a hide. */
var liveGuard = 0,
  liveBlip = false;
function guarded() {
  return LIVE.on && Date.now() < liveGuard;
}
/* launching Home with {inputs:true} opens the Inputs list */
function wantInputs() {
  var p = {};
  try {
    p = JSON.parse(webOSSystem.launchParams || '{}');
  } catch (e) {}
  if (p && p.inputs) {
    closeMenus();
    inputsMenu();
  } else if (p && p.live && liveOn()) {
    closeMenus();
    liveGuard = Date.now() + 5000;
    liveBlip = false;
    LIVE.enter(!!p.guide);
  }
}
document.addEventListener('webOSRelaunch', function () {
  var p = {};
  try {
    p = JSON.parse(webOSSystem.launchParams || '{}');
  } catch (e) {}
  logLine('launcher relaunch ' + JSON.stringify(p).slice(0, 120) + (LIVE.on ? ' (live on)' : ''));
  if (LIVE.on && p && p.guide && liveOn()) {
    LIVE.toggleGuide();
    return;
  } /* the Guide button while Live TV is open */
  if (guarded() && liveBlip && p && p.keepAlive && !p.inputs && !p.live) {
    liveBlip = false;
    LIVE.resume();
    return;
  }
  if (PAGER.on && !(p && p.live)) PAGER.home(); /* Home pressed: back to the first page */
  load();
  refreshSoon();
  PAGER.load();
  wantInputs();
});
document.addEventListener('visibilitychange', function () {
  if (document.hidden) {
    if (guarded()) {
      liveBlip = true;
      logLine('launcher hidden right after a Live TV launch: Live TV stays on');
      return;
    }
    WALL.hidden();
    stopMoving(); /* leaving Home while a tile is moved keeps where it is now */
    SCENES.hidden();
    if (LIVE.on) LIVE.exit();
    closeRunningMenu();
  } else if (guarded()) LIVE.resume();
  else {
    /* hidden in those 5 s and only shown again later: the TV really went elsewhere */
    if (liveBlip && LIVE.on) LIVE.exit();
    liveBlip = false;
    load();
    refreshSoon();
    if (spReady !== null) spotifyStatus(); /* Customise > Spotify, after the manager app's sign-in */
    WALL.shown();
    SCENES.shown();
  }
});

function tick() {
  var d = new Date();
  try {
    $('time').textContent = d.toLocaleTimeString(LOC, clockOpts());
    $('date').textContent = d.toLocaleDateString(LOC, { weekday: 'long', day: 'numeric', month: 'long' });
  } catch (e) {
    $('time').textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }
  /* greeting line (shown only when the theme turns clock.greeting on, with the stacked layout) */
  var g = $('greet');
  if (g) {
    var h = d.getHours();
    g.textContent = h < 12 ? t('Good morning') : h < 18 ? t('Good afternoon') : t('Good evening');
  }
  tickCards();
  SCENES.tick();
}
setInterval(tick, 15000);
tick();
/* ---------- Live TV ----------
   Live TV is a page of the book (addons.js): the page of the bundled iptv add-on (helper/addons-bundled/iptv). This object keeps
   the calls the rest of the launcher makes (enter, exit, key, resume, toggleGuide) and passes them on. */
var LIVE_ICON =
  'data:image/svg+xml;utf8,' +
  encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 130"><rect width="130" height="130" fill="#ef4f5f"/><rect x="25" y="36" width="80" height="54" rx="13" fill="none" stroke="#fff" stroke-width="8"/><path d="M58 52 L58 74 L77 63 Z" fill="#fff"/><path d="M48 104 H82" stroke="#fff" stroke-width="8" stroke-linecap="round"/></svg>'
  );
var LIVE = {
  get on() {
    return PAGER.on && PAGER.id === 'iptv';
  },
  enter: function (guide) {
    PAGER.go('iptv', guide ? { guide: 1 } : null);
  },
  exit: function () {
    if (LIVE.on) PAGER.home();
  },
  resume: function () {
    if (LIVE.on) PAGER.send({ cytv: 'resume' });
  },
  toggleGuide: function () {
    if (LIVE.on) PAGER.send({ cytv: 'guide' });
  },
  key: function (e) {
    PAGER.key(e);
  },
};
/* ---------- pages (helper/addons.js): Home is page 1 of a book, the add-ons are the pages after it ----------
   A page add-on is a web page the service serves (/addon/<id>/...). It takes Home's place, as the next page of a book: Home slides
   away and the page slides in (transform only). The number buttons (1 is Home, 2 the next page, ...) and the colour buttons
   (red Home, green, yellow, blue the next three) switch pages; Back returns to Home. A page that keeps those keys for itself
   (Live TV: digits tune channels) says so in its manifest ("claims"); then only its own keys work there and Back/Home leave it.
   The pages come from GET /api/addons; each page is loaded when you open it and unloaded when you leave it. */
var addonBar = []; /* topbar entries: add-ons with placement "topbar", they open their page */
var stripOn = true; /* the strip that shows the pages on Home (manager > Add-ons) */
var stripPos = ''; /* where the user put it ('' leaves that to the theme) */
var PAGES = []; /* the add-on pages after Home: {id, label, icon, page, claims} */
var PAGER = {
  on: false /* true while a page other than Home shows */,
  id: '',
  busy: 0,
  load: function () {
    api('/api/addons').then(
      function (x) {
        var pages = [],
          bar = [],
          strip = true;
        ((x && x.addons) || [])
          .slice()
          .sort(function (a, b) {
            return a.order - b.order;
          })
          .forEach(function (a) {
            if (a.status !== 'running' || !a.enabled || !a.page || !a.tile || !a.inBook) return;
            pages.push({ id: a.id, label: a.tile.label || a.name, icon: a.tile.icon || 'addon', page: a.page, claims: a.claims || [] });
            if (a.tile.placement === 'topbar')
              bar.push({ label: a.tile.label || a.name, icon: a.tile.icon || 'addon', action: 'addon', addon: a.id, fixed: true });
          });
        strip = !(x && x.book && x.book.strip === false);
        var pos = (x && x.book && x.book.position) || '';
        var sig = JSON.stringify([pages, bar, strip, pos]);
        if (sig === JSON.stringify([PAGES, addonBar, stripOn, stripPos])) return;
        PAGES = pages;
        addonBar = bar;
        stripOn = strip;
        stripPos = pos;
        PAGER.draw();
        rebuild();
      },
      function () {}
    );
  },
  /* The page strip: a coloured dot or a number for each page, so you see what the buttons do. Its look and place come from the theme
     (themeStrip: style, labels, colours, edge, size); the user can put it in one of six places (manager > Add-ons), which wins. */
  draw: function () {
    var s = $('pagestrip');
    if (!s) return;
    var th = themeStrip || {},
      c = {
        show: th.show !== false,
        style: th.style || 'pills',
        labels: th.labels || 'all',
        colors: th.colors || 'colour',
        anchor: th.anchor || 'bottom',
        align: th.align || 'center',
        x: th.x === undefined ? 96 : th.x,
        y: th.y === undefined ? 22 : th.y,
        size: th.size || 1,

      var m = stripPos.split('-');
      c.anchor = m[0];
      c.align = m[1];
      c.x = 96;
      c.y = c.anchor === 'top' ? 8 : 22; /* the top row of Home starts at 54 px */
    }
    var items = [{ id: '', label: t('Home'), icon: 'home' }].concat(PAGES);
    s.textContent = '';
    s.style.display = PAGES.length && stripOn && c.show ? 'flex' : 'none';
    s.setAttribute('data-style', c.style);
    s.setAttribute('data-labels', c.labels);
    s.setAttribute('data-anchor', c.anchor);
    s.setAttribute('data-align', c.align);
    s.style.setProperty('--st-s', String(c.size));
    s.style.setProperty('--st-x', c.x + 'px');
    s.style.setProperty('--st-y', c.y + 'px');

      e.className = 'pg' + (p.id === PAGER.id ? ' cur' : '');

      if (i < 4 && c.colors === 'colour') {

        if (c.style === 'pills') {

          d.className = 'ic';
          d.innerHTML = svg(p.icon);
        } else d.className = 'c' + i;
      } else d.textContent = String(i + 1);
      var l = document.createElement('span');
      l.textContent = p.label;
      e.appendChild(d);
      e.appendChild(l);
      s.appendChild(e);
    });
  },
  index: function (id) {
    for (var i = 0; i < PAGES.length; i++) if (PAGES[i].id === id) return i + 1;
    return id ? -1 : 0;
  },
  claims: function (what) {
    for (var i = 0; i < PAGES.length; i++) if (PAGES[i].id === PAGER.id) return PAGES[i].claims.indexOf(what) >= 0;
    return false;
  },
  /* the page for a number or colour button; false for any other key */
  pageKey: function (e) {
    var k = e.keyCode,
      n = k >= 48 && k <= 57 ? k - 48 : k >= 96 && k <= 105 ? k - 96 : k >= 403 && k <= 406 ? k - 403 + 1 : -1,
      colour = k >= 403 && k <= 406;

    if (PAGER.on && PAGER.claims(colour ? 'colors' : 'digits')) return false;
    var to = n - 1; /* 1 and red: Home; 2 and green: the first page; ... */
    if (to > PAGES.length) return false;
    e.preventDefault();
    PAGER.go(to === 0 ? '' : PAGES[to - 1].id);
    return true;
  },
  /* the page URL: the launcher's language and clock format go with it */
  url: function (p, extra) {
    var q =
      '?lang=' +
      encodeURIComponent(cfg.lang || '') +
      '&clock=' +
      encodeURIComponent(cfg.clock || '') +
      '&loc=' +
      encodeURIComponent(LOC || '');
    for (var k in extra || {}) q += '&' + k + '=' + encodeURIComponent(extra[k]);
    return API + p.page + q;
  },
  frame: function () {
    return document.querySelector('#pages iframe.pgframe');
  },
  /* turn to a page ('' is Home); params are added to its address (Live TV: guide=1) */
  go: function (id, params) {
    if (id === PAGER.id) {
      if (id && params) PAGER.send({ cytv: 'guide' });
      return;
    }
    var to = PAGER.index(id),
      from = PAGER.index(PAGER.id);
    if (to < 0) return;
    var home = $('homepage'),
      old = PAGER.frame(),
      fwd = to > from;
    PAGER.busy++;
    var token = PAGER.busy;
    var nf = null;
    if (id) {
      nf = document.createElement('iframe');
      nf.className = 'pgframe';
      nf.setAttribute('sandbox', 'allow-scripts allow-same-origin');
      nf.setAttribute('allow', 'autoplay');
      nf.style.transform = 'translate3d(' + (fwd ? 1920 : -1920) + 'px,0,0)';
      nf.src = PAGER.url(PAGES[to - 1], params);
      nf.onload = function () {
        try {
          nf.contentWindow.focus();
        } catch (e) {}

          nf.contentWindow.postMessage({ cytv: 'init', vars: PAGER.vars() }, '*');
        } catch (e) {}

    PAGER.id = id;

    setTimeout(function () {
      if (nf) nf.style.transform = 'none';
      else home.style.transform = 'none';
      if (!id) {
        if (old) old.style.transform = 'translate3d(' + (fwd ? -1920 : 1920) + 'px,0,0)';
      } else if (from === 0) home.style.transform = 'translate3d(' + (fwd ? -1920 : 1920) + 'px,0,0)';
      else if (old) old.style.transform = 'translate3d(' + (fwd ? -1920 : 1920) + 'px,0,0)';
    }, 30);
    setTimeout(function () {
      if (token !== PAGER.busy) return; /* turned again meanwhile: that turn cleans up */
      if (old && old.parentNode) old.parentNode.removeChild(old); /* unloading the page stops its video and timers */
      if (id) home.style.visibility = 'hidden'; /* nothing to paint behind the page */

        try {
          window.focus();

  },
  home: function () {
    PAGER.go('');
  },
  /* a message to the page that shows */
  send: function (m) {
    var f = PAGER.frame();
    if (f && f.contentWindow) f.contentWindow.postMessage(m, '*');
  },
  /* the theme's colours, for pages that draw like the launcher (Live TV) */
  vars: function () {
    var cs = getComputedStyle(document.documentElement),
      out = {};

      'ink',
      'ink2',
      'night',
      'night-rgb',
      'panel',
      'panel2',
      'acc',
      'acc-ink',
      'focus',
      'font',
      'fs',
      'spd',
      'pill-bg',
      'pill-ring',
      'row-r',
      'menu-bg',
    ].forEach(function (n) {

  },
  /* a key that reached the launcher while a page shows (the frame did not have the focus) */
  key: function (e) {
    if (PAGER.claims('back') && (e.keyCode === 461 || e.keyCode === 27 || e.keyCode === 8)) return PAGER.pass(e);
    if (PAGER.pageKey(e)) return;
    if (e.keyCode === 461 || e.keyCode === 27 || e.keyCode === 8) {
      e.preventDefault();

      return;
    }

  },
  /* hand a key to the page (it keeps those keys) and give it the focus again */
  pass: function (e) {
    e.preventDefault();

};
window.addEventListener('message', function (ev) {

});
/* first paint straight from the last known layout, then refresh from the helper */

    cfg = cached.cfg || {};

    applyTheme(cfg.theme);
    usage = cached.usage || {};

load();
PAGER.load();
refreshSoon();
wantInputs();
api('/api/frontend-ok', { version: VERSION }).catch(function () {}); // lets the manager know an updated launcher started
