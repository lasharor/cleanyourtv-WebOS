[data-grid="overlay"] #grid {

[data-grid="overlay"] #scroll::before,

.tile {

      tabs = '';
    if (L.g > 0) tabs += '<div class="ctab m">‹</div><div class="ctab">' + lesc(names[L.g - 1]) + '</div>';
    tabs += '<div class="ctab on">' + lesc(names[L.g]) + '</div>';
    if (L.g < names.length - 1) tabs += '<div class="ctab">' + lesc(names[L.g + 1]) + '</div><div class="ctab m">›</div>';
    var ft = filterText();
    if (ft) tabs += '<div class="ctab f">' + lesc(t('Filters') + ': ' + ft) + '</div>';
    setHtml($('lv-gtabs'), tabs);
    $('lv-gclock').textContent = d.toLocaleTimeString(LOC, clockOpts());
    gcolor();
    var N = 7,
      cs = Math.max(0, Math.min(L.ci - 3, L.list.length - N)),
      h = '';
    for (var j = cs; j < Math.min(L.list.length, cs + N); j++) {
      var c = L.list[j],
        e = epgNow[c.id],
        pn = e && e.now;
      h +=
        '<div class="crow' +
        (j === L.ci ? ' f' : '') +
        (c.num === cur ? ' cur' : '') +
        '"><div class="n">' +
        c.num +
        '</div>' +
        (c.logo ? '<img class="lg" src="' + lesc(c.logo) + '" alt="">' : '<div class="lg"></div>') +
        '<div class="t"><div class="nm">' +
        lesc(c.name) +
        '</div><div class="nw">' +
        (pn ? lesc(hm(pn[0]) + '  ' + pn[2]) : e ? '' : lesc(t('No guide data'))) +
        '</div>' +
        (pn ? '<div class="pbar"><i style="width:' + pct(pn, now) + '%"></i></div>' : '') +
        '</div>' +
        badges(c) +
        '</div>';
    }
    if (!L.list.length)
      h =
        '<div class="empty">' +
        lesc(
          t(
            L.g === 1 && !S.fav.length
              ? 'No favourites yet. Press the green button on a channel.'
              : L.g === 2 && !S.recent.length
                ? 'Nothing watched yet.'
                : 'No channels match.'
          )
        ) +
        '</div>';
    setHtml($('lv-rows'), h);
    drawDetail();
  }
  function drawDetail() {
    var c = L.list[L.ci];
    if (!c) {
      setHtml($('lv-detail'), '');
      return;
    }
    var f = full[c.id],
      now = Math.floor(Date.now() / 1000),
      h =
        '<div class="dn">' +
        lesc(c.name) +
        '</div><div class="dg">' +
        lesc(c.cats.join(', ')) +
        '</div><div class="dg">' +
        lesc(facts(c)) +
        '</div>';
    if (f && f.list && f.list.length) {
      var p = f.list[0],
        live = p[0] <= now;
      h +=
        '<div class="card"><div class="dt">' +
        lesc(hm(p[0]) + ' – ' + hm(p[1])) +
        '</div><div class="dp">' +
        lesc(p[2]) +
        '</div>' +
        (p[3] ? '<div class="dd">' + lesc(p[3]) + '</div>' : '') +
        (live ? '<div class="pbar"><i style="width:' + pct(p, now) + '%"></i></div>' : '') +
        '</div>';
      if (f.list.length > 1) {
        h += '<h3>' + t('Later') + '</h3>';
        for (var i = 1; i < Math.min(5, f.list.length); i++)
          h += '<div class="up"><div class="tm">' + hm(f.list[i][0]) + '</div><div class="tt">' + lesc(f.list[i][2]) + '</div></div>';
      }
    } else h += '<div class="card"><div class="dt">' + lesc(f ? t('No guide data') : '…') + '</div></div>';
    setHtml($('lv-detail'), h);
  }
  function fetchVisible() {
    clearTimeout(fetchT);
    fetchT = setTimeout(function () {
      var cs = Math.max(0, Math.min(L.ci - 3, L.list.length - 7)),
        ids = L.list
          .slice(cs, cs + 7)
          .map(function (c) {
            return c.id;
          })
          .filter(function (i) {
            return i && !epgNow[i];
          });
      if (ids.length)
        loadEpg(ids, function () {
          if (L.open) drawList();
        });
      var c = L.list[L.ci];
      if (c && c.id && !full[c.id])
        api('/api/live/epg?full=1&ids=' + encodeURIComponent(c.id))
          .then(function (x) {
            full[c.id] = x[c.id] || { list: [] };
            if (L.open) drawDetail();
          })
          .catch(function () {});
    }, 160);
  }
  function relist() {
    L.list = listFor(L.g);
    L.ci = 0;
    drawList();
    fetchVisible();
  }

  /* search: the TV's own keyboard types into an input; the list follows what is typed */
  function startSearch() {
    searching = true;
    if (L.g > 2) {
      L.g = 0;
      L.list = listFor(0);
      L.ci = 0;
      drawList();
    } /* a search looks through all channels, not one category */
    var i = $('lv-search');
    i.value = Q;
    i.placeholder = t('Search...');
    i.style.display = 'block';
    i.focus();
  }
  function endSearch(keep) {
    if (!searching) return;
    searching = false;
    var i = $('lv-search');
    if (!keep) {
      Q = '';
      i.value = '';
    }
    i.style.display = 'none';
    i.blur();
    if (L.open) relist();
  }
  $('lv-search').addEventListener('input', function () {
    Q = this.value.trim().toLowerCase();
    if (L.open) relist();
  });

  /* filters */
  function fvals(k) {
    return [''].concat(fac[k]);
  }
  function filterRows() {
    return [
      { k: 'cc', label: t('Country'), val: F.cc ? cname(F.cc) : t('All') },
      { k: 'lang', label: t('Language'), val: F.lang || t('All') },
      { k: 'q', label: t('Quality'), val: F.q || t('All') },
      { k: 'clear', label: t('Clear filters'), val: '' },
    ];
  }
  function drawFilter() {
    var r = filterRows(),
      h = '<h3>' + lesc(t('Filters')) + '</h3>';
    for (var i = 0; i < r.length; i++)
      h +=
        '<div class="mrow' +
        (i === FP.i ? ' f' : '') +
        '"><div class="ml">' +
        lesc(r[i].label) +
        '</div><div class="mv">' +
        (r[i].k === 'clear' ? '' : '‹ ') +
        lesc(r[i].val) +
        (r[i].k === 'clear' ? '' : ' ›') +
        '</div></div>';
    setHtml($('lv-filter'), h);
  }
  function stepFilter(k, d) {
    var v = fvals(k),
      i = v.indexOf(F[k]);
    i = (i + d + v.length) % v.length;
    F[k] = v[i];
    relist();
    drawFilter();
  }
  function filterKey(k) {
    if (k === 38) {
      if (FP.i > 0) FP.i--;
    } else if (k === 40) {
      if (FP.i < 3) FP.i++;
    } else if (k === 37 || k === 39) {
      var r = filterRows()[FP.i];
      if (r.k !== 'clear') stepFilter(r.k, k === 37 ? -1 : 1);
      return;
    } else if (k === 13) {
      var r2 = filterRows()[FP.i];
      if (r2.k === 'clear') {
        F = { cc: '', lang: '', q: '' };
        relist();
      } else FP.open = false;
    } else if (k === 405 || k === 461 || k === 27 || k === 8) {
      FP.open = false;
    }
    if (!FP.open) {
      layer('lv-filter', false);
      drawList();
      return;
    }
    drawFilter();
  }

  /* the player menu (Yellow while watching) */
  function menuItems() {
    var c = byNum[cur],
      it = [
        {
          label: t('Favourite'),
          sub: t(isFav(c) ? 'On' : 'Off'),
          fn: function () {
            toggleFav(c);
            drawMenu();
          },
        },
      ];
    if (streams.length > 1)
      streams.forEach(function (s, i) {
        it.push({
          label: t('Stream') + ' ' + (i + 1) + (s.q ? '  ' + s.q : ''),
          sub: i === si ? '✓' : '',
          fn: function () {
            M.open = false;
            layer('lv-menu', false);
            pickStream(i);
          },
        });
      });
    it.push({
      label: t('Statistics'),
      sub: t(stats ? 'On' : 'Off'),
      fn: function () {
        setStats(!stats);
        drawMenu();
      },
    });
    it.push({
      label: t('Close'),
      sub: '',
      fn: function () {
        M.open = false;
        layer('lv-menu', false);
      },
    });
    return it;
  }
  function drawMenu() {
    M.items = menuItems();
    if (M.i >= M.items.length) M.i = M.items.length - 1;
    var h = '<h3>' + lesc(byNum[cur].name) + '</h3>';
    for (var i = 0; i < M.items.length; i++)
      h +=
        '<div class="mrow' +
        (i === M.i ? ' f' : '') +
        '"><div class="ml">' +
        lesc(M.items[i].label) +
        '</div><div class="mv">' +
        lesc(M.items[i].sub) +
        '</div></div>';
    setHtml($('lv-menu'), h);
  }
  function openMenu() {
    M.open = true;
    M.i = 0;
    drawMenu();
    layer('lv-menu', true);
  }
  function menuKey(k) {
    if (k === 38) {
      if (M.i > 0) M.i--;
    } else if (k === 40) {
      if (M.i < M.items.length - 1) M.i++;
    } else if (k === 13) {
      M.items[M.i].fn();
      return;
    } else if (k === 405 || k === 461 || k === 27 || k === 8) {
      M.open = false;
      layer('lv-menu', false);
      return;
    }
    drawMenu();
  }

  /* statistics (Blue while watching): what the TV tells a web page about the picture */
  function statsText() {
    var v = video;
    if (!v) return '';
    var q = v.getVideoPlaybackQuality ? v.getVideoPlaybackQuality() : null,
      ahead = 0;
    try {
      if (v.buffered && v.buffered.length) ahead = v.buffered.end(v.buffered.length - 1) - v.currentTime;
    } catch (e) {}
    return (
      (v.videoWidth ? v.videoWidth + '×' + v.videoHeight : 'no picture') +
      '\n' +
      t('buffer') +
      ' ' +
      ahead.toFixed(1) +
      ' s\n' +
      (q ? t('frames') + ' ' + q.totalVideoFrames + ', ' + t('dropped') + ' ' + q.droppedVideoFrames + '\n' : '') +
      t('Stream') +
      ' ' +
      (si + 1) +
      '/' +
      streams.length +
      (reloads ? '  (' + t('reloaded') + ')' : '')
    );
  }
  function setStats(on) {
    stats = on;
    clearInterval(statsT);
    layer('lv-stats', on);
    if (on) {
      $('lv-stats').textContent = statsText();
      statsT = setInterval(function () {
        $('lv-stats').textContent = statsText();
      }, 1000);
    }
  }

  function digit(d) {
    numBuf += d;
    if (numBuf.length > 5) numBuf = numBuf.slice(-5);
    $('lv-numin').textContent = numBuf;
    layer('lv-numin', true);
    clearTimeout(numT);
    numT = setTimeout(function () {
      var n = parseInt(numBuf, 10);
      numBuf = '';
      layer('lv-numin', false);
      if (byNum[n]) play(n);
      else showOsd();
    }, 1800);
  }
  function setup() {
    api('/api/live/pair', {}).then(function (p) {
      msg(
        '<b>' +
          t('Set up Live TV') +
          '</b><div>' +
          t('Open this address on your phone or computer:') +
          '</div><b>' +
          lesc(p.url) +
          '</b><div>' +
          t('and enter this code:') +
          '</div><b>' +
          lesc(p.code) +
          '</b><div class="small">' +
          t('Then paste your M3U playlist address. This page closes by itself.') +
          '</div>'
      );
      clearInterval(setupT);
      setupT = setInterval(function () {
        if (!o.on) {
          clearInterval(setupT);
          return;
        }
        api('/api/live/status').then(function (s) {
          if (s.configured) {
            clearInterval(setupT);
            boot();
          }
        });
      }, 2500);
    });
  }
  function facets() {
    function top(k) {
      var n = {};
      chans.forEach(function (c) {
        if (c[k]) n[c[k]] = (n[c[k]] || 0) + 1;
      });
      return Object.keys(n)
        .sort(function (a, b) {
          return n[b] - n[a] || (a < b ? -1 : 1);
        })
        .slice(0, 40);
    }
    fac = {
      cc: top('cc'),
      lang: top('lang'),
      q: ['SD', 'HD', 'FHD', '4K'].filter(function (q) {
        return chans.some(function (c) {
          return c.q === q;
        });
      }),
    };
  }
  function boot() {
    msg('<div>' + t('Loading channels...') + '</div>');
    api('/api/live/status')
      .then(function (s) {
        if (!s.configured) {
          setup();
          return;
        }
        var tries = 0;
        (function load() {
          if (!o.on) return;
          api('/api/live/channels').then(function (x) {
            if (!x.channels.length) {
              if (++tries > 40) {
                msg('<div>' + lesc(s.error || 'No channels') + '</div>');
                return;
              }
              setTimeout(load, 2000);
              return;
            }
            groups = x.groups;
            chans = x.channels.map(function (r) {
              return {
                num: r[0],
                id: r[1],
                name: r[2],
                group: r[3],
                logo: r[4],
                url: r[5],
                key: r[6] || '',
                cc: r[7] || '',
                lang: r[8] || '',
                q: r[9] || '',
                fl: r[10] || 0,
                cats: r[11] || (r[3] ? [r[3]] : []),
                alt: (r[12] || []).map(function (a) {
                  return { url: a[0], q: a[1] };
                }),
              };
            });
            byNum = {};
            byKey = {};
            chans.forEach(function (c) {
              byNum[c.num] = c;
              if (c.key) byKey[c.key] = c;
            });
            loaded = true;
            facets();
            var last = 0;
            try {
              last = parseInt(localStorage.getItem('live.last'), 10);
            } catch (e) {}
            api('/api/live/state')
              .then(
                function (st) {
                  S = { fav: st.fav || [], recent: st.recent || [], failed: st.failed || {} };
                },
                function () {}
              )
              .then(function () {
                layer('lv-msg', false);
                play(byNum[last] ? last : chans[0].num);
                if (guideNext) {
                  guideNext = false;
                  openList();
                }
              });
          });
        })();
      })
      .catch(function () {
        msg('<div>' + t('The helper is not reachable.') + '</div>');
        setTimeout(function () {
          if (o.on) boot();
        }, 3000);
      });
  }
  function step(d) {
    var i = chans.indexOf(byNum[cur]);
    i = (i + d + chans.length) % chans.length;
    play(chans[i].num, false, 180);
  }
  var guideNext = false;
  o.enter = function (guide) {
    o.on = true;
    guideNext = !!guide;
    $('lv').classList.add('on');
    if (loaded && byNum[cur]) {
      play(cur);
      if (guideNext) {
        guideNext = false;
        openList();
      }
    } else boot();
  };
  o.toggleGuide = function () {
    if (!loaded) return;
    if (L.open) closeList();
    else {
      M.open = false;
      layer('lv-menu', false);
      openList();
    }
  };
  o.exit = function () {
    o.on = false;
    closeList();
    M.open = false;
    layer('lv-menu', false);
    setStats(false);
    full = {};
    release();
    clearTimeout(osdT);
    clearTimeout(numT);
    clearTimeout(toastT);
    clearInterval(setupT);
    layer('lv-osd', false);
    layer('lv-numin', false);
    layer('lv-msg', false);
    layer('lv-spin', false);
    layer('lv-tune', false);
    layer('lv-toast', false);
    $('lv').classList.remove('on');
  };
  o.key = function (e) {
    var k = e.keyCode;
    if (searching) {
      /* the input has the keys; only Enter and Back are ours */
      if (k === 13) {
        e.preventDefault();
        endSearch(true);
      } else if (k === 461 || k === 27) {
        e.preventDefault();
        if (Q) endSearch(false);
        else endSearch(true);
      }
      return;
    }
    e.preventDefault();
    if (!loaded) {
      if (k === 461 || k === 27 || k === 8) o.exit();
      return;
    }
    if (FP.open) {
      filterKey(k);
      return;
    }
    if (M.open) {
      menuKey(k);
      return;
    }
    if (L.open) {
      var n7 = 7;
      if (k === 38) {
        if (L.ci > 0) L.ci--;
      } else if (k === 40) {
        if (L.ci < L.list.length - 1) L.ci++;
      } else if (k === 33 || k === 427) {
        L.ci = Math.max(0, L.ci - n7);
      } else if (k === 34 || k === 428) {
        L.ci = Math.min(L.list.length - 1, L.ci + n7);
      } else if (k === 37) {
        if (L.g > 0) {
          L.g--;
          L.list = listFor(L.g);
          L.ci = 0;
        }
      } else if (k === 39) {
        if (L.g < groups.length + 2) {
          L.g++;
          L.list = listFor(L.g);
          L.ci = 0;
        }
      } else if (k === 13) {
        if (L.list[L.ci]) {
          var n = L.list[L.ci].num;
          closeList();
          play(n);
          return;
        }
      } else if (k === 458) {
        closeList();
        return;
      } else if (k === 404) {
        toggleFav(L.list[L.ci]);
        return;
      } else if (k === 405) {
        FP.open = true;
        FP.i = 0;
        drawFilter();
        layer('lv-filter', true);
        return;
      } else if (k === 403) {
        startSearch();
        return;
      } else if (k === 461 || k === 27 || k === 8) {
        if (Q || F.cc || F.lang || F.q) {
          Q = '';
          F = { cc: '', lang: '', q: '' };
          relist();
          return;
        }
        closeList();
        return;
      } else if (k >= 48 && k <= 57) {
        closeList();
        digit(k - 48);
        return;
      } else return;
      drawList();
      fetchVisible();
      return;
    }
    if (k === 13) {
      if (failed) play(cur);
      else openList();
    } else if (k === 404) toggleFav(byNum[cur]);
    else if (k === 405) openMenu();
    else if (k === 406) setStats(!stats);
    else if (k === 38 || k === 33 || k === 427) step(1);
    else if (k === 40 || k === 34 || k === 428) step(-1);
    else if (k === 458) openList();
    else if (k === 457 || k === 37 || k === 39) showOsd();
    else if (k >= 48 && k <= 57) digit(k - 48);
    else if (k >= 96 && k <= 105) digit(k - 96);
    else if (k === 461 || k === 27 || k === 8) o.exit();
  };
  return o;
})();
/* first paint straight from the last known layout, then refresh from the helper */
try {
  var cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
  if (cached && cached.apps && cached.apps.length) {
    apps = cached.apps;
    cfg = cached.cfg || {};
    applyTheme(cfg.theme);
    usage = cached.usage || {};
    colors = cached.colors || {};
    rebuild();
    perfMark('launcher cached ' + Math.round(performance.now()));
  }
} catch (e) {}
load();
wantInputs();
api('/api/frontend-ok', { version: VERSION }).catch(function () {}); // lets the manager know an updated launcher started
</script></body></html>
