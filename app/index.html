/* Built for a weak TV GPU: only transform and opacity ever animate; no blur, masks or filters. Everything a theme changes (manager > Theme) is a

:root {

  --night-rgb: 7, 8, 11;

  --focus: #f5f6f8;
  --font: "LG Smart UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --fs: 1;
  --spd: 1;
  --glow-op: 1;
  --wall: none;
  --pill-bg: rgba(255, 255, 255, 0.09);
  --pill-ring: rgba(255, 255, 255, 0.1);
  --pill-r: 32px;
  --pill-h: 64px;
  --bar-gap: 16px;
  --menu-bg: rgba(5, 6, 9, 0.97);
  --row-r: 30px;
  --clock-l: 96px;
  --clock-r: auto;
  --clock-t: 54px;
  --clock-b: auto;
  --clock-tx: none;
  --clock-ai: flex-start;
  --clock-s: 1;
  --date-s: 1;
  --clock-d: flex;
  --date-d: block;
  --greet-d: none;
  --bar-l: auto;
  --bar-r: 96px;
  --bar-t: 54px;
  --bar-b: auto;
  --bar-tx: none;
  --bar-d: flex;
  --name-d: block;
  --name-x: 96px;
  --name-y: 150px;
  --name-a: left;
  --name-s: 1;
  --view-top: 300px;
  --dock-l: 96px;
  --dock-r: auto;
  --dock-t: 60px;
  --dock-b: auto;
  --dock-tx: none;
  --dock-w: 408px;
  --dock-h: 230px;
  --dock-gap: 32px;
  --dock-rad: 36px;
  --dock-panel: 0;
  --dock-tile-alpha: 1;
  --dock-tile-frost: 0;
  --dock-frost-rgb: 255, 255, 255;
  --dock-pad: 0px;
  --dock-lift: -10px;
  --dock-fs: 1.05;
  --cols: 10;
  --tile-w: 151px;
  --tile-h: 151px;
  --gap-x: 24px;
  --gap-y: 26px;
  --tile-r: 34px;
  --grid-l: 96px;
  --grid-w: 1728px;
  --grid-t: 350px;
  --grid-fs: 1.12;
  --ov-dim: 0.95;
  --gloss: 0;

  --ring-off: 4px;
}
* {
  box-sizing: border-box;
  margin: 0;
}
html,
body {
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  background: var(--night);
  color: var(--ink);
  font-family: var(--font);
}
body {
  background-image: var(--wall);
  background-size: 1920px 1080px;
}
::selection {
  background: rgba(255, 255, 255, 0.25);
}

.glow {
  position: absolute;
  left: 0;
  top: 0;

  height: 720px;
  opacity: 0;
  transition: opacity calc(0.35s * var(--spd)) linear;

}

}

#top {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  z-index: 5;
  pointer-events: none;
}
#clock {
  position: absolute;
  left: var(--clock-l);
  right: var(--clock-r);
  top: var(--clock-t);
  bottom: var(--clock-b);

  display: var(--clock-d);
  align-items: center;
  height: 76px;
}
#greet {

  line-height: 1;
}
#time {
  font-size: calc(56px * var(--fs) * var(--clock-s));

}
#date {
  display: var(--date-d);
  font-size: calc(28px * var(--fs) * var(--date-s));

}
[data-clock="stack"] #clock {
  flex-direction: column;
  align-items: var(--clock-ai);
  height: auto;
}
[data-clock="stack"] #greet {
  display: var(--greet-d);
  margin: 0 0 12px 6px;
}

  margin: 8px 0 0 6px;
  padding: 0;
}
#bar {
  pointer-events: auto;
  position: absolute;
  left: var(--bar-l);
  right: var(--bar-r);
  top: var(--bar-t);
  bottom: var(--bar-b);
  transform: var(--bar-tx);
  display: var(--bar-d);
  align-items: center;
  height: calc(var(--pill-h) + 12px);
}
#bar > * + * {

}
.pill {
  display: flex;
  align-items: center;
  height: var(--pill-h);
  padding: 0 30px 0 24px;
  border-radius: var(--pill-r);
  font-size: calc(26px * var(--fs));
  font-weight: 500;
  background: var(--pill-bg);
  box-shadow: inset 0 0 0 1px var(--pill-ring);
  transition: transform calc(0.12s * var(--spd)) cubic-bezier(0.3, 1.35, 0.5, 1);
  will-change: transform;
}
.pill > * + * {
  margin-left: 14px;
}
.pill svg {
  width: 30px;
  height: 30px;
  flex: none;
}
.pill span {
  white-space: nowrap;
  max-width: 300px; /* a long translation is cut with "..." instead of pushing the buttons off the screen */

  text-overflow: ellipsis;
}
.pill.f {
  background: var(--acc);
  color: var(--acc-ink);
  transform: scale(1.07);
}
[data-bar="round"] .pill {
  width: var(--pill-h);
  padding: 0;
  justify-content: center;
}
[data-bar="flat"] .pill {
  background: none;
  box-shadow: none;
}
[data-labels="hide"] .pill span {
  display: none;
}

#shelf {
  position: absolute;
  left: 0;
  right: 0;
  top: var(--name-y);
  height: 120px;
  padding: 0 var(--name-x);
  text-align: var(--name-a);
  display: var(--name-d);
  z-index: 5;
}
/* Customise > Show app name off */
[data-shelf="off"] #shelf {
  display: none;
}
#name {
  font-size: calc(92px * var(--fs) * var(--name-s));
  font-weight: 700;
  letter-spacing: -0.028em;
  line-height: 1.05;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* the view clips rows as they scroll up under the shelf */
#view {
  position: absolute;
  left: 0;
  top: var(--view-top);
  width: 1920px;
  height: calc(1080px - var(--view-top));
  overflow: hidden;
  z-index: 2;
}
#scroll {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: calc(1080px - var(--view-top));
  transition: transform calc(0.3s * var(--spd)) ease-out;
  will-change: transform;
}
#dock {
  position: absolute;
  left: var(--dock-l);
  right: var(--dock-r);
  top: var(--dock-t);
  bottom: var(--dock-b);
  transform: var(--dock-tx);
  display: flex;
  z-index: 4;
  padding: var(--dock-pad);
  border-radius: calc(var(--dock-rad) + var(--dock-pad));
  background: rgba(255, 255, 255, var(--dock-panel));
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, calc(var(--dock-panel) * 1.4));
}
#dock > * + * {
  margin-left: var(--dock-gap);
}
#grid {
  position: absolute;
  left: var(--grid-l);
  top: var(--grid-t);
  width: var(--grid-w);
  display: grid;
  grid-template-columns: repeat(var(--cols), 1fr);
  gap: var(--gap-y) var(--gap-x);
}
/* an overlay grid: hidden until the focus moves down into it, then dark layer + grid over the screen above the dock */
[data-grid="overlay"] #grid {
  z-index: 3;
  opacity: 0;
  pointer-events: none;
  transition: opacity calc(0.22s * var(--spd)) linear;
}
[data-grid="overlay"].grid-open #grid {
  opacity: 1;
  pointer-events: auto;
}
[data-grid="overlay"] #scroll::before,
[data-grid="push"] #scroll::before {
  content: "";
  position: absolute;
  left: 0;
  top: -1600px;
  width: 1920px;
  height: 4400px;
  z-index: 2;
  opacity: 0;
  pointer-events: none;
  background: rgba(var(--night-rgb), var(--ov-dim));
  transition: opacity calc(0.22s * var(--spd)) linear;
}
[data-grid="overlay"].grid-open #scroll::before,
[data-grid="push"].grid-open #scroll::before {
  opacity: 1;
}
/* push: the grid sits under the dock; focusing it scrolls the dock up and fades the grid in */
[data-grid="push"] #grid {
  z-index: 3;
  opacity: 0;
  pointer-events: none;
  transition: opacity calc(0.25s * var(--spd)) linear;
}
[data-grid="push"].grid-open #grid {
  opacity: 1;
  pointer-events: auto;
}
/* the app name stays with the dock's resting place; with the grid open it would sit among the tiles */
[data-grid="push"] #shelf {
  transition: opacity calc(0.25s * var(--spd)) linear;
}
[data-grid="push"].grid-open #shelf {
  opacity: 0;
}
/* every row of tiles centred, also a last row that is not full. A flex row, spaced with margins: Chromium before 84 (webOS 5 and 6)
   ignores gap in flex, so the tiles touched there and a tenth one fitted in a nine-column row. The grid is widened by one gap so the
   half gaps at the ends cancel out. */
[data-galign="center"] #grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  margin-left: calc(var(--gap-x) / -2);
  width: calc(var(--grid-w) + var(--gap-x));
}
/* the grid's own gap (#grid) would add to the margins where flex gap works: off for the centred row */
[data-galign="center"] #grid {
  gap: 0;
}
[data-galign="center"] #grid .tile {
  width: var(--tile-w);
  margin: 0 calc(var(--gap-x) / 2) var(--gap-y);
}
.tile::after {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  right: 0;
  bottom: 0;
  border-radius: inherit;
  pointer-events: none;
  opacity: var(--gloss);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0) 46%, rgba(0, 0, 0, 0.24));
}

.tile {
  --c: 74, 84, 112;
  --b: 20, 22, 27;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  will-change: transform;
  background: rgb(var(--b));
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, var(--tile-border));
  transition: transform calc(0.12s * var(--spd)) cubic-bezier(0.3, 1.35, 0.5, 1);
}
.snap .tile,
.snap .pill {
  transition: none;
} /* held arrow key: follow the focus without animating each step */
.tile.fill {
  overflow: hidden;
}
.tile.fill img {
  object-fit: fill;
}
.tile.press {
  transform: scale(0.96) !important;
  transition-duration: calc(0.06s * var(--spd));
}
.tile.moving {
  z-index: 10;
  transform: scale(1.08);
  box-shadow: 0 28px 42px rgba(0, 0, 0, 0.75);
}
.tile.moving::before {
  border-style: dashed;
  border-color: var(--accent);
}
.tile.launching {
  opacity: 0.82;
}
.tile.disintegrate-prep {
  transform: scale(0.92) !important;
  transition: transform calc(0.06s * var(--spd)) ease-out !important;
}
.tile.disintegrate {
  pointer-events: none !important;
  will-change: transform, opacity;
  transition:
    transform calc(0.38s * var(--spd)) cubic-bezier(0.2, 0.8, 0.2, 1),
    opacity calc(0.32s * var(--spd)) ease-out !important;
  transform: scale(0.15) !important;
  opacity: 0 !important;
}
.disintegrate-box {
  position: fixed;
  pointer-events: none;
  z-index: 1000;
  overflow: visible;
}
.disintegrate-p {
  position: absolute;
  pointer-events: none;
  border-radius: 50%;
  opacity: 1;
  will-change: transform, opacity;
  transform: translate3d(0, 0, 0) scale(1);
  transition:
    transform calc(0.4s * var(--spd)) cubic-bezier(0.1, 0.85, 0.25, 1),
    opacity calc(0.35s * var(--spd)) ease-out;
}
.tile img {
  object-fit: contain;
}
.tile svg {
  fill: none;
  stroke: var(--ink);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0.9;
}
.tile .t {
  font-size: calc(26px * var(--fs));
  font-weight: 600;
  padding: 12px;
  text-align: center;
  line-height: 1.15;
  opacity: 0.9;
}
/* The focus ring is a pseudo-element with its own radius: Chromium before 94 draws an outline as a rectangle, not around rounded corners. */
.tile.f {
  z-index: 3;
  box-shadow: 0 24px 36px rgba(0, 0, 0, 0.6);
}
.tile.f::before {
  content: "";
  position: absolute;
  pointer-events: none;
  left: calc(-1 * (var(--ring-off) + var(--ring-w)));
  top: calc(-1 * (var(--ring-off) + var(--ring-w)));
  right: calc(-1 * (var(--ring-off) + var(--ring-w)));
  bottom: calc(-1 * (var(--ring-off) + var(--ring-w)));
  border: var(--ring-w) solid var(--focus);
  border-radius: calc(var(--tile-r) + var(--ring-off) + var(--ring-w));
}
#dock .tile.f::before {
  border-radius: calc(var(--dock-rad) + var(--ring-off) + var(--ring-w));
}
/* a tile that crops its picture (overflow: hidden) would cut the ring off: it gets a ring that sits against the tile */
.tile.fill.f::before {
  display: none;
}
.tile.fill.f {
  box-shadow:
    0 0 0 var(--ring-w) var(--focus),
    0 24px 36px rgba(0, 0, 0, 0.6);
}
#dock .tile {
  width: var(--dock-w);
  height: var(--dock-h);
  border-radius: var(--dock-rad);
  /* below 1 the wallpaper shows through the tile (dock.tileAlpha); a tile that fills with app art stays opaque */
  background: rgba(var(--b), var(--dock-tile-alpha));
}
/* frosted glass: a tint over the whole tile and its icon (dock.tileFrost), so the loud brand colour is calmed
   without a floating square (tile and icon dim together); the focused tile keeps its ring and full colour.
   dock.tileFrostColor sets the tint (--dock-frost-rgb): light for a glassy frost, dark to deepen. */
#dock .tile:not(.f)::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  right: 0;
  bottom: 0;
  border-radius: inherit;
  pointer-events: none;
  background: rgba(var(--dock-frost-rgb), var(--dock-tile-frost));
}
#dock .tile img {
  height: calc(56% * var(--icon-s, 1));
  max-width: calc(65% * var(--icon-s, 1));
}
#dock .tile svg {
  width: calc(96px * var(--icon-s, 1));
  height: calc(96px * var(--icon-s, 1));
}
#dock .tile.f {
  transform: translateY(var(--dock-lift)) scale(var(--dock-fs));
}
#grid .tile {
  height: var(--tile-h);
  border-radius: var(--tile-r);
}
#grid .tile img {
  width: calc(64% * var(--icon-s, 1));
  height: calc(64% * var(--icon-s, 1));
  max-width: calc(75% * var(--icon-s, 1));
}
#grid .tile svg {
  width: calc(64px * var(--icon-s, 1));
  height: calc(64px * var(--icon-s, 1));
}
#grid .tile.f {
  transform: scale(var(--grid-fs));
}
#grid .tile.sys {
  flex-direction: column;
}
#grid .tile.sys > * + * {
  margin-top: 8px;
}
.slab {
  font-size: 22px;
  font-weight: 600;
  color: var(--ink2);
}
#grid .tile.sys {
  background: rgba(255, 255, 255, 0.05);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
}
/* an app that is open: a green dot, as in the Inputs picker (a child element: ::before is the focus ring, ::after the gloss) */
.tile .rd {
  position: absolute;
  z-index: 1;
  right: 14px;
  top: 14px;
  width: 14px;
  height: 14px;
  border-radius: 7px;
  background: #1fbf5a;
  box-shadow: 0 0 0 3px rgba(11, 12, 16, 0.85);
  pointer-events: none;
}
#dock .tile .rd {
  right: 20px;
  top: 20px;
  width: 18px;
  height: 18px;
  border-radius: 9px;
}
/* an input pinned to Home: the HDMI symbol over its name, the port under a name; dimmed while nothing is connected */
.tile.inp {
  flex-direction: column;
}
.tile.inp > * + * {
  margin-top: 6px;
}
.tile.inp .slab {
  color: var(--ink);
  max-width: 90%;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.tile.inp .slab.sub {
  font-size: 18px;
  color: var(--ink2);
}
.tile.inp .slab:empty {
  display: none;
}
.tile.inp.off {
  opacity: 0.55;
}
/* in the dock the symbol and the name follow the tile's height, so a small square dock (Horizon) fits them too */
#dock .tile.inp svg {
  width: calc(var(--dock-h) * 0.3);
  height: calc(var(--dock-h) * 0.3);
}
#dock .tile.inp .slab {
  font-size: calc(var(--dock-h) * 0.11);
}
#dock .tile.inp .slab.sub {
  font-size: calc(var(--dock-h) * 0.085);
}

#toast {
  position: absolute;
  bottom: 64px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 40;
  padding: 18px 38px;
  border-radius: 34px;
  font-size: 28px;
  max-width: 1500px; /* a long message (an error with its next step, a long translation) wraps instead of running off the screen */
  width: max-content;
  text-align: center;
  background: var(--panel);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
  opacity: 0;
  pointer-events: none;
}
#toast.on {
  opacity: 1;
}
/* Wallpapers (wall.js): two photo layers that cross-fade and a darkening layer, behind everything; the theme's own background steps back */
.wp,
.wpd {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  opacity: 0;
  pointer-events: none;
}
.wp {
  background-size: cover;
  background-position: center;
  transition: opacity calc(1.2s * var(--spd)) linear;
}
.wp.on,
.wpon .wpd {
  opacity: 1;
}
body.wpon {
  background-image: none;
}
/* the credit a photo source asks for (Unsplash: the photographer), small, in the bottom right corner */
#wpc,
#scredit {
  position: absolute;
  right: 40px;
  bottom: 24px;
  max-width: 900px;
  padding: 6px 14px;
  border-radius: 16px;
  background: rgba(0, 0, 0, 0.45);
  color: rgba(255, 255, 255, 0.85);
  font-size: 18px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: none;
}
/* cards: small widgets in the theme's slots (app/src/js/cards.js); placed like the clock, from the slot's edges */
#cards {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  z-index: 5;
  pointer-events: none;
}
.card {
  position: absolute;
  left: var(--cl);
  right: var(--cr);
  top: var(--ct);
  bottom: var(--cb);
  transform: var(--ctx);
  overflow: hidden;
  transition: opacity calc(0.25s * var(--spd)) linear;
}
/* text follows the side the slot is on (start and end, so it is mirrored in a right-to-left language) */
.card[data-align="left"] {
  text-align: start;
}
.card[data-align="center"] {
  text-align: center;
}
.card[data-align="right"] {
  text-align: end;
}
/* while the app grid is open, only the cards the theme keeps (grid: keep) stay */
.grid-open .card:not(.keep) {
  opacity: 0;
}
/* the greeting: one line in capitals, like the theme greeting above the clock; the second line (the date) in plain text below */
.card-greeting {
  display: flex;
  flex-direction: column;
  font-size: calc(24px * var(--fs) * var(--date-s));
  color: rgba(245, 246, 248, 0.88);
  line-height: 1.2;
}
.card-greeting .l1,
.card-greeting .l2 {
  flex: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-greeting .l1 {
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.card-greeting .l2 {
  margin-top: 6px;
  font-size: 1.25em;
}
/* a text card: lines of text, a "#" line as a heading, in three sizes */
.card-template {
  color: var(--ink);
  font-size: calc(30px * var(--fs));
  line-height: 1.3;
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
}
.card-template[data-size="small"] {
  font-size: calc(22px * var(--fs));
}
.card-template[data-size="large"] {
  font-size: calc(44px * var(--fs));
}
/* the other line styles of a template: ### a big light line, > a small dim one*/
.card-template .dsp {
  font-size: 1.8em;
  font-weight: 300;
  line-height: 1.1;
}
.card-template .mu {
  font-size: 0.75em;
  color: rgba(245, 246, 248, 0.7);
}
.card-template .hd {
  font-size: 1.6em;

/* ---------- scenes and the glass clock (scenes.js; after couch-tv, MIT). Layers: photo, shade, glass clock, the scenery cut out of
   the photo, the late-evening dimming; then the rest of Home. Only opacity is animated. ---------- */
@font-face {
  font-family: "CYTV Clock";
  font-weight: 300;
  font-display: block;
  src: url(antonio.woff2) format("woff2");
}
#scenes,
#gsolo {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  pointer-events: none;
}
body.scenes-on {
  background-image: none;
}
/* the scenes take the place of the theme's wallpaper and of Wallpapers */
.scenes-on .wp,
.scenes-on .wpd {
  display: none;
}
.scene {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  display: none;
  opacity: 0;
  transition: opacity calc(1.6s * var(--spd)) ease-in-out;
  will-change: opacity;
}
.scene.ready {
  display: block;
}
.scene.on {
  opacity: 1;
}
.scene .sbg,
.scene .fg,
.scene .shade,
.scene .late {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
}
.scene .sbg,
.scene .fg {
  object-fit: cover;
}
/* after 10 pm the scene dims a little (an overlay, no filter) */
.scene .late {
  background: #000;
  opacity: 0;
  transition: opacity 2s linear;
}
.late .scene .late {
  opacity: 0.28;
}
.gclock {
  position: absolute;
  left: 0;
  right: 0;
  top: 150px;
  text-align: center;
  white-space: nowrap;
  font-family: "CYTV Clock", "Arial Narrow", sans-serif;
  font-weight: 300;
  font-size: 400px;
  line-height: 0.82;
  letter-spacing: -0.02em;
}
.gclock .fill {
  display: block;
  padding: 0.2em 0;
  margin: -0.2em 0;
  color: transparent;
  -webkit-background-clip: text;
  background-clip: text;
  background-size: 1920px 1080px;
  background-repeat: no-repeat;
}
.gclock .rim,
.gclock .sheen {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  bottom: 0;
}
.gclock .rim {
  color: rgba(255, 255, 255, 0.1);
  -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.55);
}
.gclock .sheen {
  color: transparent;
  -webkit-background-clip: text;
  background-clip: text;
  background-image: linear-gradient(
    160deg,
    rgba(255, 255, 255, 0.55) 0%,
    rgba(255, 255, 255, 0) 38%,
    rgba(255, 255, 255, 0) 70%,
    rgba(255, 255, 255, 0.22) 100%
  );
}
/* without scenes: a white frosted fill */
#gsolo .gclock .fill {
  background-image: linear-gradient(170deg, rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0.12));
}
/* the scenes, as in couch-tv: Night pink glass behind the peak */
.s-night .gclock .fill {
  filter: brightness(1.15) saturate(1.2);
  opacity: 0.9;
}
.s-night .gclock .rim {
  color: rgba(255, 200, 215, 0.06);
  -webkit-text-stroke-color: rgba(255, 215, 225, 0.5);
}
/* Golden hour: a little smaller, low enough for the volcano's tip to rise into the digits */
.s-golden .gclock {
  top: 152px;
  font-size: 390px;
}
/* Waterline: the clock on the water; under the line a soft reflection */
.s-water .shade {
  background: linear-gradient(180deg, rgba(0, 12, 24, 0.42) 0%, rgba(0, 12, 24, 0.12) 40%, rgba(0, 0, 0, 0) 52%, rgba(0, 20, 40, 0.5) 100%);
}
.s-water .gclock {
  top: 268px;
  font-size: 420px;
}
.s-water .gclock.under {
  opacity: 0.7;
  transform: translateX(5px);
}
.s-water .gclock.under .rim {
  -webkit-text-stroke-color: rgba(170, 240, 255, 0.5);
}
/* Fog: a big dark clock on the left, sinking into the misty hills */
.s-fog .gclock {
  left: 96px;
  right: auto;
  top: 172px;
  font-size: 470px;
  text-align: left;
}
.s-fog .gclock .fill {
  filter: brightness(0.46) saturate(0.8) contrast(1.1);
  opacity: 0.8;
}
.s-fog .gclock .rim {
  color: transparent;
  -webkit-text-stroke-color: rgba(255, 255, 255, 0.6);
}
.s-fog .gclock .sheen {
  display: none;
}
/* Dawn: warm light at the top, the clock low enough for the ridges to cross it */
.s-dawn .shade {
  background: linear-gradient(180deg, rgba(50, 28, 12, 0.42) 0%, rgba(50, 28, 12, 0) 55%);
}
.s-dawn .gclock {
  top: 230px;
}
/* a scene of an add-on (scenes.js): a photo without a cut-out, darker at the top for the clock and the date, a little at the bottom */
.s-addon .shade {
  background: linear-gradient(180deg, rgba(0, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.08) 45%, rgba(0, 0, 0, 0) 65%, rgba(0, 0, 0, 0.28) 100%);
}
/* Custom theme scenes: clock and date position come from CSS variables set per-scene by scenes.js */
.s-custom .gclock {
  top: var(--scene-clock-top, 150px);
  font-size: var(--scene-clock-size, 400px);
}
.s-custom .gclock.under {
  opacity: 0.7;
  transform: translateX(5px);
}
[data-cstyle="glass"].scene-custom #clock {
  top: var(--scene-date-top, 96px);
}
/* with the glass clock the text clock steps aside: only the date stays, centred above the glass clock (each scene places it) */
[data-cstyle="glass"] #time,
[data-cstyle="glass"] #greet {
  display: none;
}
[data-cstyle="glass"] #clock {
  left: 0;
  right: 0;
  top: 96px;
  bottom: auto;
  transform: none;
  justify-content: center;
  height: auto;
}
[data-cstyle="glass"] #date {
  margin: 0;
  padding: 0;
  font-size: calc(34px * var(--date-s));
  font-weight: 500;
  color: #fff;
  text-shadow: 0 2px 18px rgba(0, 0, 0, 0.25);
  white-space: nowrap;
  transition: opacity calc(0.6s * var(--spd)) ease-in-out;
}
[data-cstyle="glass"].scene-night #date {
  color: rgba(255, 232, 238, 0.92);
}
[data-cstyle="glass"].scene-golden #clock {
  top: 106px;
}
[data-cstyle="glass"].scene-water #clock {
  top: 216px;
}
[data-cstyle="glass"].scene-dawn #clock {
  top: 176px;
}
[data-cstyle="glass"].scene-fog #clock {
  left: 104px;
  right: auto;
  top: 116px;
  justify-content: flex-start;
}
[data-cstyle="glass"].scene-fog #date {
  color: #16201d;
  text-shadow: none;
}
/* the light misty sky of Fog: the top buttons turn dark so they stay visible */
.scenes-on.scene-fog .pill:not(.f) {
  background: rgba(22, 32, 29, 0.14);
  box-shadow: inset 0 0 0 1px rgba(22, 32, 29, 0.28);
  color: #16201d;
}
/* custom scenes with darkSky true: same dark pill treatment for bright-sky scenes */
.scenes-on.scene-dark-sky .pill:not(.f) {
  background: rgba(22, 32, 29, 0.14);
  box-shadow: inset 0 0 0 1px rgba(22, 32, 29, 0.28);
  color: #16201d;
}
/* glass cards (cards.style): scenes.js puts the blurred scene behind each one; this is the frame, and the panel without scenes */
[data-cards="glass"] .card-weather,
[data-cards="glass"] .card-ha-weather,
[data-cards="glass"] .card-ha-entity,
[data-cards="glass"] .card-ha-entities,
[data-cards="glass"] .card-ha-camera,
[data-cards="glass"] .card-frame {
  padding: 22px 28px;
  border-radius: 30px;
  background-color: rgba(30, 20, 28, 0.34);
  box-shadow:
    inset 0 0 0 1px rgba(255, 220, 230, 0.2),
    inset 0 1px 0 rgba(255, 230, 238, 0.22),
    0 24px 60px rgba(0, 0, 0, 0.28);
  text-shadow: 0 1px 8px rgba(0, 0, 0, 0.22);
  color: #fff;
}
[data-cards="glass"] .card-ha-camera {
  padding: 0;
}
.card-ha-entities.ha-dark,
[data-cards="glass"] .card-ha-entities.ha-dark {
  background-color: rgba(12, 18, 28, 0.6);
  background-image: none !important;
  color: #fff;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.65);
}
.card-ha-entities.ha-dark .ha-ri {
  --ink2: rgba(255, 255, 255, 0.9);
}
/* a card with its own page on glass: the page inside the margins of the panel, and the box of its buttons (.card-bw) the same */
[data-cards="glass"] .card-frame > iframe,
[data-cards="glass"] .card-frame > .card-bw {
  left: 18px !important;
  top: 16px !important;
  width: calc(100% - 36px) !important;
  height: calc(100% - 32px) !important;
}
[data-cards="glass"] .card-ha-entity.f {
  background-image: none !important;
  background-color: var(--acc);
  color: var(--acc-ink);
  text-shadow: none;
}
/* the app grid over frosted glass (scenes.js #sglass) instead of the dark layer, with scenes and glass cards */
#sglass {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  z-index: 1;
  opacity: 0;
  pointer-events: none;
  background-size:
    100% 100%,
    1920px 1080px;
  transition: opacity calc(0.25s * var(--spd)) linear;
}
.scenes-on[data-cards="glass"].grid-open #sglass {
  opacity: 1;
}
.scenes-on[data-cards="glass"] #scroll::before {
  display: none;
}

/* a button of a card of an add-on (its page says where): a target for the remote, drawn over the card's frame */
.card-btn {
  position: absolute;
  border-radius: 12px;
  cursor: pointer;
  pointer-events: auto; /* #cards lets no pointer through; the Magic Remote needs the buttons */
}
.card-btn.f {
  background: rgba(255, 255, 255, 0.14);
  box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.9); /* inside: a button as big as its card would lose a ring outside it to the card's clip */
}
/* the focus the card asks for: a ring around a cover, a filled round button (the Spotify card, as it was drawn by the launcher itself) */
.card-btn-ring,
.card-btn-fill {
  transition:
    transform calc(0.15s * var(--spd)) ease-out,
    background-color calc(0.15s * var(--spd)) linear;
}
.card-btn-ring.f {
  background: none;
  box-shadow: 0 0 0 4px var(--focus);
  transform: scale(1.04);
}
.card-btn-fill.f {
  background: var(--acc);
  box-shadow: none;
  transform: scale(1.1);
}
/* the pointer (Magic Remote, mouse, touchpad) over a button shows the same as the focus does */
.card-btn:hover {
  background: rgba(255, 255, 255, 0.14);
  box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.9);
}
.card-btn-ring:hover {
  background: none;
  box-shadow: 0 0 0 4px var(--focus);
  transform: scale(1.04);
}
.card-btn-fill:hover {
  background: var(--acc);
  box-shadow: none;
  transform: scale(1.1);
}
/* menus */

  top: 0;

/* the city typed in a card's settings (cardsettings.js) above the sheet; the TV's keyboard types into it */
#csq {

function disintegrateApp(a, done) {
  var el = tiles[a.id];
  if (!el || !el.parentNode) {
    if (done) done();
    return;
  }
  var rect = el.getBoundingClientRect();
  var col = el.style.getPropertyValue('--c') || '120, 140, 180';

  el.classList.add('disintegrate-prep');

  setTimeout(function () {
    el.classList.remove('disintegrate-prep');
    el.classList.add('disintegrate');

    var box = document.createElement('div');
    box.className = 'disintegrate-box';
    box.style.left = Math.round(rect.left) + 'px';
    box.style.top = Math.round(rect.top) + 'px';
    box.style.width = Math.round(rect.width) + 'px';
    box.style.height = Math.round(rect.height) + 'px';
    document.body.appendChild(box);

    var N = 10;
    var particles = [];
    for (var i = 0; i < N; i++) {
      var p = document.createElement('span');
      p.className = 'disintegrate-p';
      var size = Math.floor(7 + Math.random() * 6);
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.background = i % 2 === 0 ? 'rgb(' + col + ')' : 'rgba(255, 255, 255, 0.85)';

      var startX = rect.width / 2 - size / 2;
      var startY = rect.height / 2 - size / 2;
      p.style.left = Math.round(startX) + 'px';
      p.style.top = Math.round(startY) + 'px';
      box.appendChild(p);

      var angle = (i / N) * 2 * Math.PI + (Math.random() - 0.5) * 0.4;
      var dist = Math.round(65 + Math.random() * 65);
      var dx = Math.round(Math.cos(angle) * dist);
      var dy = Math.round(Math.sin(angle) * dist);
      particles.push({ el: p, dx: dx, dy: dy });
    }

    /* force layout reflow so the browser commits the initial translate3d(0, 0, 0) */
    void box.offsetHeight;

    setTimeout(function () {
      for (var j = 0; j < particles.length; j++) {
        var pt = particles[j];
        pt.el.style.transform = 'translate3d(' + pt.dx + 'px, ' + pt.dy + 'px, 0) scale(0)';
        pt.el.style.opacity = '0';
      }
    }, 20);

    setTimeout(function () {
      box.remove();
      if (el && el.parentNode) el.remove();
      delete tiles[a.id];
      if (done) done();
    }, 400);
  }, 50);
}

/* Power off completely (issue 50): the TV switches off for good, unlike the remote's power key, which keeps Quick Start+ standby. The
   next start is a cold boot, so the launcher takes its usual time, and Wake-on-LAN does not wake the TV. Asked first, never one press. */
function confirmPowerOff() {

    {

      icon: 'power',

function confirmUninstall(a) {
  openMenu(t('Uninstall %s?').replace('%s', a.title), [
    {
      label: t('Uninstall'),
      icon: 'trash',
      fn: function () {
        closeMenus();
        toast(t('Uninstalling %s...').replace('%s', a.title));
        /* the tile goes only once the TV has removed the app; a failed removal leaves Home, the dock and the hidden list as they were */
        api('/api/apps/uninstall', { id: a.id })
          .then(
            function (res) {
              return res;
            },
            function () {
              return { returnValue: false };
            }
          )
          .then(function (res) {
            if (!res || !res.returnValue) {
              toast(t('Could not uninstall %s.').replace('%s', a.title), true);
              return;
            }
            disintegrateApp(a, function () {
              apps = apps.filter(function (x) {
                return x.id !== a.id;
              });
              if (cfg.dock)
                cfg.dock = cfg.dock.filter(function (x) {
                  return x !== a.id;
                });
              if (cfg.hidden)
                cfg.hidden = cfg.hidden.filter(function (x) {
                  return x !== a.id;
                });
              delete tiles[a.id];
              store();
              lastSig = '';
              rebuild();
              if (rows[r]) {
                c = Math.min(c, rows[r].length - 1);
                if (rows[r][c]) setFocus(r, c);
              }
              toast(t('%s uninstalled.').replace('%s', a.title));
              load();
            });
          });
      },
    },
    {
      label: t('Cancel'),
      fn: function () {
        backMenu();
      },
    },
  ]);
}

      nf.style.transform = instant ? 'none' : 'translate3d(' + (fwd ? 1920 : -1920) + 'px,0,0)';
      if (instant) nf.style.transition = 'none';
      nf.src = PAGER.url(PAGES[to - 1], params);
      nf.onload = function () {
        try {
          nf.contentWindow.focus();
        } catch (e) {}
        try {
          nf.contentWindow.postMessage({ cytv: 'init', vars: PAGER.vars() }, '*');
        } catch (e) {}
      };
      $('pages').appendChild(nf);
    } else {
      home.style.visibility = 'visible';
    }
    if (instant && id) home.style.visibility = 'hidden';
    PAGER.on = !!id;
    PAGER.id = id;
    PAGER.draw();
    /* one frame later the transforms change, and the CSS transition turns the page */
    setTimeout(function () {
      if (nf) nf.style.transform = 'none';
      else home.style.transform = 'none';
      if (!id) {
        if (old) old.style.transform = 'translate3d(' + (fwd ? -1920 : 1920) + 'px,0,0)';
      } else if (from === 0) home.style.transform = 'translate3d(' + (fwd ? -1920 : 1920) + 'px,0,0)';
      else if (old) old.style.transform = 'translate3d(' + (fwd ? -1920 : 1920) + 'px,0,0)';
    }, 30);
    setTimeout(function () {
      if (token !== PAGER.busy) return; /* turned again meanwhile: that turn cleans up */
      if (old && old.parentNode) old.parentNode.removeChild(old); /* unloading the page stops its video and timers */
      if (id) home.style.visibility = 'hidden'; /* nothing to paint behind the page */
      else {
        try {
          window.focus();
        } catch (e) {}
      }
    }, 380);
    logLine('page ' + (id || 'home'));
    PAGER.report();
  },
  home: function () {
    PAGER.go('');
  },
  /* The service binds the remote's Home key only while a page shows (helper/book.js: the code learned in the manager, else 773): a
     press then asks webOS for Home, which is the relaunch handled in input.js. It is told on each turn, every 30 s while a page shows
     (a restarted service starts with no page) and when the launcher is shown again. Hiding the window does not unbind the key: some
     TVs report the window hidden while it is on screen, and a bind left in place while another app is in front only makes Home open
     Home, which it does anyway. */
  report: function () {
    clearTimeout(PAGER.hb);
    PAGER.hb = 0;
    var id = PAGER.on ? PAGER.id : '';
    api('/api/book/page', { id: id }).then(
      function () {},
      function () {}
    );
    if (id) PAGER.hb = setTimeout(PAGER.report, 30000);
  },
  /* a message to the page that shows */
  send: function (m) {
    var f = PAGER.frame();
    if (f && f.contentWindow) f.contentWindow.postMessage(m, '*');
  },
  /* the theme's colours, for pages that draw like the launcher (Live TV) */
  vars: function () {
    var cs = getComputedStyle(document.documentElement),
      out = {};
    [
      'ink',
      'ink2',
      'night',
      'night-rgb',
      'panel',
      'panel2',
      'acc',
      'acc-ink',
      'focus',
      'font',
      'fs',
      'spd',
      'pill-bg',
      'pill-ring',
      'row-r',
      'menu-bg',
    ].forEach(function (n) {
      out[n] = cs.getPropertyValue('--' + n).trim();
    });
    return out;
  },
  /* a key that reached the launcher while a page shows (the frame did not have the focus) */
  key: function (e) {
    if (PAGER.claims('back') && (e.keyCode === 461 || e.keyCode === 27 || e.keyCode === 8)) return PAGER.pass(e);
    if (PAGER.pageKey(e)) return;
    if (e.keyCode === 461 || e.keyCode === 27 || e.keyCode === 8) {
      e.preventDefault();
      PAGER.home();
      return;
    }
    if (PAGER.claims('digits') || PAGER.claims('colors') || PAGER.claims('back')) PAGER.pass(e);
  },
  /* hand a key to the page (it keeps those keys) and give it the focus again */
  pass: function (e) {
    e.preventDefault();
    PAGER.send({ cytv: 'key', keyCode: e.keyCode });
    var f = PAGER.frame();
    try {
      if (f) f.contentWindow.focus();
    } catch (x) {}
  },
};
window.addEventListener('message', function (ev) {
  var d = ev.data;
  if (!PAGER.on || !d || d.id !== PAGER.id) return;
  if (d.cytvAddon === 'close') {
    var back = guideFrom && d.id === guidePage() ? guideFrom : '';
    logLine('guide closed, back to ' + (back || 'home'));
    guideFrom = '';
    PAGER.home();
    if (back) launch(back); /* Back in the guide goes to what was playing */
  } else if (d.cytvAddon === 'pagekey') PAGER.pageKey({ keyCode: d.keyCode, preventDefault: function () {} });
});
/* first paint straight from the last known layout, then refresh from the helper */
try {
  var cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
  if (cached && cached.apps && cached.apps.length) {
    apps = cached.apps;
    cfg = cached.cfg || {};
    useLang(cfg.lang);
    applyTheme(cfg.theme);
    usage = cached.usage || {};
    colors = cached.colors || {};
    rebuild();
    perfMark('launcher cached ' + Math.round(performance.now()));
  }
} catch (e) {}
load();
var pagesLoaded = PAGER.load();
/* a launcher that starts again shows Home: the service is told so before a launch parameter can turn to a page ({live:true}) */
pagesLoaded.then(function () {
  PAGER.report();
});
refreshSoon();
wantInputs(pagesLoaded);
api('/api/frontend-ok', { version: VERSION }).catch(function () {}); // lets the manager know an updated launcher started
</script></body></html>
