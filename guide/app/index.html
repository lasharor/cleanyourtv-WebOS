<!doctype html>
<html><head><meta charset="utf-8"><title>Guide</title>
<style>
*{box-sizing:border-box;margin:0}
:root{--ink:#f5f6f8;--ink2:rgba(245,246,248,.66);--font:"LG Smart UI","Helvetica Neue",Helvetica,Arial,sans-serif;--panel:#1a1c22;--panel2:#262932;--acc:#f5f6f8;--acc-ink:#0b0c10;--now:#ef4f5f}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;color:var(--ink);font-family:var(--font)}
/* the picture of the channel stays visible in the top part; the guide sits on a dark foot */
#dim{position:absolute;left:0;top:0;width:1920px;height:1080px;opacity:0;background:linear-gradient(to bottom,rgba(8,9,13,0) 0,rgba(8,9,13,.55) 230px,rgba(8,9,13,.95) 400px,rgba(8,9,13,.97) 100%)}
#ui{position:absolute;left:0;top:0;width:1920px;height:1080px;opacity:0}
.on #dim,.on #ui{opacity:1}
#info{position:absolute;left:96px;top:236px;width:1500px;height:200px}
#ititle{font-size:46px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#imeta{margin-top:8px;font-size:27px;font-weight:600;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#idesc{margin-top:12px;font-size:26px;line-height:1.3;color:var(--ink2);height:68px;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
#head{position:absolute;left:96px;top:458px;width:1728px;height:48px}
.tick{position:absolute;top:0;height:48px;font-size:26px;font-weight:600;color:var(--ink2);line-height:48px;padding-left:12px;border-left:2px solid rgba(255,255,255,.14);white-space:nowrap}
#day{position:absolute;left:0;top:0;width:280px;height:48px;font-size:26px;font-weight:700;line-height:48px;color:var(--ink)}
#grid{position:absolute;left:96px;top:512px;width:1728px;height:518px;overflow:hidden}
#rows{position:absolute;left:0;top:0;width:1728px;height:518px}
.row{position:absolute;left:0;width:1728px;height:70px}
.cell{position:absolute;left:0;top:0;width:276px;height:66px;padding:0 18px;border-radius:12px;background:var(--panel2);display:flex;align-items:center;overflow:hidden}
.cell .n{flex:none;width:62px;font-size:28px;font-weight:700;color:var(--ink2)}
.cell .nm{flex:1 1 auto;min-width:0;font-size:28px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.sel .cell{background:var(--acc);color:var(--acc-ink)}.row.sel .cell .n{color:var(--acc-ink);opacity:.7}
.prog{position:absolute;top:0;height:66px;padding:7px 14px 0;border-radius:12px;background:var(--panel);overflow:hidden;white-space:nowrap;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.prog .t{font-size:27px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.prog .h{font-size:20px;font-weight:500;color:var(--ink2);margin-top:1px;overflow:hidden;text-overflow:ellipsis}
.prog.cur{background:#2c3040}
.prog.nod{background:transparent;box-shadow:none;color:var(--ink2)}
.prog.f{background:var(--acc);color:var(--acc-ink);box-shadow:0 0 0 4px var(--acc-ink),0 0 0 7px var(--acc)}
.prog.f .h{color:var(--acc-ink);opacity:.7}
#nowline{position:absolute;top:458px;width:3px;height:572px;background:var(--now);opacity:.85}
#msg{position:absolute;left:96px;top:700px;width:1728px;text-align:center;font-size:34px;font-weight:600;color:var(--ink)}
#msg:empty{display:none}
#dial{position:absolute;right:96px;top:226px;font-size:84px;font-weight:700;letter-spacing:.04em;color:var(--ink)}
#dial:empty{display:none}
</style></head><body>
<div id="dim"></div>
<div id="ui">
  <div id="info"><div id="ititle"></div><div id="imeta"></div><div id="idesc"></div></div>
  <div id="head"></div>
  <div id="grid"><div id="rows"></div></div>
  <div id="nowline" style="display:none"></div>
  <div id="dial"></div>
  <div id="msg"></div>
</div>

  hd.innerHTML = h;
  var n = now(), nl = $('nowline');
  if (n >= ws && n < ws + WIN) { nl.style.left = 96 + LEFT + xOf(n) + 'px'; nl.style.display = 'block'; } else nl.style.display = 'none';
  var c = chs[idx], p = c && progAt(idx, ct);
  $('ititle').textContent = p ? p[2] : c ? c.name : '';
  $('imeta').textContent = c ? (c.n ? c.n + '  ' : '') + c.name + (p ? '  ·  ' + hm(p[0]) + ' – ' + hm(p[1]) + (p[4] ? '  ·  ' + p[4] : '') : '') : '';
  $('idesc').textContent = p ? p[3] : '';
  $('msg').textContent = !chs.length ? (failed || t('Loading…')) : failed && !epg[c && c.id] ? failed : '';
}
function fit() {
  /* keep the selected time in the window */
  if (ct < ws || ct >= ws + WIN) ws = Math.floor(ct / STEP) * STEP - STEP * (ct < ws ? 4 : 1);
}
/* the first row to draw so that channel i is in view, in the middle when there is room */
function firstFor(i) { return Math.max(0, Math.min(i - 3, chs.length - ROWS)); }
function limit() { var n = now(); ct = Math.max(n - FETCH_BEFORE, Math.min(n + FETCH_AFTER - 60, ct)); }
function moveRow(d) {
  if (!chs.length) return;
  idx = (((idx + d) % chs.length) + chs.length) % chs.length;
  var dd = (((idx - first) % chs.length) + chs.length) % chs.length;
  if (dd >= ROWS) first = d > 0 ? idx - ROWS + 1 : idx;
  first = ((first % chs.length) + chs.length) % chs.length;
  paint(); soon();
}
/* the number buttons dial a channel: each digit moves the selection to the channel with that number (or the first one that starts
   with it); the typed number is shown at the top right and forgotten after a moment. OK then tunes it. */
var dialBuf = '', dialT = 0;
function dialFind(s) {
  var i;
  for (i = 0; i < chs.length; i++) if (chs[i].n === s) return i;
  for (i = 0; i < chs.length; i++) if (chs[i].n.indexOf(s) === 0) return i;
  for (i = 0; i < chs.length; i++) if (String(chs[i].major) === s) return i;
  return -1;
}
function dial(d) {
  if (!chs.length) return;
  dialBuf = dialBuf.length >= 4 ? d : dialBuf + d;
  $('dial').textContent = dialBuf;
  var i = dialFind(dialBuf);
  if (i >= 0) {
    idx = i;
    first = firstFor(i);
    paint(); soon();
  }
  clearTimeout(dialT);
  dialT = setTimeout(function () { dialBuf = ''; $('dial').textContent = ''; }, 1800);
}
function moveTime(d) {
  var p = progAt(idx, ct);
  if (d > 0) ct = p ? p[1] : ct + STEP;
  else { ct = p ? p[0] - 1 : ct - STEP; }
  limit(); fit(); paint();
}
/* LG's own Live TV changes channel when it is started with these parameters (what LG's guide does) */
function tune() {
  var c = chs[idx];
  if (!c) return;
  log('tune ' + c.n + ' ' + c.name);
  store();
  var launch = { id: 'com.webos.app.livetv', params: { id: 'channelChange', channelId: c.cid, sender: 'livemenu' } };
  var x = new XMLHttpRequest(), done = false;
  /* the service launches it; if it does not answer, the system's own bridge does (as the Inputs picker does) */
  function finish(viaSystem) {
    if (done) return;
    done = true;
    if (viaSystem) {
      log('tune: the service did not answer, using the system');
      try { var b = new PalmServiceBridge(); b.onservicecallback = function () {}; b.call('luna://com.webos.applicationManager/launch', JSON.stringify(launch)); } catch (e) {}
    }
    setTimeout(closeGuide, viaSystem ? 300 : 0);
  }
  x.open('POST', API + '/api/launch');
  x.timeout = 5000;
  x.onload = function () { finish(x.status !== 200); };
  x.onerror = x.ontimeout = function () { finish(true); };
  x.send(JSON.stringify(launch));
}
function closeGuide() {
  log('close');
  shown = false;
  clearTimeout(idleT); clearInterval(tickT);
  document.body.classList.remove('on');
  try { if (window.webOS && webOS.platformBack) webOS.platformBack(); } catch (e) {}
  try { window.close(); } catch (e) {}
}
function idle() { clearTimeout(idleT); idleT = setTimeout(function () { if (shown) closeGuide(); }, 60000); }
function show() {
  shown = true; shownAt = Date.now();
  var n = now();
  ct = n; ws = Math.floor(n / STEP) * STEP - STEP;
  if (chs.length) first = firstFor(idx);
  document.body.classList.add('on');
  fit(); paint(); need();
  idle();
  clearInterval(tickT);
  tickT = setInterval(function () { if (shown) paint(); }, 60000);
}
document.addEventListener('keydown', function (e) {
  if (!shown) return;
  idle();
  var k = e.keyCode;
  if ((k >= 48 && k <= 57) || (k >= 96 && k <= 105)) dial(String(k >= 96 ? k - 96 : k - 48));
  else if (k === 38) moveRow(-1);
  else if (k === 40) moveRow(1);
  else if (k === 37) moveTime(-1);
  else if (k === 39) moveTime(1);
  else if (k === 428 || k === 34 || k === 33 || k === 427) moveRow((k === 428 || k === 34 ? 1 : -1) * ROWS);
  else if (k === 13) tune();
  else if (k === 461 || k === 27 || k === 8 || k === 10009 || k === 458) closeGuide();
  e.preventDefault();
});
document.addEventListener('click', function (e) {
  if (!shown) return;
  idle();
  var r = e.target.closest && e.target.closest('[data-i]');
  if (!r) { closeGuide(); return; }
  idx = +r.getAttribute('data-i');
  var s = r.getAttribute('data-s');
  if (s) ct = +s;
  tune();
});
var lastWheel = 0;
document.addEventListener('wheel', function (e) {
  if (!shown || !e.deltaY) return;
  e.preventDefault();
  var n = Date.now();
  if (n - lastWheel < 90) return;
  lastWheel = n; idle(); moveRow(e.deltaY > 0 ? 1 : -1);
}, { passive: false });
/* the Guide key pressed again while the guide is open closes it */
document.addEventListener('webOSRelaunch', function () {
  log('relaunch shown=' + shown);
  if (shown && Date.now() - shownAt > 700) closeGuide();
  else if (!shown) { show(); load(); }
});
/* the channel list, and which channel is on now (the service asks the TV): that one is selected, with the programme on now */
function load() {
  get('/api/tuner/channels', function (j) {
    failed = j.error || '';
    if (j.channels && j.channels.length) {
      var want = j.current || (chs[idx] ? chs[idx].id : ''), i;
      chs = j.channels; idx = 0;
      for (i = 0; i < chs.length; i++) if (chs[i].id === want) idx = i;
      first = firstFor(idx);
      store();
    }
    if (!shown) show(); else { var n = now(); ct = n; ws = Math.floor(n / STEP) * STEP - STEP; paint(); need(); }
  }, function () {
    failed = t('The service did not answer');
    if (!shown) show(); else paint();
  });
}
setLang();
if (restore()) show();
load();
</script></body></html>
